function resize(){

        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        Math.floor(W * dpr);

    canvas.height =
        Math.floor(H * dpr);

    canvas.style.width =
        W + 'px';

    canvas.style.height =
        H + 'px';

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

        false;
}

window.addEventListener(
    'resize',
    resize
);

resize();

let difficulty =

const TRACKS = [
    'ushet.mp3',
    '../bogi.mp3',
    '../gorod.mp3',
    '../Chto.mp3',
    '../Police.mp3',
    '../Big.mp3'
];

const music =
    new Audio();

music.volume =
    .55;

let lastTrack =
    -1;

let musicOn =
    false;

let musicErrors =
    0;


function playRandom(){

    if(
        !TRACKS.length
    ){
        return;
    }

    let index =
        Math.floor(
            Math.random() *
            TRACKS.length
        );

    if(
        TRACKS.length > 1 &&
        index === lastTrack
    ){
        index =
            (index + 1) %
            TRACKS.length;
    }

    lastTrack =
        index;

    music.src =
        TRACKS[index];

    music
        .play()
        .catch(() => {});

}


music.addEventListener(
    'ended',
    playRandom
);


music.addEventListener(
    'error',
    () => {

        musicErrors++;

        if(
            musicErrors < 8
        ){
            setTimeout(
                playRandom,
                100
            );
        }

    }
);

function hit(a,b){

        a.x <
            b.x + b.w &&

        a.x + a.w >
            b.x &&

        a.y <
            b.y + b.h &&

        a.y + a.h >

    );

function drawShieldField(){

        shieldT <= 0 ||
        !state.running
    ){

        player.x +
        player.w / 2;

    const cy =

/* =========================================================
   BACKGROUND
   ========================================================= */

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(
            W * .92,
            h *
            (
                img.naturalWidth /
                img.naturalHeight
            )
        );

    }

    return W * .92;

}


function drawCities(groundY){

    const h =
        groundY + 6;


    const widths =
        cityImgs.map(
            img =>
                cityWidth(
                    img,
                    h
                )
        );


    const total =
        widths.reduce(
            (a,b) => a+b,
            0
        ) || W;


    const scroll =
        (
            state.dist * 2.2
        ) % total;


    let x =
        -scroll;

    let visibleCity =
        state.city;


    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const i =
            n % CITIES.length;

        const w =
            widths[i];

        const img =
            cityImgs[i];


        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(
                img,
                Math.floor(x),
                0,
                Math.ceil(w)+1,
                Math.ceil(h)
            );

        }


        if(
            x <= W * .35 &&
            x + w > W * .35
        ){

            visibleCity =
                i;

        }


        x += w;


        if(x > W + 5){
            break;
        }

    }


    if(
        visibleCity >= 0
    ){
        toastCity(
            visibleCity
        );
    }

}


function drawBackdrop(){

    const gy =
        state.groundY;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            gy
        );


    gradient.addColorStop(
        0,
        '#39245e'
    );

    gradient.addColorStop(
        1,
        '#c45a3a'
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        gy
    );


    drawCities(gy);


    const roadH =
        Math.floor(
            (H - gy) * .46
        );


    ctx.fillStyle =
        '#5b5b63';

    ctx.fillRect(
        0,
        gy,
        W,
        roadH
    );


    ctx.fillStyle =
        '#4a4a52';

    ctx.fillRect(
        0,
        gy,
        W,
        8
    );


    const dash =
        34;

    const shift =
        (
            state.dist / .12
        ) %
        (dash * 2);


    ctx.fillStyle =
        '#e6d36a';


    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy + roadH*.45,
            20,
            4
        );

    }


    ctx.fillStyle =
        '#7a5a3a';

    ctx.fillRect(
        0,
        gy + roadH,
        W,
        H - gy - roadH
    );


    ctx.fillStyle =
        '#6a4a2e';


    const tile =
        26;

    const tileShift =
        (
            state.dist / .12
        ) % tile;


    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(
            x - tileShift,
            gy + roadH + 10,
            12,
            4
        );

    }

}

/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer(dt){

    player.vy +=
        2400 *
        (
            player.vy > 0
            ? 1.75
            : 1
        ) *
        dt;


    player.y +=
        player.vy *
        dt;


    const floor =
        state.groundY -
        player.h;


    if(
        player.y >= floor
    ){

        player.y =
            floor;

        player.vy =
            0;

        player.onGround =
            true;

        player.jumpsUsed =
            0;

    }else{

        player.onGround =
            false;

    }

}


/* =========================================================
   UPDATE OBSTACLES
   ========================================================= */

function updateObstacles(dt){

    for(
        let i =
            obstacles.length - 1;
        i >= 0;
        i--
    ){

        const o =
            obstacles[i];


        o.x -=
            state.speed *
            dt;


        /*
           Важно:
           члены теперь значительно выше.
        */

        if(
            o.type === 'dick'
        ){

            o.y =
                state.groundY -
                o.flyY -
                o.h;

        }else{

            o.y =
                state.groundY -
                o.h -
                (
                    o.type === 'poop'
                    ? 0
                    : 12
                );

        }


        const pBox =
            getPlayerHitbox();

        const oBox =
            getObstacleHitbox(o);


        /*
           ПУЛИ
        */

        let destroyed =
            false;


        if(
            gunT > 0 &&
            o.type !== 'shield' &&
            o.type !== 'ak'
        ){

            for(
                let b =
                    bullets.length - 1;
                b >= 0;
                b--
            ){

                const bullet =
                    bullets[b];


                const bulletBox = {

                    x:
                        bullet.x,

                    y:
                        bullet.y,

                    w:10,

                    h:4

                };


                if(
                    hit(
                        bulletBox,
                        oBox
                    )
                ){

                    boom(
                        o.x +
                        o.w / 2,

                        o.y,

                        '#ffe08a',
                        12
                    );


                    bullets.splice(
                        b,
                        1
                    );


                    destroyed =
                        true;

                    break;

                }

            }

        }


        if(destroyed){

            obstacles.splice(
                i,
                1
            );

            continue;

        }


        /*
           ПОДБОР АК
        */

        if(
            o.type === 'ak' &&
            hit(
                pBox,
                oBox
            )
        ){

            gunT =
                15;

            fireAcc =
                0;

            heroEl.classList.add(
                'has-gun'
            );


            boom(
                o.x,
                o.y,
                '#9fef6a',
                15
            );


            obstacles.splice(
                i,
                1
            );

            continue;

        }


        /*
           ПОДБОР ЩИТА
        */

        if(
            o.type === 'shield' &&
            hit(
                pBox,
                oBox
            )
        ){

            shieldT =
                10;


            boom(
                o.x,
                o.y,
                '#39bfff',
                18
            );


            obstacles.splice(
                i,
                1
            );

            continue;

        }


        /*
           ОБЫЧНОЕ СТОЛКНОВЕНИЕ
        */

        if(
            o.type !== 'ak' &&
            o.type !== 'shield' &&
            hit(
                pBox,
                oBox
            )
        ){

            if(
                shieldT > 0
            ){

                boom(
                    o.x +
                    o.w / 2,

                    o.y,

                    '#8eeaff',
                    18
                );


                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            gameOver(
                o.type
            );

            return;

        }


        /*
           УДАЛЕНИЕ ЗА ЭКРАНОМ
        */

        if(
            o.x + o.w < -80
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE BULLETS
   ========================================================= */

function updateBullets(dt){

    for(
        let i =
            bullets.length - 1;
        i >= 0;
        i--
    ){

        const b =
            bullets[i];


        b.x +=
            b.vx *
            dt;

        b.y +=
            b.vy *
            dt;

        b.life -=
            dt;


        if(
            b.life <= 0 ||
            b.x > W + 30
        ){

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE PARTICLES
   ========================================================= */

function updateParticles(dt){

    for(
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ){

        const p =
            particles[i];


        p.life -=
            dt;

        p.x +=
            p.vx *
            dt;

        p.y +=
            p.vy *
            dt;

        p.vy +=
            400 *
            dt;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(kind){

    if(
        state.over
    ){
        return;
    }


    state.over =
        true;

    state.running =
        false;


    heroEl.classList.remove(
        'has-gun'
    );


    const score =
        Math.floor(
            state.dist
        );


    if(
        score > best
    ){

        best =
            score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        renderBest();

    }


    titleScreen.classList.remove(
        'hide'
    );

    pickScreen.classList.remove(
        'show'
    );


    menuTitle.textContent =
        kind === 'dick'
        ? 'Есть пробитие'
        : 'Это конец, ты в говне';


    menuText.textContent =
        'Ты продержался ' +
        score +
        ' м · ' +
        difficulty.name;


    overlay.style.display =
        'flex';

}


/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets(){

    for(
        const b of bullets
    ){

        ctx.fillStyle =
            '#ffe08a';

        ctx.fillRect(
            b.x,
            b.y,
            11,
            3
        );

    }

}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life * 2
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha =
        1;

}


/* =========================================================
   DOM PLAYER
   ========================================================= */

function updateHeroDom(){

    heroEl.style.left =
        player.x + 'px';

    heroEl.style.top =
        player.y + 'px';


    heroShadow.style.left =
        (
            player.x +
            player.w / 2 -
            32
        ) + 'px';

    heroShadow.style.top =
        (
            state.groundY -
            5
        ) + 'px';


    dollEl.classList.toggle(
        'run',
        state.running &&
        !state.over &&
        player.onGround
    );


    /*
       В воздухе слегка наклоняем
       персонажа — движение выглядит
       живее.
    */

    const tilt =
        player.onGround
        ? 0
        : Math.max(
            -7,
            Math.min(
                7,
                player.vy * .008
            )
        );

    heroEl.style.transform =
        `rotate(${tilt}deg)`;


    /*
       АК видна только пока активна.
    */

    heroEl.classList.toggle(
        'has-gun',
        gunT > 0
    );

}


/* =========================================================
   MAIN LOOP
   ========================================================= */

let last =
    performance.now();


function loop(now){

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now - last) / 1000
            )
        );


    last =
        now;


    state.groundY =
        Math.floor(
            H * .70
        );


    /*
       GAME UPDATE
    */

    if(
        state.running &&
        !state.over
    ){

        state.t +=
            dt;


        /*
           ГЛАВНОЕ УСКОРЕНИЕ.

           Скорость постоянно растёт,
           но не бесконечно.
        */

        state.speed =
            Math.min(
                difficulty.maxSpeed,

                state.speed +
                difficulty.acceleration *
                dt
            );


        /*
           Дистанция.
        */

        state.dist +=
            state.speed *
            dt *
            .12;


        scoreEl.textContent =
            Math.floor(
                state.dist
            ) +
            ' м';


        /*
           БУФФЕРЫ
        */

        shieldT =
            Math.max(
                0,
                shieldT - dt
            );

        gunT =
            Math.max(
                0,
                gunT - dt
            );


        if(
            gunT <= 0
        ){

            heroEl.classList.remove(
                'has-gun'
            );

        }


        /*
           АВТОСТРЕЛЬБА
        */

        if(
            gunT > 0
        ){

            fireAcc +=
                dt;


            if(
                fireAcc >= .11
            ){

                fireAcc =
                    0;

                shoot();

            }

        }


        /*
           ПРЫЖОК / ГРАВИТАЦИЯ
        */

        updatePlayer(dt);


        /*
           ОБЫЧНЫЕ ПРЕПЯТСТВИЯ
        */

        spawnTimer -=
            dt;


        if(
            spawnTimer <= 0
        ){

            spawnObstacle();


            const difficultyFactor =
                Math.min(
                    .35,
                    (
                        state.speed -
                        difficulty.startSpeed
                    ) /
                    1500
                );


            spawnTimer =
                difficulty.spawnMin +
                Math.random() *
                (
                    difficulty.spawnMax -
                    difficulty.spawnMin
                ) -
                difficultyFactor;


            spawnTimer =
                Math.max(
                    .78,
                    spawnTimer
                );

        }


        /*
           ПРЕДМЕТЫ ПО ДИСТАНЦИИ.

           1500 AK
           3000 SHIELD
           4500 AK
           6000 SHIELD
           ...
        */

        if(
            state.dist >=
            state.nextPowerDistance
        ){

            spawnPowerAtDistance();

        }


        updateObstacles(dt);

        updateBullets(dt);

        updateParticles(dt);


        updateBuffHud();

    }else{

        /*
           Даже в меню персонаж стоит
           на земле.
        */

        player.y =
            state.groundY -
            player.h;

    }


    /*
       BACKGROUND
    */

    drawBackdrop();


    /*
       FORCE FIELD РИСУЕТСЯ ДО ПЕРСОНАЖА
    */

    drawShieldField();


    /*
       OBJECTS
    */

    for(
        const o of obstacles
    ){

        if(
            o.type === 'poop'
        ){

            drawPoop(o);

        }else if(
            o.type === 'dick'
        ){

            drawDick(o);

        }else if(
            o.type === 'shield'
        ){

            drawShieldIcon(o);

        }else if(
            o.type === 'ak'
        ){

            drawAkIcon(o);

        }

    }


    drawBullets();

    drawParticles();


    updateHeroDom();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

applySkin();

state.groundY =
    Math.floor(
        H * .70
    );

player.y =
    state.groundY -
    player.h;

difficultyHud.textContent =
    difficulty.name;

checkReady();

})();
</script>

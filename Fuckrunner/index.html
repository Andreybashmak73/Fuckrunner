<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FUCKRUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#160d1d;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    user-select:none;
}

#wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* =========================================================
   PLAYER
   ========================================================= */

#hero{
    position:absolute;
    left:90px;
    top:0;
    width:72px;
    height:108px;
    z-index:8;
    pointer-events:none;
}

.doll{
    position:absolute;
    left:0;
    top:0;
    width:72px;
    height:108px;
    pointer-events:none;
}

/* ---------- head ---------- */

.doll .head{
    position:absolute;
    left:22px;
    top:10px;
    width:30px;
    height:29px;
    background:#efb187;
    border-radius:48% 48% 45% 45%;
    z-index:5;
}

.doll .eye{
    position:absolute;
    top:20px;
    width:4px;
    height:4px;
    background:#19151a;
    border-radius:50%;
    z-index:7;
}

.doll .eye.l{left:29px}
.doll .eye.r{left:41px}

/* ---------- hair ---------- */

.doll .hair{
    display:none;
    position:absolute;
    left:14px;
    top:5px;
    width:44px;
    height:34px;
    background:#f1d06c;
    border-radius:22px 22px 10px 10px;
    z-index:4;
}

/* ---------- cap ---------- */

.doll .cap{
    position:absolute;
    left:17px;
    top:0;
    width:43px;
    height:17px;
    background:#111;
    border-radius:9px 9px 2px 2px;
    z-index:8;
}

.doll .cap:after{
    content:"";
    position:absolute;
    right:-9px;
    bottom:1px;
    width:18px;
    height:6px;
    background:#111;
    border-radius:0 7px 7px 0;
}

.doll .tag{
    position:absolute;
    left:19px;
    top:4px;
    width:38px;
    color:#eee;
    font:800 7px/1 Arial,sans-serif;
    text-align:center;
    z-index:9;
}

/* ---------- body ---------- */

.doll .shirt{
    position:absolute;
    left:11px;
    top:36px;
    width:50px;
    height:42px;
    background:#2da64e;
    border-radius:10px 10px 5px 5px;
    z-index:4;
}

.doll .collar{
    position:absolute;
    left:11px;
    top:36px;
    width:50px;
    height:9px;
    background:#21783a;
    border-radius:10px 10px 0 0;
    z-index:5;
}

/* ---------- arms ---------- */

.doll .arm{
    position:absolute;
    top:40px;
    width:11px;
    height:31px;
    background:#e0a078;
    border-radius:7px;
    transform-origin:50% 4px;
    z-index:3;
}

.doll .arm.l{
    left:2px;
}

.doll .arm.r{
    right:2px;
}

/* кисти двигаются ВМЕСТЕ с руками */
.doll .hand{
    position:absolute;
    width:12px;
    height:11px;
    background:#e0a078;
    border-radius:50%;
    z-index:3;
}

/* ---------- legs ---------- */

.doll .leg{
    position:absolute;
    bottom:10px;
    width:13px;
    height:29px;
    background:#3b2d28;
    border-radius:7px;
    transform-origin:50% 2px;
    z-index:2;
}

.doll .leg.l{
    left:20px;
}

.doll .leg.r{
    right:20px;
}

/* обувь является частью ноги и поэтому двигается вместе с ней */
.doll .shoe{
    position:absolute;
    left:-4px;
    bottom:-6px;
    width:22px;
    height:10px;
    background:#171419;
    border-radius:7px 8px 4px 4px;
}

/* ---------- running animation ---------- */

.doll.run .arm.l{
    animation:armLeft .30s ease-in-out infinite;
}

.doll.run .arm.r{
    animation:armRight .30s ease-in-out infinite;
}

.doll.run .leg.l{
    animation:legLeft .30s ease-in-out infinite;
}

.doll.run .leg.r{
    animation:legRight .30s ease-in-out infinite;
}

@keyframes armLeft{
    0%,100%{
        transform:rotate(32deg);
    }
    50%{
        transform:rotate(-34deg);
    }
}

@keyframes armRight{
    0%,100%{
        transform:rotate(-34deg);
    }
    50%{
        transform:rotate(32deg);
    }
}

@keyframes legLeft{
    0%,100%{
        transform:rotate(-25deg);
    }
    50%{
        transform:rotate(25deg);
    }
}

@keyframes legRight{
    0%,100%{
        transform:rotate(25deg);
    }
    50%{
        transform:rotate(-25deg);
    }
}

/* ---------- VEGA ---------- */

.skin-vega .head,
.skin-vega .arm,
.skin-vega .hand{
    background:#efb187;
}

/* ---------- BUMBLE ---------- */

.skin-bumble .head,
.skin-bumble .arm,
.skin-bumble .hand{
    background:#704128;
}

.skin-bumble .shirt{
    background:#111;
}

.skin-bumble .collar{
    background:#d1aa32;
}

.skin-bumble .cap,
.skin-bumble .cap:after{
    background:#d1aa32;
}

.skin-bumble .tag{
    color:#111;
}

/* ---------- LABUBA = жирный человек ---------- */

.skin-labuba .head{
    left:18px;
    width:36px;
    height:31px;
}

.skin-labuba .eye.l{left:27px}
.skin-labuba .eye.r{left:43px}

.skin-labuba .shirt{
    left:2px;
    width:68px;
    height:46px;
    background:#bd5829;
    border-radius:18px 18px 9px 9px;
}

.skin-labuba .collar{
    left:2px;
    width:68px;
    background:#8b3919;
}

.skin-labuba .arm.l{left:0}
.skin-labuba .arm.r{right:0}

.skin-labuba .leg.l{left:19px}
.skin-labuba .leg.r{right:19px}

/* ---------- GIRL ---------- */

.skin-girl .hair{
    display:block;
}

.skin-girl .cap,
.skin-girl .tag,
.skin-girl .collar{
    display:none;
}

.skin-girl .head,
.skin-girl .arm,
.skin-girl .hand{
    background:#f6c7a7;
}

.skin-girl .shirt{
    background:#ff70ae;
    border-radius:11px 11px 20px 20px;
    height:45px;
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;

    display:flex;
    justify-content:space-between;

    color:#fff;
    font-size:15px;
    font-weight:800;
    text-shadow:0 2px 0 #000;

    pointer-events:none;
}

#buff{
    margin-top:4px;
    color:#9ff56a;
    font-size:12px;
}

#cityTag{
    position:absolute;
    top:43px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    color:#ffe08a;
    font-size:13px;
    font-weight:800;
    text-shadow:0 2px 0 #000;

    opacity:0;
    transition:opacity .3s;

    pointer-events:none;
}

/* =========================================================
   OVERLAY / MENUS
   ========================================================= */

#overlay{
    position:absolute;
    inset:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:rgba(8,4,14,.88);

    color:#fff;
    text-align:center;
    padding:16px;
}

.screen{
    width:min(560px,96vw);
}

.screen.hidden{
    display:none;
}

.screen h1{
    font-size:25px;
    margin-bottom:8px;
    color:#ff4d6d;
    text-shadow:3px 3px 0 #3a0010;
}

.screen p{
    opacity:.9;
    line-height:1.35;
    margin:7px auto 15px;
    max-width:390px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0 16px;
}

.card{
    min-height:145px;
    padding:8px 5px;
    border:3px solid #53384f;
    background:#241428;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
}

.card .nm{
    color:#ffe08a;
    font-weight:800;
    font-size:12px;
    margin-bottom:4px;
}

.card.sel{
    border-color:#ff4d6d;
    box-shadow:0 0 0 3px rgba(255,77,109,.3);
}

.stage{
    position:relative;
    height:105px;
    overflow:hidden;
}

.stage .doll{
    left:50%;
    transform:translateX(-50%) scale(.86);
    transform-origin:top center;
}

.difficulty-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:15px auto 18px;
    width:min(390px,94vw);
}

.difficulty{
    padding:14px 12px;
    border:3px solid #53384f;
    background:#241428;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.difficulty small{
    display:block;
    margin-top:4px;
    color:#aaa;
    font-size:10px;
    font-weight:400;
}

.difficulty.sel{
    border-color:#ff4d6d;
    background:#32172a;
    box-shadow:0 0 0 3px rgba(255,77,109,.3);
}

button.main{
    appearance:none;
    border:3px solid #fff;
    background:#ff4d6d;
    color:#fff;
    font-weight:800;
    font-size:17px;
    font-family:inherit;
    padding:12px 24px;
    cursor:pointer;
}

button.main:disabled{
    opacity:.4;
    cursor:default;
}

.hint{
    margin-top:11px;
    font-size:11px;
    opacity:.65;
}

/* =========================================================
   SHIELD VISUAL
   ========================================================= */

#shieldAura{
    position:absolute;
    z-index:7;
    pointer-events:none;

    width:100px;
    height:120px;

    border:3px solid rgba(70,170,255,.85);
    border-radius:50%;

    box-shadow:
        0 0 10px #198cff,
        0 0 22px #198cff,
        inset 0 0 18px rgba(60,170,255,.45);

    opacity:0;
    transform:translate(-14px,-8px);

    animation:shieldPulse .8s ease-in-out infinite alternate;
}

#shieldAura.active{
    opacity:1;
}

@keyframes shieldPulse{
    from{
        filter:brightness(.9);
        transform:translate(-14px,-8px) scale(.98);
    }
    to{
        filter:brightness(1.35);
        transform:translate(-14px,-8px) scale(1.03);
    }
}
</style>

<script>
(()=>{
'use strict';

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg=window.Telegram && window.Telegram.WebApp;

if(tg){
    tg.ready();
    tg.expand();

    try{
        tg.setHeaderColor('#2a1630');
        tg.setBackgroundColor('#1a1020');
    }catch(e){}
}

/* =========================================================
   DOM
   ========================================================= */

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const overlay=document.getElementById('overlay');

const characterScreen=
    document.getElementById('characterScreen');

const difficultyScreen=
    document.getElementById('difficultyScreen');

const fighterGrid=
    document.getElementById('fighterGrid');

const toDifficulty=
    document.getElementById('toDifficulty');

const startBtn=
    document.getElementById('start');

const scoreEl=
    document.getElementById('score');

const bestEl=
    document.getElementById('best');

const buffEl=
    document.getElementById('buff');

const cityTag=
    document.getElementById('cityTag');

const heroEl=
    document.getElementById('hero');

const heroDoll=
    heroEl.querySelector('.doll');

const shieldAura=
    document.getElementById('shieldAura');

/* =========================================================
   CANVAS
   ========================================================= */

let W=0;
let H=0;
let dpr=1;

function resize(){

    dpr=Math.min(window.devicePixelRatio||1,2);

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);

    canvas.style.width=W+'px';
    canvas.style.height=H+'px';

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled=false;
}

window.addEventListener('resize',resize);
resize();

/* =========================================================
   CITIES
   ========================================================= */

const CITIES=[
    {name:'ЕКАТЕРИНБУРГ',src:'../bg_far.jpg'},
    {name:'ТОЛЬЯТТИ',src:'../bg_tlt.jpg'},
    {name:'УЛЬЯНОВСК',src:'../bg_uln.jpg'},
    {name:'КАЗАНЬ',src:'../bg_kzn.jpg'},
    {name:'ЙОШКАР-ОЛА',src:'../bg_yosh.jpg'},
    {name:'САРАТОВ',src:'../bg_sar.jpg'},
    {name:'САМАРА',src:'../bg_sam.jpg'}
];

const cityImgs=CITIES.map(c=>{
    const img=new Image();
    img.src=c.src;
    return img;
});

/* =========================================================
   FIGHTERS
   ========================================================= */

const FIGHTERS=[
    {
        id:'vega',
        name:'Вегамэн',
        tag:'ВЕГА'
    },
    {
        id:'bumble',
        name:'Бамбл Бизи',
        tag:'BEE'
    },
    {
        id:'labuba',
        name:'Лабуба',
        tag:'ЛАБ'
    },
    {
        id:'girl',
        name:'Вагина реалистик',
        tag:''
    }
];

let selectedSkin='vega';

function fighterMarkup(f){

    return `
        <div class="nm">${f.name}</div>

        <div class="stage">

            <div class="doll skin-${f.id}">

                <div class="hair"></div>
                <div class="cap"></div>

                <div class="tag">${f.tag}</div>

                <div class="head"></div>

                <div class="eye l"></div>
                <div class="eye r"></div>

                <div class="arm l">
                    <div class="hand"></div>
                </div>

                <div class="arm r">
                    <div class="hand"></div>
                </div>

                <div class="shirt"></div>
                <div class="collar"></div>

                <div class="leg l">
                    <div class="shoe"></div>
                </div>

                <div class="leg r">
                    <div class="shoe"></div>
                </div>

            </div>
        </div>
    `;
}

FIGHTERS.forEach(f=>{

    const card=document.createElement('button');

    card.className='card';
    card.dataset.id=f.id;
    card.innerHTML=fighterMarkup(f);

    card.addEventListener('click',()=>{

        document
            .querySelectorAll('.card')
            .forEach(c=>c.classList.remove('sel'));

        card.classList.add('sel');

        selectedSkin=f.id;

        toDifficulty.disabled=false;

        applySkin();

    });

    fighterGrid.appendChild(card);
});

/* =========================================================
   DIFFICULTIES
   ========================================================= */

const DIFFICULTIES={
    easy:{
        name:'СОСУНОК ЕБАНЫЙ',
        startSpeed:235,
        acceleration:3.6,
        maxSpeed:620
    },

    normal:{
        name:'ОБЫЧНЫЙ РАБОТЯГА С ЗАВОДА',
        startSpeed:255,
        acceleration:6.2,
        maxSpeed:780
    },

    hard:{
        name:'КИБОРГ УБИЙЦА',
        startSpeed:275,
        acceleration:10.5,
        maxSpeed:980
    }
};

let selectedDifficulty=null;

document
    .querySelectorAll('.difficulty')
    .forEach(button=>{

        button.addEventListener('click',()=>{

            document
                .querySelectorAll('.difficulty')
                .forEach(b=>b.classList.remove('sel'));

            button.classList.add('sel');

            selectedDifficulty=
                button.dataset.difficulty;

            startBtn.disabled=false;
        });
    });

toDifficulty.addEventListener('click',()=>{

    if(!selectedSkin)return;

    characterScreen.classList.add('hidden');
    difficultyScreen.classList.remove('hidden');

});

/* =========================================================
   SKIN
   ========================================================= */

function applySkin(){

    heroEl.className='';
    heroEl.id='hero';

    heroDoll.className=
        'doll skin-'+selectedSkin;

    const tag=heroDoll.querySelector('.tag');

    const fighter=
        FIGHTERS.find(f=>f.id===selectedSkin);

    tag.textContent=fighter ? fighter.tag : '';
}

/* =========================================================
   BEST
   ========================================================= */

const BEST_KEY='fuckrunner_best';

let best=parseInt(
    localStorage.getItem(BEST_KEY)||'0',
    10
);

function renderBest(){
    bestEl.textContent='лучший счет '+best;
}

renderBest();

/* =========================================================
   STATE
   ========================================================= */

const state={
    running:false,
    over:false,

    t:0,
    speed:255,
    dist:0,

    groundY:0,

    city:-1,

    difficulty:'normal'
};

const player={
    x:90,
    y:0,
    vy:0,

    w:54,
    h:108,

    onGround:true,
    jumpsUsed:0
};

const obstacles=[];
const bullets=[];
const particles=[];

/* =========================================================
   POWER-UPS
   ========================================================= */

let shieldT=0;
let gunT=0;

let fireAcc=0;

/*
    Power-ups появляются по дистанции:

    АК:   1500, 4500, 7500, 10500...
    ЩИТ:  3000, 6000, 9000, 12000...
*/

let nextGunDistance=1500;
let nextShieldDistance=3000;

/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    const diff=
        DIFFICULTIES[selectedDifficulty];

    state.running=true;
    state.over=false;

    state.t=0;
    state.dist=0;

    state.difficulty=selectedDifficulty;
    state.speed=diff.startSpeed;

    state.city=-1;

    player.vy=0;
    player.onGround=true;
    player.jumpsUsed=0;

    obstacles.length=0;
    bullets.length=0;
    particles.length=0;

    shieldT=0;
    gunT=0;
    fireAcc=0;

    nextGunDistance=1500;
    nextShieldDistance=3000;

    overlay.style.display='none';

    scoreEl.textContent='0 м';
    buffEl.textContent='';

    applySkin();
    updateShieldVisual();

    toastCity(0);
}

/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener('click',()=>{

    if(!selectedDifficulty)return;

    resetGame();
    startMusic();

});

/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(
        !state.running ||
        state.over ||
        player.jumpsUsed>=2
    ){
        return;
    }

    if(player.jumpsUsed===0){
        player.vy=-820;
    }else{
        player.vy=-1080;
    }

    player.onGround=false;
    player.jumpsUsed++;
}

window.addEventListener('keydown',e=>{

    if(
        e.code==='Space' ||
        e.code==='ArrowUp'
    ){
        e.preventDefault();

        if(state.running){
            jump();
        }
    }
});

window.addEventListener('pointerdown',e=>{

    if(e.target.closest('#overlay')){
        return;
    }

    if(state.running){
        jump();
    }
});

/* =========================================================
   MUSIC
   ========================================================= */

const TRACKS=[
    'ushet.mp3',
    '../bogi.mp3',
    '../gorod.mp3',
    '../Chto.mp3',
    '../Police.mp3',
    '../Big.mp3'
];

const music=new Audio();
music.volume=.55;

let lastTrack=-1;
let musicStarted=false;

function playRandomTrack(){

    let index=
        Math.floor(Math.random()*TRACKS.length);

    if(
        TRACKS.length>1 &&
        index===lastTrack
    ){
        index=(index+1)%TRACKS.length;
    }

    lastTrack=index;
    music.src=TRACKS[index];

    music.play().catch(()=>{});
}

music.addEventListener('ended',playRandomTrack);

function startMusic(){

    if(musicStarted)return;

    musicStarted=true;
    playRandomTrack();
}

/* =========================================================
   COLLISION
   ========================================================= */

function hit(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

/*
    Хитбокс немного уже визуального тела.
    Это делает игру честнее и не заставляет
    игрока умирать от касания пикселей одежды.
*/

function getPlayerHitbox(){

    return{
        x:player.x+10,
        y:player.y+7,
        w:player.w-20,
        h:player.h-12
    };
}

/* =========================================================
   SPAWN OBSTACLES
   ========================================================= */

let obstacleTimer=.9;

function spawnObstacle(){

    const chance=Math.random();

    if(chance<.62){

        obstacles.push({
            type:'poop',

            x:W+50,
            y:0,

            w:44,
            h:38
        });

    }else{

        obstacles.push({
            type:'dick',

            x:W+50,
            y:0,

            /*
                Было слишком низко.
                Теперь препятствие значительно выше.
            */
            flyY:
                125+
                Math.random()*95,

            w:52,
            h:22,

            wob:Math.random()*Math.PI*2
        });
    }
}

/* =========================================================
   POWER-UP SPAWN
   ========================================================= */

function spawnGun(){

    obstacles.push({

        type:'ak',

        x:W+60,
        y:0,

        w:48,
        h:26,

        power:true
    });
}

function spawnShield(){

    obstacles.push({

        type:'shield',

        x:W+60,
        y:0,

        w:40,
        h:40,

        power:true
    });
}

/* =========================================================
   PARTICLES
   ========================================================= */

function boom(x,y,color){

    for(let i=0;i<12;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-.5)*260,
            vy:-80-Math.random()*180,

            life:.45,

            color
        });
    }
}

/* =========================================================
   POWER VISUAL
   ========================================================= */

function updateShieldVisual(){

    shieldAura.classList.toggle(
        'active',
        shieldT>0 &&
        state.running
    );
}

/* =========================================================
   CITY
   ========================================================= */

function toastCity(index){

    if(index===state.city)return;

    state.city=index;

    cityTag.textContent=CITIES[index].name;
    cityTag.style.opacity='1';

    clearTimeout(toastCity.timer);

    toastCity.timer=setTimeout(()=>{
        cityTag.style.opacity='0';
    },1600);
}

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(
            W*.92,
            h*(img.naturalWidth/img.naturalHeight)
        );
    }

    return W*.92;
}

function drawCities(groundY){

    const h=groundY+6;

    const widths=cityImgs.map(
        img=>cityWidth(img,h)
    );

    const total=
        widths.reduce((a,b)=>a+b,0)||W;

    const scroll=
        (state.dist*2.2)%total;

    let x=-scroll;
    let seen=state.city;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const i=n%CITIES.length;
        const w=widths[i];
        const img=cityImgs[i];

        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(
                img,
                Math.floor(x),
                0,
                Math.ceil(w)+1,
                Math.ceil(h)
            );
        }

        if(
            x<=W*.35 &&
            x+w>W*.35
        ){
            seen=i;
        }

        x+=w;

        if(x>W+5)break;
    }

    if(seen>=0){
        toastCity(seen);
    }
}

/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackdrop(){

    const gy=state.groundY;

    const gradient=
        ctx.createLinearGradient(
            0,0,0,gy
        );

    gradient.addColorStop(0,'#3a2460');
    gradient.addColorStop(1,'#c45a3a');

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,gy);

    drawCities(gy);

    const roadH=Math.floor((H-gy)*.46);

    ctx.fillStyle='#5b5b63';
    ctx.fillRect(0,gy,W,roadH);

    ctx.fillStyle='#4a4a52';
    ctx.fillRect(0,gy,W,8);

    const dash=34;

    const shift=
        (state.dist/.12)%(dash*2);

    ctx.fillStyle='#e6d36a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy+roadH*.45,
            20,
            4
        );
    }

    ctx.fillStyle='#7a5a3a';

    ctx.fillRect(
        0,
        gy+roadH,
        W,
        H-gy-roadH
    );

    const tile=26;

    const sh=
        (state.dist/.12)%tile;

    ctx.fillStyle='#6a4a2e';

    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(
            x-sh,
            gy+roadH+10,
            12,
            4
        );
    }
}

/* =========================================================
   DRAW POOP
   ========================================================= */

function drawPoop(o){

    const x=o.x+o.w/2;
    const y=o.y+o.h;

    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle='#5a2c10';

    ctx.beginPath();
    ctx.ellipse(0,-10,20,12,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-4,-22,14,10,-.2,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(2,-32,9,8,.2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#fff';

    ctx.beginPath();
    ctx.arc(-6,-22,3,0,Math.PI*2);
    ctx.arc(4,-20,2.4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#222';

    ctx.beginPath();
    ctx.arc(-6,-22,1.4,0,Math.PI*2);
    ctx.arc(4,-20,1.2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW DICK
   ========================================================= */

function drawDick(o){

    const x=o.x+o.w/2;

    /*
        Визуально поднимаем его вместе с хитбоксом.
    */

    const y=
        o.y+
        o.h/2+
        Math.sin(
            state.t*6+o.wob
        )*6;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        -.15+
        Math.sin(
            state.t*4+o.wob
        )*.12
    );

    ctx.fillStyle='#f0b48a';

    ctx.beginPath();

    ctx.roundRect(
        -22,
        -8,
        36,
        16,
        8
    );

    ctx.fill();

    ctx.fillStyle='#e08a8a';

    ctx.beginPath();

    ctx.ellipse(
        16,
        0,
        11,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle='#e0a07a';

    ctx.beginPath();

    ctx.ellipse(
        -20,
        6,
        8,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        -12,
        8,
        8,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW SHIELD
   ========================================================= */

function drawShield(o){

    const x=o.x+o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(state.t*5)*4;

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle='#176dff';

    ctx.beginPath();

    ctx.moveTo(0,-18);
    ctx.lineTo(15,-12);
    ctx.lineTo(13,8);
    ctx.lineTo(0,18);
    ctx.lineTo(-13,8);
    ctx.lineTo(-15,-12);
    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle='#bfe6ff';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.fillStyle='#fff';
    ctx.font='bold 13px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    ctx.fillText('S',0,1);

    ctx.restore();
}

/* =========================================================
   DRAW AK PICKUP
   ========================================================= */

function drawAKPickup(o){

    const x=o.x+o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(state.t*5)*4;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(-.25);

    ctx.fillStyle='#33352c';

    ctx.fillRect(
        -22,
        -4,
        39,
        8
    );

    ctx.fillStyle='#65421f';

    ctx.fillRect(
        -7,
        2,
        9,
        12
    );

    ctx.fillStyle='#24251f';

    ctx.fillRect(
        13,
        -7,
        12,
        4
    );

    ctx.fillStyle='#141510';

    ctx.fillRect(
        -19,
        -8,
        8,
        4
    );

    ctx.restore();
}

/* =========================================================
   PLAYER GUN
   ========================================================= */

function drawPlayerGun(){

    /*
        АК находится около правой руки.
        При этом сам персонаж продолжает бежать.
    */

    const px=
        player.x+
        player.w*.63;

    const py=
        player.y+48;

    ctx.save();

    ctx.translate(px,py);

    ctx.rotate(-.10);

    ctx.fillStyle='#292b24';

    ctx.fillRect(
        0,
        -4,
        42,
        8
    );

    ctx.fillStyle='#171812';

    ctx.fillRect(
        34,
        -7,
        12,
        4
    );

    ctx.fillStyle='#63421f';

    ctx.fillRect(
        7,
        2,
        9,
        13
    );

    ctx.fillStyle='#111';

    ctx.fillRect(
        -4,
        -7,
        12,
        4
    );

/* =========================================================
   BULLETS
   ========================================================= */

function fireGun(){

    const baseX=
        player.x+
        player.w+
        8;

    const baseY=
        player.y+47;

    /*
        Небольшой веер пуль.
    */

    for(let k=-1;k<=1;k++){

        const angle=k*.10;

        bullets.push({

            x:baseX,

            y:baseY,

            vx:700*Math.cos(angle),
            vy:700*Math.sin(angle),

            life:.65
        });
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(type){

    state.over=true;
    state.running=false;

    heroDoll.classList.remove('run');

    const score=
        Math.floor(state.dist);

    if(score>best){

        best=score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        renderBest();
    }

    shieldT=0;
    gunT=0;

    updateShieldVisual();

    characterScreen.classList.remove('hidden');
    difficultyScreen.classList.add('hidden');

    overlay.querySelector('#characterScreen h1')
        .textContent=
        type==='dick'
        ?'ЕСТЬ ПРОБИТИЕ'
        :'ЭТО КОНЕЦ, ТЫ В ГОВНЕ';

    overlay.querySelector('#characterScreen p')
        .textContent=
        'Ты продержался '+
        score+
        ' м.';

    toDifficulty.disabled=true;

    selectedDifficulty=null;

    document
        .querySelectorAll('.difficulty')
        .forEach(b=>b.classList.remove('sel'));

    startBtn.disabled=true;

    overlay.style.display='flex';
}

/* =========================================================
   UPDATE POWER-UP SCHEDULE
   ========================================================= */

function checkPowerupSchedule(){

    /*
        Если игрок прошёл 1500:
        появляется АК.

        Если прошёл 3000:
        появляется ЩИТ.

        Потом:
        АК 4500
        ЩИТ 6000
        АК 7500
        ЩИТ 9000
        и т.д.
    */

    while(state.dist>=nextGunDistance){

        spawnGun();

        nextGunDistance+=3000;
    }

    while(state.dist>=nextShieldDistance){

        spawnShield();

        nextShieldDistance+=3000;
    }
}

/* =========================================================
   UPDATE OBSTACLES
   ========================================================= */

function updateObstacles(dt){

    const playerBox=getPlayerHitbox();

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=obstacles[i];

        o.x-=state.speed*dt;

        if(o.type==='dick'){

            /*
                Поднимаем препятствие выше дороги.
            */

            o.y=
                state.groundY-
                o.flyY-
                o.h;

        }else{

            o.y=
                state.groundY-
                o.h-
                (
                    o.type==='shield' ||
                    o.type==='ak'
                    ?18
                    :0
                );
        }

        /* ---------------------------------------------
           BULLETS VS OBSTACLES
           --------------------------------------------- */

        let destroyed=false;

        for(
            let b=bullets.length-1;
            b>=0;
            b--
        ){

            const bullet=bullets[b];

            const bulletBox={
                x:bullet.x,
                y:bullet.y,
                w:10,
                h:4
            };

            if(
                o.type!=='shield' &&
                o.type!=='ak' &&
                hit(bulletBox,o)
            ){

                boom(
                    o.x+o.w/2,
                    o.y,
                    '#ffe08a'
                );

                bullets.splice(b,1);

                destroyed=true;

                break;
            }
        }

        if(destroyed){

            obstacles.splice(i,1);
            continue;
        }

        /* ---------------------------------------------
           PLAYER VS OBJECT
           --------------------------------------------- */

        if(hit(playerBox,o)){

            if(o.type==='shield'){

                shieldT=10;

                boom(
                    o.x+o.w/2,
                    o.y,
                    '#4db8ff'
                );

                obstacles.splice(i,1);

                updateShieldVisual();

                continue;
            }

            if(o.type==='ak'){

                gunT=10;
                fireAcc=0;

                boom(
                    o.x+o.w/2,
                    o.y,
                    '#9fff70'
                );

                obstacles.splice(i,1);

                continue;
            }

            if(shieldT>0){

                boom(
                    o.x+o.w/2,
                    o.y,
                    '#8ddcff'
                );

                obstacles.splice(i,1);

                continue;
            }

            gameOver(o.type);
            return;
        }

        if(o.x+o.w<-60){

            obstacles.splice(i,1);
        }
    }
}

/* =========================================================
   UPDATE BULLETS
   ========================================================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];

        b.x+=b.vx*dt;
        b.y+=b.vy*dt;

        b.life-=dt;

        if(
            b.life<=0 ||
            b.x>W+30 ||
            b.y<-30 ||
            b.y>H+30
        ){

            bullets.splice(i,1);
        }
    }
}

/* =========================================================
   UPDATE PARTICLES
   ========================================================= */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.life-=dt;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=420*dt;

        if(p.life<=0){

            particles.splice(i,1);
        }
    }
}

/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets(){

    ctx.fillStyle='#ffe08a';

    for(const b of bullets){

        ctx.fillRect(
            b.x,
            b.y,
            10,
            3
        );
    }
}

/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life*2);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   RENDER HUD
   ========================================================= */

function updateHUD(){

    scoreEl.textContent=
        Math.floor(state.dist)+' м';

    const parts=[];

    if(shieldT>0){

        parts.push(
            'ЩИТ '+
            Math.ceil(shieldT)+
            'с'
        );
    }

    if(gunT>0){

        parts.push(
            'АК '+
            Math.ceil(gunT)+
            'с'
        );
    }

    buffEl.textContent=
        parts.join(' · ');
}

/* =========================================================
   GAME LOOP
   ========================================================= */

let last=performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            Math.max(
                0,
                (now-last)/1000
            )
        );

    last=now;

    state.groundY=
        Math.floor(H*.70);

    if(
        !state.running ||
        state.over
    ){

        player.y=
            state.groundY-
            player.h;

    }else{

        state.t+=dt;

        /* ---------------------------------------------
           SPEED ACCELERATION
           --------------------------------------------- */

        const diff=
            DIFFICULTIES[state.difficulty];

        state.speed=
            Math.min(
                diff.maxSpeed,
                state.speed+
                diff.acceleration*dt
            );

        /*
            Дистанция зависит от скорости.
            Поэтому ускорение реально ощущается.
        */

        state.dist+=
            state.speed*
            dt*
            .12;

        /* ---------------------------------------------
           BUFF TIMERS
           --------------------------------------------- */

        shieldT=
            Math.max(
                0,
                shieldT-dt
            );

        gunT=
            Math.max(
                0,
                gunT-dt
            );

        updateShieldVisual();

        /* ---------------------------------------------
           PLAYER
           --------------------------------------------- */

        player.vy+=
            2400*
            (
                player.vy>0
                ?1.65
                :1
            )*
            dt;

        player.y+=player.vy*dt;

        if(
            player.y>=
            state.groundY-
            player.h
        ){

            player.y=
                state.groundY-
                player.h;

            player.vy=0;
            player.onGround=true;
            player.jumpsUsed=0;

        }else{

            player.onGround=false;
        }

        /* ---------------------------------------------
           GUN FIRE
           --------------------------------------------- */

        if(gunT>0){

            fireAcc+=dt;

            if(fireAcc>=.12){

                fireAcc=0;
                fireGun();
            }
        }

        /* ---------------------------------------------
           NORMAL OBSTACLES
           --------------------------------------------- */

        obstacleTimer-=dt;

        if(obstacleTimer<=0){

            spawnObstacle();

            /*
                Чем выше сложность, тем чаще постепенно
                могут появляться обычные препятствия,
                но старт игры всё равно остаётся спокойным.
            */

            const difficultyFactor=
                state.difficulty==='easy'
                ?1
                :state.difficulty==='normal'
                ?.90
                :.82;

            const speedFactor=
                Math.max(
                    .55,
                    1-
                    (
                        state.speed-
                        diff.startSpeed
                    )/
                    1300
                );

            obstacleTimer=
                (
                    .95+
                    Math.random()*.65
                )*
                difficultyFactor*
                speedFactor;
        }

        /* ---------------------------------------------
           POWER-UP DISTANCE SYSTEM
           --------------------------------------------- */

        checkPowerupSchedule();

        /* ---------------------------------------------
           UPDATE OBJECTS
           --------------------------------------------- */

        updateObstacles(dt);
        updateBullets(dt);
    }

    updateParticles(dt);
    updateHUD();

    /* =====================================================
       DRAW
       ===================================================== */

    drawBackdrop();

    for(const o of obstacles){

        if(o.type==='poop'){
            drawPoop(o);
        }
        else if(o.type==='dick'){
            drawDick(o);
        }
        else if(o.type==='shield'){
            drawShield(o);
        }
        else if(o.type==='ak'){
            drawAKPickup(o);
        }
    }

    drawBullets();
    drawParticles();

    if(
        gunT>0 &&
        state.running
    ){
        drawPlayerGun();
    }

    /* =====================================================
       PLAYER DOM
       ===================================================== */

    heroEl.style.left=
        player.x+'px';

    heroEl.style.top=
        player.y+'px';

    heroDoll.classList.toggle(
        'run',
        state.running &&
        !state.over &&
        player.onGround
    );

    requestAnimationFrame(loop);
}

applySkin();

requestAnimationFrame(loop);

})();
</script>

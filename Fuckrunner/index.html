(() => {

"use strict";

/* =========================================================

const tg =

if(tg){

    tg.ready();
    tg.expand();

    try{
        tg.setHeaderColor("#2a1630");
        tg.setBackgroundColor("#1a1020");
    }catch(e){}

}

/* =========================================================
   DOM
   ========================================================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");

const titleScreen =
    document.getElementById("screen-title");

const pickScreen =
    document.getElementById("screen-pick");

const difficultyScreen =
    document.getElementById("screen-difficulty");

const pickBtn =
    document.getElementById("pickBtn");

const difficultyBtn =
    document.getElementById("difficultyBtn");

const startBtn =
    document.getElementById("start");

const grid =
    document.getElementById("grid");

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

const buffEl =
    document.getElementById("buff");

const difficultyHud =
    document.getElementById("difficultyHud");

const cityTag =
    document.getElementById("cityTag");

const heroEl =
    document.getElementById("hero");

const heroDoll =
    heroEl.querySelector(".doll");

/* =========================================================
   CANVAS
   ========================================================= */

let W = 0;
let H = 0;
let dpr = 1;

function resize(){

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width =
        Math.floor(W * dpr);

    canvas.height =
        Math.floor(H * dpr);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);
resize();

/* =========================================================
   SAFE ROUNDED RECT
   ========================================================= */

function roundedRect(x,y,w,h,r){

    r = Math.min(
        r,
        Math.abs(w)/2,
        Math.abs(h)/2
    );

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,y,
        x+w,y+r
    );

    ctx.lineTo(x+w,y+h-r);

    ctx.quadraticCurveTo(
        x+w,y+h,
        x+w-r,y+h
    );

    ctx.lineTo(x+r,y+h);

    ctx.quadraticCurveTo(
        x,y+h,
        x,y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,y,

function playRandomTrack(){

    if(!TRACKS.length){
        return;

    let index =
        Math.floor(
            Math.random() * TRACKS.length
        );

    if(
        TRACKS.length > 1 &&
        index === lastTrack
    ){

        index =
            (index + 1) %
            TRACKS.length;

    }

    lastTrack = index;

    music.src =
        TRACKS[index];

    music.currentTime = 0;

    music.play()
        .catch(() => {});

}

    if(musicStarted){

}

/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(

            W * .92,

            h *
            (
                img.naturalWidth /
                img.naturalHeight
            )

        );

    }

    return W * .92;

}

function drawCities(ground){

    const height =
        ground + 6;

    const widths =
        cityImgs.map(
            img =>
                cityWidth(
                    img,
                    height
                )
        );

    const total =
        widths.reduce(
            (a,b) => a+b,
            0
        ) || W;

    const scroll =
        (
            state.dist * 2.2
        ) % total;

    let x = -scroll;

    let seen = state.city;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const index =
            n % CITIES.length;

        const width =
            widths[index];

        const img =
            cityImgs[index];

        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(

                img,

                Math.floor(x),

                0,

                Math.ceil(width)+1,

                Math.ceil(height)

            );

        }

        if(
            x <= W*.35 &&
            x+width > W*.35
        ){

            seen = index;

        }

        x += width;

        if(x > W+5){
            break;
        }

    }

    if(seen >= 0){
        toastCity(seen);
    }

}

function drawBackdrop(){

    const gy =
        state.groundY;

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            gy
        );

    gradient.addColorStop(
        0,
        "#39245e"
    );

    gradient.addColorStop(
        1,
        "#c55d3e"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        gy
    );

    drawCities(gy);

    const roadH =
        Math.floor(
            (H-gy)*.46
        );

    ctx.fillStyle =
        "#5b5b63";

    ctx.fillRect(
        0,
        gy,
        W,
        roadH
    );

    ctx.fillStyle =
        "#45454d";

    ctx.fillRect(
        0,
        gy,
        W,
        8
    );

    const dash = 34;

    const shift =
        (
            state.dist / .12
        ) %
        (dash*2);

    ctx.fillStyle =
        "#e6d36a";

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(

            x-shift,

            gy +
            roadH*.45,

            20,

            4

        );

    }

    ctx.fillStyle =
        "#79583a";

    ctx.fillRect(

        0,

        gy+roadH,

        W,

        H-gy-roadH

    );

    const tile = 26;

    const tileShift =
        (
            state.dist / .12
        ) % tile;

    ctx.fillStyle =
        "#68482d";

    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(

            x-tileShift,

            gy+roadH+10,

            12,

            4

        );

    }

}

    ctx.translate(px,py);

    ctx.rotate(-.1);

    ctx.fillStyle =
        "#282923";

    ctx.fillRect(
        0,
        -4,
        40,
        8
    );

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        34,
        -6,
        11,
        4
    );

    ctx.fillStyle =
        "#6d4928";

    ctx.fillRect(
        5,
        2,
        9,
        12
    );

    ctx.fillStyle =
        "#141414";

    ctx.fillRect(
        14,
        4,
        8,
        6
    );

    ctx.restore();

}

/* =========================================================
   SHIELD EFFECT AROUND PLAYER
   ========================================================= */

function drawShieldEffect(){

    if(shieldT <= 0){
        return;
    }

    const cx =
        player.x +
        player.w/2;

    const cy =
        player.y +
        player.h/2;

    const pulse =
        1 +
        Math.sin(
            state.t*8
        )*.06;

    ctx.save();

    ctx.globalAlpha =
        .22 +
        Math.sin(state.t*7)*.04;

    ctx.strokeStyle =
        "#4db9ff";

    ctx.lineWidth = 4;

    ctx.shadowColor =
        "#35aaff";

    ctx.shadowBlur = 15;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        43*pulse,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

}

/* =========================================================
   UPDATE POWERUP POSITION
   ========================================================= */

function setObstacleY(o){

    if(o.type === "dick"){

        /*
            Летающие препятствия выше дороги.
        */

        o.y =
            state.groundY -
            o.flyY -
            o.h;

        return;

    }

    if(
        o.type === "shield" ||
        o.type === "ak"
    ){

        /*
            Предметы находятся чуть выше дороги,
            чтобы их было легко заметить.
        */

        o.y =
            state.groundY -
            o.h -
            24;

        return;

    }

    o.y =
        state.groundY -
        o.h;

}

/* =========================================================
   BULLET SPAWN
   ========================================================= */

function fireGun(){

    const baseY =
        player.y + 47;

    /*
        Центральная пуля + небольшое
        рассеивание.
    */

    const angles = [
        -.045,
        0,
        .045
    ];

    angles.forEach(angle => {

        bullets.push({

            x:
                player.x +
                player.w +
                5,

            y:
                baseY,

            vx:
                720 *
                Math.cos(angle),

            vy:
                720 *
                Math.sin(angle),

            life:.65

        });

    });

}

/* =========================================================
   COLLISION / OBJECT UPDATE
   ========================================================= */

function updateObstacles(dt){

    const pBox =
        getPlayerHitbox();

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            state.speed * dt;

        setObstacleY(o);

        /*
            Bullets against normal obstacles.
        */

        let destroyed = false;

        for(
            let b=bullets.length-1;
            b>=0;
            b--
        ){

            const bullet =
                bullets[b];

            const bulletBox = {

                x:bullet.x,
                y:bullet.y,
                w:11,
                h:4

            };

            if(
                o.type !== "shield" &&
                o.type !== "ak" &&
                hit(
                    bulletBox,
                    getObstacleHitbox(o)
                )
            ){

                boom(
                    o.x + o.w/2,
                    o.y + o.h/2,
                    "#ffe08a",
                    9
                );

                obstacles.splice(i,1);

                bullets.splice(b,1);

                destroyed = true;

                break;

            }

        }

        if(destroyed){
            continue;
        }

        /*
            Player collision.
        */

        const oBox =
            getObstacleHitbox(o);

        if(
            hit(
                pBox,
                oBox
            )
        ){

            /*
                SHIELD PICKUP
            */

            if(o.type === "shield"){

                shieldT = 10;

                boom(
                    o.x + o.w/2,
                    o.y + o.h/2,
                    "#53bfff",
                    18
                );

                obstacles.splice(i,1);

                continue;

            }

            /*
                AK PICKUP
            */

            if(o.type === "ak"){

                gunT = 10;

                fireAcc = 0;

                boom(
                    o.x + o.w/2,
                    o.y + o.h/2,
                    "#9fff65",
                    18
                );

                obstacles.splice(i,1);

                continue;

            }

            /*
                NORMAL OBSTACLE + SHIELD
            */

            if(shieldT > 0){

                boom(
                    o.x + o.w/2,
                    o.y + o.h/2,
                    "#ffffff",
                    15
                );

                obstacles.splice(i,1);

                continue;

            }

            gameOver(o.type);

            return;

        }

        /*
            Remove objects outside screen.
        */

        if(
            o.x + o.w < -60
        ){

            obstacles.splice(i,1);

        }

    }

}

/* =========================================================
   BULLET UPDATE
   ========================================================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.x +=
            b.vx * dt;

        b.y +=
            b.vy * dt;

        b.life -= dt;

        if(
            b.life <= 0 ||
            b.x > W + 30 ||
            b.y < -30 ||
            b.y > H + 30
        ){

            bullets.splice(i,1);

        }

    }

}

/* =========================================================
   PARTICLE UPDATE
   ========================================================= */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.life -= dt;

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            420 * dt;

        if(p.life <= 0){

            particles.splice(i,1);

        }

    }

}

/* =========================================================
   BUFF HUD
   ========================================================= */

function updateBuffHud(){

    const buffs = [];

    if(shieldT > 0){

        buffs.push(
            "ЩИТ " +
            Math.ceil(shieldT) +
            "с"
        );

    }

    if(gunT > 0){

        buffs.push(
            "АК " +
            Math.ceil(gunT) +
            "с"
        );

    }

    buffEl.textContent =
        buffs.join(" · ");

}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(kind){

    if(state.over){
        return;
    }

    state.over = true;
    state.running = false;

    const score =
        Math.floor(state.dist);

    if(score > best){

        best = score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        renderBest();

    }

    titleScreen.style.display = "block";

    pickScreen.style.display = "none";

    difficultyScreen.style.display = "none";

    const title =
        document.getElementById("titleText");

    const description =
        document.getElementById("descriptionText");

    title.textContent =
        kind === "dick"
        ? "Есть пробитие"
        : "Это конец, ты в говне";

    description.textContent =
        "Ты добежал " +
        score +
        " м. Выбери бойца и попробуй ещё раз.";

    overlay.style.display = "flex";

}

/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets(){

    for(const b of bullets){

        ctx.fillStyle =
            "#ffe58a";

        ctx.shadowColor =
            "#ffb52e";

        ctx.shadowBlur = 6;

        ctx.fillRect(
            b.x,
            b.y,
            11,
            3
        );

        ctx.shadowBlur = 0;

    }

}

/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(
                0,
                Math.min(
                    1,
                    p.life * 3
                )
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha = 1;

}

/* =========================================================
   DRAW OBSTACLES
   ========================================================= */

function drawObstacles(){

    for(const o of obstacles){

        if(o.type === "poop"){

            drawPoop(o);

        }else if(o.type === "dick"){

            drawDick(o);

        }else if(o.type === "shield"){

            drawShieldIcon(o);

        }else if(o.type === "ak"){

            drawAkIcon(o);

        }

    }

}

/* =========================================================
   MAIN UPDATE
   ========================================================= */

function update(dt){

    state.groundY =
        Math.floor(H * .70);

    /*
        Player on ground.
    */

    if(player.onGround){

        player.y =
            state.groundY -
            player.h;

    }

    if(
        state.running &&
        !state.over
    ){

        const diff =
            DIFFICULTIES[
                selectedDifficulty
            ];

        state.t += dt;

        /*
            ПЛАВНОЕ УСКОРЕНИЕ.

            Каждый режим начинается медленно,
            затем скорость постепенно растёт.
        */

        state.speed =
            Math.min(
                diff.maxSpeed,
                state.speed +
                diff.acceleration * dt
            );

        /*
            Distance.
        */

        state.dist +=
            state.speed *
            dt *
            .12;

        scoreEl.textContent =
            Math.floor(state.dist) +
            " м";

        /*
            Buff timers.
        */

        shieldT =
            Math.max(
                0,
                shieldT - dt
            );

        gunT =
            Math.max(
                0,
                gunT - dt
            );

        updateBuffHud();

        /*
            Gravity.
        */

        player.vy +=
            state.gravity *
            (
                player.vy > 0
                ? 2
                : 1
            ) *
            dt;

        player.y +=
            player.vy * dt;

        if(
            player.y >=
            state.groundY -
            player.h
        ){

            player.y =
                state.groundY -
                player.h;

            player.vy = 0;

            player.onGround = true;

            player.jumpsUsed = 0;

        }

        /*
            AUTOMATIC AK.
        */

        if(gunT > 0){

            fireAcc += dt;

            if(fireAcc >= .105){

                fireAcc = 0;

                fireGun();

            }

        }else{

            fireAcc = 0;

        }

        /*
            Normal obstacle spawn.
        */

        spawnTimer -= dt;

        if(spawnTimer <= 0){

            const didSpawn =
                spawnObstacle();

            /*
                Если слишком близко другое
                препятствие — не уменьшаем
                дистанцию до следующего.
            */

            if(didSpawn){

                const min =
                    diff.obstacleMin;

                const max =
                    diff.obstacleMax;

                spawnTimer =
                    min +
                    Math.random() *
                    (
                        max-min
                    );

            }else{

                spawnTimer = .25;

            }

        }

        /*
            POWERUP EVERY ~3000 METERS.

            Первый предмет появится около 3000 м,
            затем около 6000, 9000 и т.д.
        */

        if(
            state.dist >=
            state.nextPowerDistance
        ){

            /*
                Не спавним предмет вплотную
                к другому препятствию.
            */

            const last =
                obstacles.length
                ? obstacles[obstacles.length-1]
                : null;

            if(
                !last ||
                last.x < W - 220
            ){

                spawnPower();

                state.nextPowerDistance +=
                    diff.powerDistance;

            }

        }

        updateObstacles(dt);

        if(!state.over){

            updateBullets(dt);

        }

    }

    updateParticles(dt);

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

    drawBackdrop();

    drawObstacles();

    drawBullets();

    drawParticles();

    if(
        gunT > 0 &&
        state.running
    ){

        drawGun();

    }

    if(
        shieldT > 0 &&
        state.running
    ){

        drawShieldEffect();

    }

    /*
        DOM character.
    */

    heroEl.style.left =
        player.x + "px";

    heroEl.style.top =
        player.y + "px";

    heroDoll.classList.toggle(
        "run",
        state.running &&
        !state.over &&
        player.onGround
    );

}

/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );

    lastTime = now;

    update(dt);

    render();

    requestAnimationFrame(loop);

}

applySkin();

requestAnimationFrame(loop);

})();
</script>

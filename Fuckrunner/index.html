<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FUCKRUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#170d20;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    user-select:none;
}

#wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* =========================================================
   HERO
   ========================================================= */

#hero{
    position:absolute;
    left:90px;
    top:0;
    width:72px;
    height:100px;
    z-index:5;
    pointer-events:none;
}

.doll{
    position:absolute;
    left:0;
    top:0;
    width:72px;
    height:100px;
}

/* ---------- head ---------- */

.head{
    position:absolute;
    left:20px;
    top:10px;
    width:31px;
    height:29px;
    background:#eeb08a;
    border:2px solid #8b5038;
    border-radius:48% 48% 44% 44%;
    z-index:5;
}

.head:after{
    content:"";
    position:absolute;
    left:7px;
    bottom:3px;
    width:15px;
    height:4px;
    border-bottom:2px solid #7c3c32;
    border-radius:50%;
}

.eye{
    position:absolute;
    top:20px;
    width:4px;
    height:5px;
    background:#171317;
    border-radius:50%;
    z-index:7;
}

.eye.l{left:27px}
.eye.r{left:40px}

/* ---------- cap ---------- */

.cap{
    position:absolute;
    left:15px;
    top:0;
    width:43px;
    height:16px;
    background:#151318;
    border-radius:11px 11px 3px 3px;
    z-index:8;
}

.cap:before{
    content:"";
    position:absolute;
    left:7px;
    top:3px;
    width:28px;
    height:4px;
    background:#303039;
    border-radius:3px;
}

.cap:after{
    content:"";
    position:absolute;
    right:-9px;
    bottom:1px;
    width:19px;
    height:6px;
    background:#151318;
    border-radius:0 6px 6px 0;
}

.tag{
    position:absolute;
    left:17px;
    top:4px;
    width:39px;
    color:#fff;
    font:900 6px/1 sans-serif;
    text-align:center;
    z-index:9;
}

/* ---------- torso ---------- */

.shirt{
    position:absolute;
    left:12px;
    top:36px;
    width:48px;
    height:39px;
    background:#2eaa51;
    border:2px solid #185e2d;
    border-radius:9px 9px 6px 6px;
    z-index:3;
}

.shirt:before{
    content:"";
    position:absolute;
    left:5px;
    right:5px;
    top:7px;
    height:4px;
    background:rgba(255,255,255,.12);
    border-radius:4px;
}

.shirt:after{
    content:"";
    position:absolute;
    left:50%;
    top:15px;
    width:9px;
    height:9px;
    transform:translateX(-50%);
    background:#e7cf77;
    border-radius:2px;
    opacity:.7;
}

.collar{
    position:absolute;
    left:12px;
    top:36px;
    width:48px;
    height:9px;
    background:#207d3a;
    border-radius:8px 8px 0 0;
    z-index:4;
}

/* ---------- arms ---------- */

.arm{
    position:absolute;
    top:39px;
    width:11px;
    height:29px;
    background:#e2a27c;
    border:2px solid #8d523d;
    border-radius:7px;
    transform-origin:50% 3px;
    z-index:2;
}

.arm.l{
    left:5px;
    transform:rotate(8deg);
}

.arm.r{
    right:5px;
    transform:rotate(-8deg);
}

/* кисть является частью руки */

.arm:after{
    content:"";
    position:absolute;
    left:-2px;
    bottom:-7px;
    width:11px;
    height:9px;
    background:#e2a27c;
    border:2px solid #8d523d;
    border-radius:50%;
}

/* ---------- legs ---------- */

.leg{
    position:absolute;
    bottom:0;
    width:12px;
    height:28px;
    background:#39302c;
    border:2px solid #1e1918;
    border-radius:6px;
    transform-origin:50% 2px;
    z-index:1;
}

.leg.l{left:23px}
.leg.r{right:23px}

/* обувь является частью ноги */

.leg:after{
    content:"";
    position:absolute;
    left:-5px;
    bottom:-4px;
    width:21px;
    height:9px;
    background:#17161a;
    border:2px solid #08080a;
    border-radius:6px 7px 4px 4px;
}

/* ---------- running ---------- */

.doll.run .arm.l{
    animation:armLeft .32s ease-in-out infinite;
}

.doll.run .arm.r{
    animation:armRight .32s ease-in-out infinite;
}

.doll.run .leg.l{
    animation:legLeft .32s ease-in-out infinite;
}

.doll.run .leg.r{
    animation:legRight .32s ease-in-out infinite;
}

@keyframes armLeft{
    0%,100%{transform:rotate(27deg)}
    50%{transform:rotate(-38deg)}
}

@keyframes armRight{
    0%,100%{transform:rotate(-38deg)}
    50%{transform:rotate(27deg)}
}

@keyframes legLeft{
    0%,100%{transform:rotate(25deg)}
    50%{transform:rotate(-25deg)}
}

@keyframes legRight{
    0%,100%{transform:rotate(-25deg)}
    50%{transform:rotate(25deg)}
}

/* =========================================================
   BUMBLE
   ========================================================= */

.skin-bumble .head,
.skin-bumble .arm{
    background:#704027;
}

.skin-bumble .shirt{
    background:#151515;
    border-color:#050505;
}

.skin-bumble .collar{
    background:#caa329;
}

.skin-bumble .cap,
.skin-bumble .cap:after{
    background:#caa329;
}

.skin-bumble .tag{
    color:#111;
}

.skin-bumble .chain{
    position:absolute;
    left:23px;
    top:45px;
    width:27px;
    height:15px;
    border:3px solid #efc94e;
    border-top:0;
    border-radius:0 0 15px 15px;
    z-index:6;
}

/* =========================================================
   LABUBA — это толстый человек, НЕ игрушка
   ========================================================= */

.skin-labuba{
    width:88px;
}

.skin-labuba .head{
    left:27px;
    top:8px;
    width:35px;
    height:31px;
}

.skin-labuba .eye.l{left:35px}
.skin-labuba .eye.r{left:50px}

.skin-labuba .cap{
    left:22px;
}

.skin-labuba .tag{
    left:24px;
}

.skin-labuba .shirt{
    left:8px;
    top:36px;
    width:72px;
    height:44px;
    background:#b9572c;
    border-color:#713319;
    border-radius:17px 17px 9px 9px;
}

.skin-labuba .collar{
    left:8px;
    top:36px;
    width:72px;
    background:#843d1e;
}

.skin-labuba .arm.l{left:0}
.skin-labuba .arm.r{right:0}

.skin-labuba .leg.l{left:29px}
.skin-labuba .leg.r{right:29px}

/* =========================================================
   GIRL
   ========================================================= */

.skin-girl .hair{
    display:block;
    position:absolute;
    left:14px;
    top:4px;
    width:43px;
    height:38px;
    background:#e9c85f;
    border:2px solid #9e7931;
    border-radius:20px 20px 8px 8px;
    z-index:3;
}

.skin-girl .cap,
.skin-girl .tag,
.skin-girl .collar{
    display:none;
}

.skin-girl .head{
    background:#f6c7a5;
}

.skin-girl .shirt{
    background:#ef70a8;
    border-color:#a53d6b;
    border-radius:12px 12px 17px 17px;
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
    position:absolute;
    left:10px;
    right:10px;
    top:10px;
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-weight:900;
    font-size:15px;
    text-shadow:0 2px #000;
    z-index:20;
    pointer-events:none;
}

#buff{
    margin-top:4px;
    color:#9ff36d;
    font-size:12px;
}

#speedHud{
    margin-top:3px;
    color:#ffe08a;
    font-size:11px;
}

/* =========================================================
   CITY
   ========================================================= */

#cityTag{
    position:absolute;
    top:43px;
    left:50%;
    transform:translateX(-50%);
    color:#ffe08a;
    font-size:13px;
    font-weight:900;
    text-shadow:0 2px #000;
    z-index:20;
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
}

/* =========================================================
   OVERLAY
   ========================================================= */

#overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(8,4,14,.88);
    color:#fff;
    z-index:50;
    padding:14px;
    text-align:center;
}

#screen-title{
    width:min(600px,96vw);
}

#screen-title h1,
#screen-pick h1{
    color:#ff4d6d;
    font-size:26px;
    margin-bottom:8px;
    text-shadow:3px 3px #35000e;
}

#screen-title p{
    max-width:380px;
    margin:0 auto 15px;
    line-height:1.4;
}

#screen-title.hide{
    display:none;
}

#screen-pick{
    display:none;
    width:min(650px,96vw);
}

#screen-pick.show{
    display:block;
}

.section-title{
    margin-top:12px;
    margin-bottom:7px;
    color:#ffe08a;
    font-size:13px;
    font-weight:900;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:8px;
}

.card{
    min-height:115px;
    padding:7px;
    background:#241428;
    border:3px solid #52364d;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
}

.card.sel{
    border-color:#ff4d6d;
    box-shadow:0 0 0 3px rgba(255,77,109,.25);
}

.card .nm{
    color:#ffe08a;
    font-size:11px;
    font-weight:900;
    margin-bottom:2px;
}

.stage{
    position:relative;
    height:82px;
    overflow:hidden;
}

.stage .doll{
    transform:scale(.68);
    transform-origin:left top;
}

.difficulty{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:13px;
}

.diff{
    padding:9px 4px;
    min-height:54px;
    background:#211327;
    border:3px solid #51374b;
    color:#fff;
    font-family:inherit;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.diff small{
    display:block;
    color:#aaa;
    font-size:8px;
    margin-top:4px;
}

.diff.sel{
    border-color:#54c7ff;
    background:#17283a;
}

button.main{
    appearance:none;
    border:3px solid #fff;
    background:#ff4d6d;
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:900;
    padding:11px 25px;
    cursor:pointer;
}

button.main:disabled{
    opacity:.35;
}

.hint{
    margin-top:10px;
    color:#aaa;
    font-size:10px;
}

/* =========================================================
   SHIELD DOM EFFECT
   ========================================================= */

#shieldAura{
    position:absolute;
    display:none;
    width:112px;
    height:122px;
    border:4px solid rgba(50,170,255,.9);
    border-radius:50%;
    box-shadow:
        0 0 8px #29aaff,
        0 0 20px #078cff,
        inset 0 0 18px rgba(40,160,255,.45);
    z-index:4;
    pointer-events:none;
    animation:shieldPulse .6s ease-in-out infinite alternate;
}

#shieldAura.show{
    display:block;
}

@keyframes shieldPulse{
    from{
        opacity:.65;
        transform:scale(.96);
    }
    to{
        opacity:1;
        transform:scale(1.04);
    }
}
</style>
</head>

<body>

<div id="wrap">

<canvas id="c"></canvas>

<div id="hero">
    <div id="shieldAura"></div>

    <div class="doll skin-vega">

        <div class="hair"></div>
        <div class="cap"></div>
        <div class="tag">ВЕГА</div>

        <div class="head"></div>

        <div class="eye l"></div>
        <div class="eye r"></div>

        <div class="arm l"></div>
        <div class="arm r"></div>

        <div class="shirt"></div>
        <div class="collar"></div>
        <div class="chain"></div>

        <div class="leg l"></div>
        <div class="leg r"></div>

    </div>
</div>

<div id="hud">
    <div>
        <div id="score">0 м</div>
        <div id="buff"></div>
        <div id="speedHud"></div>
    </div>

    <div id="best">лучший счет 0</div>
</div>

<div id="cityTag"></div>

<div id="overlay">

    <div id="screen-title">

        <h1>FUCKRUNNER</h1>

        <p>
            Обычный работяга живёт свою обычную жизнь.
        </p>

        <button class="main" id="pickBtn">
            НАСТРОИТЬ ЗАБЕГ
        </button>

        <div class="hint">
            тап — прыжок · второй тап — двойной прыжок
        </div>

    </div>

    <div id="screen-pick">

        <h1>НАСТРОЙКА ЗАБЕГА</h1>

        <div class="section-title">
            ВЫБОР ПЕРСОНАЖА
        </div>

        <div class="grid" id="grid"></div>

        <div class="section-title">
            ВЫБОР СЛОЖНОСТИ
        </div>

        <div class="difficulty">

            <button class="diff" data-diff="easy">
                СОСУНОК ЕБАНЫЙ
                <small>медленное ускорение</small>
            </button>

            <button class="diff" data-diff="normal">
                ОБЫЧНЫЙ РАБОТЯГА С ЗАВОДА
                <small>нормальное ускорение</small>
            </button>

            <button class="diff" data-diff="hard">
                КИБОРГ УБИЙЦА
                <small>быстрое ускорение</small>
            </button>

        </div>

        <button class="main" id="start" disabled>
            ПОГНАЛИ
        </button>

    </div>

</div>

</div>

<script>
(() => {

'use strict';

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if(tg){
    tg.ready();
    tg.expand();

    try{
        tg.setHeaderColor('#2a1630');
        tg.setBackgroundColor('#1a1020');
    }catch(e){}
}

/* =========================================================
   DOM
   ========================================================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const overlay = document.getElementById('overlay');
const titleScreen = document.getElementById('screen-title');
const pickScreen = document.getElementById('screen-pick');

const grid = document.getElementById('grid');
const startBtn = document.getElementById('start');
const pickBtn = document.getElementById('pickBtn');

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const buffEl = document.getElementById('buff');
const speedEl = document.getElementById('speedHud');

const heroEl = document.getElementById('hero');
const shieldAura = document.getElementById('shieldAura');
const cityTag = document.getElementById('cityTag');

/* =========================================================
   CANVAS
   ========================================================= */

let W = 0;
let H = 0;
let dpr = 1;

function resize(){

    dpr = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);

    canvas.style.width = W+'px';
    canvas.style.height = H+'px';

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled = false;
}

window.addEventListener('resize',resize);
resize();

/* =========================================================
   CITIES
   ========================================================= */

const CITIES = [
    {name:'ЕКАТЕРИНБУРГ',src:'../bg_far.jpg'},
    {name:'ТОЛЬЯТТИ',src:'../bg_tlt.jpg'},
    {name:'УЛЬЯНОВСК',src:'../bg_uln.jpg'},
    {name:'КАЗАНЬ',src:'../bg_kzn.jpg'},
    {name:'ЙОШКАР-ОЛА',src:'../bg_yosh.jpg'},
    {name:'САРАТОВ',src:'../bg_sar.jpg'},
    {name:'САМАРА',src:'../bg_sam.jpg'}
];

const cityImgs = CITIES.map(city => {
    const img = new Image();
    img.src = city.src;
    return img;
});

/* =========================================================
   FIGHTERS
   ========================================================= */

const FIGHTERS = [
    {id:'vega',name:'Вегамэн',tag:'ВЕГА'},
    {id:'bumble',name:'Бамбл Бизи',tag:'BEE'},
    {id:'labuba',name:'Лабуба',tag:'ЛАБ'},
    {id:'girl',name:'Вагина реалистик',tag:''}
];

let skin = 'vega';

function fighterHTML(f){

    return `
        <div class="nm">${f.name}</div>

        <div class="stage">

            <div class="doll skin-${f.id}">

                <div class="hair"></div>
                <div class="cap"></div>
                <div class="tag">${f.tag}</div>

                <div class="head"></div>

                <div class="eye l"></div>
                <div class="eye r"></div>

                <div class="arm l"></div>
                <div class="arm r"></div>

                <div class="shirt"></div>
                <div class="collar"></div>
                <div class="chain"></div>

                <div class="leg l"></div>
                <div class="leg r"></div>

            </div>

        </div>
    `;
}

FIGHTERS.forEach(f => {

    const card = document.createElement('button');

    card.className = 'card';
    card.dataset.id = f.id;
    card.innerHTML = fighterHTML(f);

    card.addEventListener('click',() => {

        document.querySelectorAll('.card').forEach(c => {
            c.classList.remove('sel');

            const d = c.querySelector('.doll');
            if(d) d.classList.remove('run');
        });

        card.classList.add('sel');

        const doll = card.querySelector('.doll');
        if(doll) doll.classList.add('run');

        skin = f.id;

        applySkin();
        updateStartState();
    });

    grid.appendChild(card);
});

/* =========================================================
   DIFFICULTY
   ========================================================= */

const DIFFICULTIES = {

    easy:{
        startSpeed:235,
        acceleration:4.5,
        spawnMin:1.35,
        spawnMax:2.05
    },

    normal:{
        startSpeed:260,
        acceleration:7.5,
        spawnMin:1.15,
        spawnMax:1.75
    },

    hard:{
        startSpeed:285,
        acceleration:12,
        spawnMin:.88,
        spawnMax:1.42
    }

};

let difficulty = null;

document.querySelectorAll('.diff').forEach(btn => {

    btn.addEventListener('click',() => {

        document.querySelectorAll('.diff')
            .forEach(b => b.classList.remove('sel'));

        btn.classList.add('sel');

        difficulty = btn.dataset.diff;

        updateStartState();
    });

});

function updateStartState(){

    startBtn.disabled =
        !skin ||
        !difficulty;
}

/* =========================================================
   SKIN
   ========================================================= */

function applySkin(){

    heroEl.className = '';

    const doll = heroEl.querySelector('.doll');

    doll.className =
        'doll skin-'+skin;

    const fighter =
        FIGHTERS.find(f => f.id === skin);

    if(fighter){
        heroEl.querySelector('.tag').textContent =
            fighter.tag;
    }

    player.w =
        skin === 'labuba'
        ? 88
        : 72;
}

/* =========================================================
   STATE
   ========================================================= */

const state = {

    running:false,
    over:false,

    t:0,
    speed:260,
    dist:0,

    gravity:2400,

    groundY:0,

    city:-1

};

const player = {

    x:90,
    y:0,

    vy:0,

    w:72,
    h:100,

    onGround:true,
    jumpsUsed:0

};

const obstacles = [];
const bullets = [];
const particles = [];

/* =========================================================
   POWERUPS
   ========================================================= */

/*
    Первый АК  = 1500 м
    Первый ЩИТ = 3000 м
    Второй АК  = 4500 м
    Второй ЩИТ = 6000 м
    и далее.
*/

let nextPowerDistance = 1500;
let powerIndex = 0;

let shieldT = 0;
let gunT = 0;

let fireAcc = 0;

/* =========================================================
   BEST
   ========================================================= */

const BEST_KEY = 'fuckrunner_best_v4';

let best =
    parseInt(
        localStorage.getItem(BEST_KEY) || '0',
        10
    );

bestEl.textContent =
    'лучший счет '+best;

/* =========================================================
   MENU
   ========================================================= */

pickBtn.addEventListener('click',() => {

    titleScreen.classList.add('hide');
    pickScreen.classList.add('show');

});

function showMenu(){

    overlay.style.display = 'flex';

    titleScreen.classList.remove('hide');
    pickScreen.classList.remove('show');

}

/* =========================================================
   CITY
   ========================================================= */

function toastCity(i){

    if(i === state.city) return;

    state.city = i;

    cityTag.textContent =
        CITIES[i].name;

    cityTag.style.opacity = '1';

    clearTimeout(toastCity.timer);

    toastCity.timer =
        setTimeout(() => {
            cityTag.style.opacity = '0';
        },1600);
}

/* =========================================================
   RESET
   ========================================================= */

function reset(){

    const d = DIFFICULTIES[difficulty];

    state.running = true;
    state.over = false;

    state.t = 0;
    state.dist = 0;
    state.speed = d.startSpeed;
    state.city = -1;

    player.vy = 0;
    player.onGround = true;
    player.jumpsUsed = 0;

    obstacles.length = 0;
    bullets.length = 0;
    particles.length = 0;

    shieldT = 0;
    gunT = 0;

    fireAcc = 0;

    /*
        Следующий powerup всегда начинается
        с 1500 метров.
    */

    nextPowerDistance = 1500;
    powerIndex = 0;

    spawnTimer =
        d.spawnMin +
        Math.random()*(d.spawnMax-d.spawnMin);

    applySkin();

    overlay.style.display = 'none';

    toastCity(0);
}

/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(!state.running || state.over)
        return;

    if(player.jumpsUsed >= 2)
        return;

    player.vy =
        player.jumpsUsed === 0
        ? -830
        : -1080;

    player.onGround = false;
    player.jumpsUsed++;
}

/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener('keydown',e => {

    if(
        e.code === 'Space' ||
        e.code === 'ArrowUp'
    ){

        e.preventDefault();
        jump();
    }

});

window.addEventListener('pointerdown',e => {

    if(e.target.closest('#overlay'))
        return;

    if(state.running)
        jump();

});

/* =========================================================
   AUDIO
   ========================================================= */

const TRACKS = [
    'ushet.mp3',
    '../bogi.mp3',
    '../gorod.mp3',
    '../Chto.mp3',
    '../Police.mp3',
    '../Big.mp3'
];

let lastTrack = -1;
let musicStarted = false;

const music = new Audio();
music.volume = .55;

function playRandom(){

    if(!TRACKS.length)
        return;

    let i =
        Math.floor(Math.random()*TRACKS.length);

    if(TRACKS.length > 1 && i === lastTrack)
        i = (i+1)%TRACKS.length;

    lastTrack = i;
    music.src = TRACKS[i];

    music.play().catch(()=>{});
}

music.addEventListener('ended',playRandom);
music.addEventListener('error',() => {
    setTimeout(playRandom,100);
});

/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener('click',e => {

    e.stopPropagation();

    if(startBtn.disabled)
        return;

    reset();

    if(!musicStarted){

        musicStarted = true;

        playRandom();
    }
});

/* =========================================================
   SPAWN OBSTACLES
   ========================================================= */

let spawnTimer = 1.5;

function spawnObstacle(){

    const type =
        Math.random() < .56
        ? 'poop'
        : 'dick';

    if(type === 'poop'){

        obstacles.push({

            type:'poop',

            x:W+50,

            y:0,

            w:46,
            h:38

        });

    }else{

        obstacles.push({

            type:'dick',

            x:W+50,

            y:0,

            flyY:
                125 +
                Math.random()*65,

            w:52,
            h:22,

            wob:
                Math.random()*Math.PI*2

        });
    }
}

/* =========================================================
   POWER SPAWN
   ========================================================= */

function spawnPower(){

    /*
        powerIndex:
        0 -> AK
        1 -> shield
        2 -> AK
        3 -> shield
    */

    const type =
        powerIndex % 2 === 0
        ? 'ak'
        : 'shield';

    powerIndex++;

    obstacles.push({

        type,

        x:W+70,

        y:0,

        w:
            type === 'shield'
            ? 42
            : 48,

        h:
            type === 'shield'
            ? 42
            : 25,

        bob:
            Math.random()*Math.PI*2
    });
}

/* =========================================================
   COLLISION
   ========================================================= */

function hit(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

/*
    Hitbox игрока немного меньше визуального персонажа.
    Это делает управление честнее и не возвращает
    старую проблему с проходом сквозь препятствия.
*/

function getPlayerHitbox(){

    return {

        x:player.x+9,
        y:player.y+7,

        w:player.w-18,
        h:player.h-10

    };
}

/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(
            W*.92,
            h*(img.naturalWidth/img.naturalHeight)
        );
    }

    return W*.92;
}

function drawCities(gy){

    const h = gy+6;

    const widths =
        cityImgs.map(img => cityWidth(img,h));

    const total =
        widths.reduce((a,b)=>a+b,0) || W;

    const scroll =
        (state.dist*2.2)%total;

    let x = -scroll;
    let seen = state.city;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const i = n%CITIES.length;
        const w = widths[i];
        const img = cityImgs[i];

        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(
                img,
                Math.floor(x),
                0,
                Math.ceil(w)+1,
                Math.ceil(h)
            );
        }

        if(
            x <= W*.35 &&
            x+w > W*.35
        ){

            seen = i;
        }

        x += w;

        if(x > W+5)
            break;
    }

    if(seen >= 0)
        toastCity(seen);
}

function drawBackdrop(){

    const gy = state.groundY;

    const gradient =
        ctx.createLinearGradient(
            0,0,0,gy
        );

    gradient.addColorStop(0,'#38205c');
    gradient.addColorStop(1,'#c35b3b');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,gy);

    drawCities(gy);

    const roadH =
        Math.floor((H-gy)*.46);

    ctx.fillStyle='#5b5b63';
    ctx.fillRect(0,gy,W,roadH);

    ctx.fillStyle='#4b4b53';
    ctx.fillRect(0,gy,W,8);

    const dash = 34;

    const shift =
        (state.dist/.12)%(dash*2);

    ctx.fillStyle='#e5d46a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy+roadH*.45,
            20,
            4
        );
    }

    ctx.fillStyle='#795a3b';

    ctx.fillRect(
        0,
        gy+roadH,
        W,
        H-gy-roadH
    );
}

/* =========================================================
   DRAW POOP
   ========================================================= */

function drawPoop(o){

    const x = o.x+o.w/2;
    const y = o.y+o.h;

    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle='#5a2d12';

    ctx.beginPath();
    ctx.ellipse(0,-10,20,12,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-4,-22,14,10,-.2,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(2,-32,9,8,.2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#fff';

    ctx.beginPath();
    ctx.arc(-6,-22,3,0,Math.PI*2);
    ctx.arc(4,-20,2.4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#111';

    ctx.beginPath();
    ctx.arc(-6,-22,1.3,0,Math.PI*2);
    ctx.arc(4,-20,1.2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW DICK
   ========================================================= */

function drawDick(o){

    const x = o.x+o.w/2;

    /*
        Было слишком низко.
        Теперь объект значительно выше.
    */

    const y =
        state.groundY -
        o.flyY -
        o.h +
        Math.sin(state.t*5+o.wob)*5;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        -.15+
        Math.sin(state.t*4+o.wob)*.12
    );

    ctx.fillStyle='#efb08a';

    ctx.beginPath();
    ctx.roundRect(-22,-8,36,16,8);
    ctx.fill();

    ctx.fillStyle='#dc8585';

    ctx.beginPath();
    ctx.ellipse(16,0,11,10,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#dfa07b';

    ctx.beginPath();
    ctx.ellipse(-20,6,8,7,0,0,Math.PI*2);
    ctx.ellipse(-12,8,8,7,0,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

/* =========================================================
   DRAW SHIELD POWERUP
   ========================================================= */

function drawShieldIcon(o){

    const x = o.x+o.w/2;

    const y =
        state.groundY-o.h-10+
        Math.sin(state.t*5+o.bob)*5;

    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle='#126cff';

    ctx.beginPath();

    ctx.moveTo(0,-20);
    ctx.lineTo(18,-12);
    ctx.lineTo(15,9);
    ctx.lineTo(0,21);
    ctx.lineTo(-15,9);
    ctx.lineTo(-18,-12);
    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle='#c8efff';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.fillStyle='#fff';
    ctx.font='900 12px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('S',0,1);

    ctx.restore();
}

/* =========================================================
   DRAW AK POWERUP
   ========================================================= */

function drawAkIcon(o){

    const x = o.x+o.w/2;

    const y =
        state.groundY-o.h-10+
        Math.sin(state.t*5+o.bob)*5;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(-.22);

    ctx.fillStyle='#34362e';
    ctx.fillRect(-23,-4,42,8);

    ctx.fillStyle='#1c211d';
    ctx.fillRect(13,-7,13,4);

    ctx.fillStyle='#704b28';
    ctx.fillRect(-8,2,10,13);

    ctx.fillStyle='#24251f';
    ctx.fillRect(-18,3,8,5);

    ctx.fillStyle='#111';
    ctx.fillRect(24,-6,5,5);

    ctx.restore();
}

/* =========================================================
   DRAW GUN IN CHARACTER'S HANDS
   ========================================================= */

function drawGun(){

    /*
        АК расположен между руками,
        поэтому визуально персонаж действительно
        держит оружие.
    */

    const px =
        player.x+
        player.w*.5;

    const py =
        player.y+48;

    ctx.save();

    ctx.translate(px,py);

    ctx.rotate(-.08);

    ctx.fillStyle='#292b25';

    ctx.fillRect(
        -5,-4,
        39,8
    );

    ctx.fillStyle='#111';

    ctx.fillRect(
        28,-7,
        13,4
    );

    ctx.fillStyle='#6a4727';

    ctx.fillRect(
        3,2,
        8,13
    );

    ctx.fillStyle='#24251f';

    ctx.fillRect(
        -12,2,
        10,5
    );

    ctx.restore();
}

/* =========================================================
   BULLET
   ========================================================= */

function drawBullet(b){

    ctx.fillStyle='#ffe17a';

    ctx.fillRect(
        b.x,
        b.y,
        11,
        3
    );
}

/* =========================================================
   PARTICLES
   ========================================================= */

function boom(x,y,color){

    for(let i=0;i<12;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-.5)*260,

            vy:-70-Math.random()*180,

            life:.45,

            color

        });
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(type){

    state.running = false;
    state.over = true;

    const score =
        Math.floor(state.dist);

    if(score > best){

        best = score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        bestEl.textContent =
            'лучший счет '+best;
    }

    const h1 =
        titleScreen.querySelector('h1');

    const p =
        titleScreen.querySelector('p');

    h1.textContent =
        type === 'dick'
        ? 'ЕСТЬ ПРОБИТИЕ'
        : 'ЭТО КОНЕЦ';

    p.textContent =
        'Забег закончился на '+
        score+
        ' м.';

    showMenu();
}

/* =========================================================
   UPDATE BUFF UI
   ========================================================= */

function updateBuff(){

    const parts=[];

    if(shieldT > 0){

        parts.push(
            'ЩИТ '+
            Math.ceil(shieldT)+
            'с'
        );
    }

    if(gunT > 0){

        parts.push(
            'АК '+
            Math.ceil(gunT)+
            'с'
        );
    }

    buffEl.textContent =
        parts.join(' · ');

    shieldAura.classList.toggle(
        'show',
        shieldT > 0 && state.running
    );

    speedEl.textContent =
        state.running
        ? 'скорость '+Math.round(state.speed)
        : '';
}

/* =========================================================
   GAME LOOP
   ========================================================= */

let last = performance.now();

function loop(now){

    const dt =
        Math.min(
            .033,
            (now-last)/1000
        );

    last = now;

    state.groundY =
        Math.floor(H*.70);

    if(player.onGround){

        player.y =
            state.groundY-player.h;
    }

    if(
        state.running &&
        !state.over
    ){

        state.t += dt;

        const d =
            DIFFICULTIES[difficulty];

        /*
            Главное ускорение.

            Старт у каждой сложности медленный,
            но скорость постоянно увеличивается.

            Чем выше сложность —
            тем больше acceleration.
        */

        state.speed +=
            d.acceleration*dt;

        state.dist +=
            state.speed*dt*.12;

        scoreEl.textContent =
            Math.floor(state.dist)+' м';

        shieldT =
            Math.max(0,shieldT-dt);

        gunT =
            Math.max(0,gunT-dt);

        updateBuff();

        /* ---------- gravity ---------- */

        player.vy +=
            state.gravity*
            (player.vy > 0 ? 1.75 : 1)*
            dt;

        player.y +=
            player.vy*dt;

        if(
            player.y >=
            state.groundY-player.h
        ){

            player.y =
                state.groundY-player.h;

            player.vy=0;

            player.onGround=true;
            player.jumpsUsed=0;
        }

        /* ---------- gun ---------- */

        if(gunT > 0){

            fireAcc += dt;

            if(fireAcc >= .095){

                fireAcc=0;

                const baseY =
                    player.y+48;

                for(let k=-1;k<=1;k++){

                    const angle=k*.10;

                    bullets.push({

                        x:
                            player.x+
                            player.w+
                            8,

                        y:baseY,

                        vx:
                            720*Math.cos(angle),

                        vy:
                            720*Math.sin(angle),

                        life:.7
                    });
                }
            }
        }

        /* ---------- obstacles ---------- */

        spawnTimer -= dt;

        if(spawnTimer <= 0){

            spawnObstacle();

            spawnTimer =
                d.spawnMin+
                Math.random()*
                (d.spawnMax-d.spawnMin);

        }

        /* ---------- scheduled powers ---------- */

        if(state.dist >= nextPowerDistance){

            spawnPower();

            /*
                1500 -> 3000 -> 4500 -> 6000...
            */

            nextPowerDistance += 1500;
        }

        /* ---------- move + collisions ---------- */

        const pBox =
            getPlayerHitbox();

        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            const o=obstacles[i];

            o.x -= state.speed*dt;

            /* ---------- obstacle position ---------- */

            if(o.type === 'dick'){

                o.y =
                    state.groundY-
                    o.flyY-
                    o.h+
                    Math.sin(
                        state.t*5+o.wob
                    )*5;

            }else{

                o.y =
                    state.groundY-
                    o.h-
                    (
                        o.type==='shield' ||
                        o.type==='ak'
                        ?10
                        :0
                    );
            }

            /* ---------- bullets ---------- */

            let destroyed=false;

            for(
                let b=bullets.length-1;
                b>=0;
                b--
            ){

                const bullet=bullets[b];

                const bb={
                    x:bullet.x,
                    y:bullet.y,
                    w:11,
                    h:3
                };

                if(
                    o.type!=='shield' &&
                    o.type!=='ak' &&
                    hit(bb,o)
                ){

                    boom(
                        o.x+o.w/2,
                        o.y,
                        '#ffe17a'
                    );

                    bullets.splice(b,1);

                    obstacles.splice(i,1);

                    destroyed=true;

                    break;
                }
            }

            if(destroyed)
                continue;

            /* ---------- player ---------- */

            if(hit(pBox,o)){

                /* shield pickup */

                if(o.type === 'shield'){

                    shieldT=10;

                    boom(
                        o.x,
                        o.y,
                        '#37baff'
                    );

                    obstacles.splice(i,1);

                    continue;
                }

                /* AK pickup */

                if(o.type === 'ak'){

                    gunT=12;
                    fireAcc=0;

                    boom(
                        o.x,
                        o.y,
                        '#9dff6d'
                    );

                    obstacles.splice(i,1);

                    continue;
                }

                /* invulnerability */

                if(shieldT > 0){

                    boom(
                        o.x+o.w/2,
                        o.y,
                        '#8ddcff'
                    );

                    obstacles.splice(i,1);

                    continue;
                }

                gameOver(o.type);

                continue;
            }

            if(o.x+o.w < -60){

                obstacles.splice(i,1);
            }
        }

        /* ---------- bullets ---------- */

        for(
            let i=bullets.length-1;
            i>=0;
            i--
        ){

            const b=bullets[i];

            b.x += b.vx*dt;
            b.y += b.vy*dt;

            b.life -= dt;

            if(
                b.life <= 0 ||
                b.x > W+30
            ){

                bullets.splice(i,1);
            }
        }

    }else{

        player.y =
            state.groundY-player.h;

        updateBuff();
    }

    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.life -= dt;

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vy += 420*dt;

        if(p.life <= 0)
            particles.splice(i,1);
    }

    /* =====================================================
       DRAW
       ===================================================== */

    drawBackdrop();

    for(const o of obstacles){

        if(o.type==='poop')
            drawPoop(o);

        else if(o.type==='dick')
            drawDick(o);

        else if(o.type==='shield')
            drawShieldIcon(o);

        else if(o.type==='ak')
            drawAkIcon(o);
    }

    for(const b of bullets)
        drawBullet(b);

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(0,p.life*2);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );
    }

    ctx.globalAlpha=1;

    /* =====================================================
       GUN
       ===================================================== */

    if(
        gunT > 0 &&
        state.running
    ){

        drawGun();
    }

    /* =====================================================
       DOM PLAYER
       ===================================================== */

    const doll =
        heroEl.querySelector('.doll');

    doll.classList.toggle(
        'run',
        state.running &&
        !state.over &&
        player.onGround
    );

    heroEl.style.left =
        player.x+'px';

    heroEl.style.top =
        player.y+'px';

    /*
        Щит точно следует за персонажем.
    */

    shieldAura.style.left =
        ((player.w-112)/2)+'px';

    shieldAura.style.top =
        '-10px';

    requestAnimationFrame(loop);
}

applySkin();

requestAnimationFrame(loop);

})();
</script>

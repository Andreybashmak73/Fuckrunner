<style>

<script>
(()=>{

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if(tg){

    tg.ready();
    tg.expand();

    try{

        tg.setHeaderColor('#2a1630');
        tg.setBackgroundColor('#1a1020');

    }catch(e){}

}


/* =========================================================
   DOM
   ========================================================= */

const canvas =
    document.getElementById('c');

const ctx =
    canvas.getContext('2d');

const overlay =
    document.getElementById('overlay');

const titleScr =
    document.getElementById('screen-title');

const pickScr =
    document.getElementById('screen-pick');

const startBtn =
    document.getElementById('start');

const scoreEl =
    document.getElementById('score');

const bestEl =
    document.getElementById('best');

const buffEl =
    document.getElementById('buff');

const cityTag =
    document.getElementById('cityTag');

const heroEl =
    document.getElementById('hero');

const debugPanel =
    document.getElementById('debugPanel');


/* =========================================================
   CANVAS SIZE
   ========================================================= */

let W=0;
let H=0;
let dpr=1;

function resize(){

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width =
        Math.floor(W*dpr);

    canvas.height =
        Math.floor(H*dpr);

    canvas.style.width =
        W+'px';

    canvas.style.height =
        H+'px';

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;
}

window.addEventListener(
    'resize',
    resize
);

resize();


/* =========================================================
   CITIES
   ========================================================= */

const CITIES=[
    {
        name:'ЕКАТЕРИНБУРГ',
        src:'../bg_far.jpg'
    },
    {
        name:'ТОЛЬЯТТИ',
        src:'../bg_tlt.jpg'
    },
    {
        name:'УЛЬЯНОВСК',
        src:'../bg_uln.jpg'
    },
    {
        name:'КАЗАНЬ',
        src:'../bg_kzn.jpg'
    },
    {
        name:'ЙОШКАР-ОЛА',
        src:'../bg_yosh.jpg'
    },
    {
        name:'САРАТОВ',
        src:'../bg_sar.jpg'
    },
    {
        name:'САМАРА',
        src:'../bg_sam.jpg'
    }
];

const cityImgs =
    CITIES.map(city=>{

        const img =
            new Image();

        img.src=city.src;

        return img;

    });


/* =========================================================
   FIGHTERS
   ========================================================= */

const FIGHTERS=[
    {
        id:'vega',
        name:'Вегамэн',
        tag:'ВЕГА'
    },
    {
        id:'bumble',
        name:'Бамбл Бизи',
        tag:'BEE'
    },
    {
        id:'labuba',
        name:'Лабуба',
        tag:'ЛАБ'
    },
    {
        id:'girl',
        name:'Вагина реалистик',
        tag:''
    }
];

const grid =
    document.getElementById('grid');


FIGHTERS.forEach(f=>{

    const button =
        document.createElement('button');

    button.className='card';

    button.dataset.id=f.id;

    button.innerHTML=`

        <div class="nm">
            ${f.name}
        </div>

        <div class="stage">

            <div class="doll skin-${f.id}">

                <div class="hair"></div>

                <div class="cap"></div>

                <div class="tag">
                    ${f.tag}
                </div>

                <div class="head"></div>

                <div class="eye l"></div>
                <div class="eye r"></div>

                <div class="arm l"></div>
                <div class="arm r"></div>

                <div class="shirt"></div>

                <div class="collar"></div>

                <div class="chain"></div>

                <div class="leg l"></div>
                <div class="leg r"></div>

            </div>

        </div>
    `;

    grid.appendChild(button);

});


/* =========================================================
   GAME STATE
   ========================================================= */

const state={

    running:false,

    over:false,

    t:0,

    speed:280,

    dist:0,

    gravity:2400,

    groundY:0,

    city:-1

};


/* =========================================================
   PLAYER
   ========================================================= */

/*
    ВАЖНО:

    #hero = 54x96

    Поэтому игровой объект тоже 54x96.

    RED BOX будет строиться именно
    из этих координат.
*/

const player={

    x:90,

    y:0,

    vy:0,

    w:54,

    h:96,

    onGround:true,

    jumpsUsed:0

};


/* =========================================================
   OBJECTS
   ========================================================= */

const obstacles=[];
const bits=[];
const bullets=[];

let spawnTimer=.7;

let shieldT=0;
let gunT=0;

let fireAcc=0;

let powerTimer=45;


/* =========================================================
   SKIN
   ========================================================= */

let skin='vega';

function applySkin(){

    heroEl.className=
        'skin-'+skin;

    const doll =
        heroEl.querySelector('.doll');

    doll.className =
        'doll skin-'+skin;

    const tag =
        heroEl.querySelector('.tag');

    tag.textContent =
        skin==='vega'
        ?'ВЕГА'
        :skin==='bumble'
        ?'BEE'
        :skin==='labuba'
        ?'ЛАБ'
        :'';

    player.w =
        skin==='labuba'
        ?72
        :54;

}


/* =========================================================
   MENU
   ========================================================= */

document
.getElementById('pickBtn')
.onclick=()=>{

    titleScr.classList.add('hide');

    pickScr.classList.add('show');

};


document
.querySelectorAll('.card')
.forEach(card=>{

    card.onclick=()=>{

        document
        .querySelectorAll('.card')
        .forEach(c=>{

            c.classList.remove('sel');

            const doll =
                c.querySelector('.doll');

            if(doll){

                doll.classList.remove(
                    'run'
                );

            }

        });

        card.classList.add('sel');

        card
        .querySelector('.doll')
        .classList.add('run');

        skin =
            card.dataset.id;

        startBtn.disabled=false;

        applySkin();

    };

});


/* =========================================================
   BEST SCORE
   ========================================================= */

const BEST_KEY =
    'fuckrunner_ekb_best';

let best =
    parseInt(
        localStorage.getItem(
            BEST_KEY
        ) || '0',
        10
    );

function renderBest(){

    bestEl.textContent =
        'лучший счет '+best;

}

renderBest();


/* =========================================================
   CITY
   ========================================================= */

function toastCity(i){

    if(i===state.city)return;

    state.city=i;

    cityTag.textContent =
        CITIES[i].name;

    cityTag.style.opacity='1';

    clearTimeout(
        toastCity._t
    );

    toastCity._t =
        setTimeout(
            ()=>{
                cityTag.style.opacity='0';
            },
            1600
        );

}


/* =========================================================
   RESET
   ========================================================= */

function reset(){

    state.running=true;
    state.over=false;

    state.t=0;
    state.speed=280;
    state.dist=0;
    state.city=-1;

    obstacles.length=0;
    bits.length=0;
    bullets.length=0;

    spawnTimer=.7;

    player.vy=0;
    player.onGround=true;
    player.jumpsUsed=0;

    shieldT=0;
    gunT=0;

    fireAcc=0;
    powerTimer=45;

    applySkin();

    overlay.style.display='none';

    toastCity(0);

}


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(
        !state.running ||
        state.over ||
        player.jumpsUsed>=2
    ){
        return;
    }

    player.vy =
        player.jumpsUsed===0
        ?-820
        :-1160;

    player.onGround=false;

    player.jumpsUsed++;

}


/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener(
    'keydown',
    e=>{

        if(
            e.code==='Space' ||
            e.code==='ArrowUp'
        ){

            e.preventDefault();

            if(state.running){
                jump();
            }

        }

    }
);


window.addEventListener(
    'pointerdown',
    e=>{

        if(
            e.target.closest('#overlay')
        ){
            return;
        }

        if(state.running){
            jump();
        }

    }
);


/* =========================================================
   MUSIC
   ========================================================= */

const TRACKS=[
    'ushet.mp3',
    '../bogi.mp3',
    '../gorod.mp3',
    '../Chto.mp3',
    '../Police.mp3',
    '../Big.mp3'
];

let lastTrack=-1;
let musicOn=false;
let skipGuard=0;

const music =
    new Audio();

music.volume=.55;

function playRandom(){

    let i =
        Math.floor(
            Math.random()*
            TRACKS.length
        );

    if(
        TRACKS.length>1 &&
        i===lastTrack
    ){

        i=(i+1)%
            TRACKS.length;

    }

    lastTrack=i;

    music.src=
        TRACKS[i];

    music
        .play()
        .then(
            ()=>{
                skipGuard=0;
            }
        )
        .catch(()=>{});

}

music.addEventListener(
    'ended',
    playRandom
);

music.addEventListener(
    'error',
    ()=>{

        if(skipGuard++>8){
            return;
        }

        playRandom();

    }
);


/* =========================================================
   START
   ========================================================= */

startBtn.onclick=e=>{

    e.stopPropagation();

    reset();

    if(!musicOn){

        musicOn=true;

        playRandom();

    }

};


/* =========================================================
   SPAWN
   ========================================================= */

function spawn(){

    if(Math.random()<.55){

        obstacles.push({

            type:'poop',

            x:W+40,

            y:0,

            w:46,

            h:38

        });

    }else{

        obstacles.push({

            type:'dick',

            x:W+40,

            y:0,

            flyY:
                70+
                Math.random()*90,

            w:52,

            h:22,

            wob:
                Math.random()*
                6.28

        });

    }

}


function spawnPower(){

    if(Math.random()<.5){

        obstacles.push({

            type:'shield',

            x:W+40,

            y:0,

            w:36,

            h:36

        });

    }else{

        obstacles.push({

            type:'ak',

            x:W+40,

            y:0,

            w:40,

            h:22

        });

    }

}


/* =========================================================
   HIT TEST
   ========================================================= */

function hit(a,b){

    return (

        a.x <
        b.x+b.w &&

        a.x+a.w >
        b.x &&

        a.y <
        b.y+b.h &&

        a.y+a.h >
        b.y

    );

}


/* =========================================================
   HITBOX FUNCTIONS
   ========================================================= */

/*
    RED:
    Игровой hitbox игрока.

    Сейчас специально совпадает
    с player.w / player.h.
*/

function getPlayerHitbox(){

    return {

        x:player.x,

        y:player.y,

        w:player.w,

        h:player.h

    };

}


/*
    GREEN:
    Игровой hitbox препятствия.
*/

function getObstacleHitbox(o){

    return {

        x:o.x,

        y:o.y,

        w:o.w,

        h:o.h

    };

}


/*
    BLUE:
    Реальные координаты DOM #hero.

    getBoundingClientRect()
    показывает фактическое положение
    элемента на экране.

    Это очень важно для диагностики.
*/

function getHeroDomBox(){

    const r =
        heroEl.getBoundingClientRect();

    return {

        x:r.left,

        y:r.top,

        w:r.width,

        h:r.height

    };

}


/* =========================================================
   DEBUG DRAW
   ========================================================= */

function drawDebug(){

    /*
        RED
        ================================
        Игровой hitbox.
    */

    const red =
        getPlayerHitbox();

    ctx.save();

    ctx.strokeStyle='#ff0000';

    ctx.lineWidth=3;

    ctx.strokeRect(

        red.x,
        red.y,
        red.w,
        red.h

    );


    /*
        BLUE
        ================================
        Фактический DOM #hero.
    */

    const blue =
        getHeroDomBox();

    ctx.strokeStyle='#00aaff';

    ctx.lineWidth=3;

    ctx.strokeRect(

        blue.x,
        blue.y,
        blue.w,
        blue.h

    );


    /*
        GREEN
        ================================
        Hitbox препятствий.
    */

    for(
        const obstacle
        of obstacles
    ){

        const green =
            getObstacleHitbox(
                obstacle
            );

        ctx.strokeStyle=
            '#00ff00';

        ctx.lineWidth=3;

        ctx.strokeRect(

            green.x,
            green.y,
            green.w,
            green.h

        );

    }


    /*
        Центр RED
    */

    ctx.fillStyle='#ff0000';

    ctx.fillRect(

        red.x+
        red.w/2-
        3,

        red.y+
        red.h/2-
        3,

        6,
        6

    );


    /*
        Центр BLUE
    */

    ctx.fillStyle='#00aaff';

    ctx.fillRect(

        blue.x+
        blue.w/2-
        3,

        blue.y+
        blue.h/2-
        3,

        6,
        6

    );


    ctx.restore();

}


/* =========================================================
   DEBUG PANEL
   ========================================================= */

function updateDebug(){

    const red =
        getPlayerHitbox();

    const blue =
        getHeroDomBox();

    let nearest=null;
    let nearestDistance=Infinity;

    for(
        const o
        of obstacles
    ){

        const distance =
            Math.abs(
                o.x -
                player.x
            );

        if(
            distance<
            nearestDistance
        ){

            nearest=o;

            nearestDistance=
                distance;

        }

    }


    let text='';

    text +=
        'PLAYER\n';

    text +=
        'RED  x: '+
        red.x.toFixed(1)+
        ' y: '+
        red.y.toFixed(1)+
        ' w: '+
        red.w.toFixed(1)+
        ' h: '+
        red.h.toFixed(1)+
        '\n';

    text +=
        'BLUE x: '+
        blue.x.toFixed(1)+
        ' y: '+
        blue.y.toFixed(1)+
        ' w: '+
        blue.w.toFixed(1)+
        ' h: '+
        blue.h.toFixed(1)+
        '\n';

    text +=
        'RED-BLUE DX: '+
        (
            red.x-blue.x
        ).toFixed(1)+
        ' px\n';

    text +=
        'RED-BLUE DY: '+
        (
            red.y-blue.y
        ).toFixed(1)+
        ' px\n';

    text +=
        '\nOBSTACLES: '+
        obstacles.length+
        '\n';

    if(nearest){

        const green =
            getObstacleHitbox(
                nearest
            );

        text +=
            '\nNEAREST GREEN\n';

        text +=
            'type: '+
            nearest.type+
            '\n';

        text +=
            'x: '+
            green.x.toFixed(1)+
            '\n';

        text +=
            'y: '+
            green.y.toFixed(1)+
            '\n';

        text +=
            'w: '+
            green.w+
            '\n';

        text +=
            'h: '+
            green.h+
            '\n';

    }

    debugPanel.innerHTML=
        '<div class="debug-title">HITBOX DEBUG</div>'+
        '<div class="debug-red">■ RED = PLAYER HITBOX</div>'+
        '<div class="debug-blue">■ BLUE = HERO DOM BOX</div>'+
        '<div class="debug-green">■ GREEN = OBSTACLE HITBOX</div>'+
        '<br>'+
        text
        .replace(
            /\n/g,
            '<br>'
        );

}


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(kind){

    state.over=true;

    state.running=false;

    const score =
        Math.floor(
            state.dist
        );

    if(score>best){

        best=score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        renderBest();

    }

    titleScr.classList.remove(
        'hide'
    );

    pickScr.classList.remove(
        'show'
    );

    overlay
    .querySelector(
        '#screen-title h1'
    )
    .textContent =
        kind==='dick'
        ?'Есть пробитие'
        :'Это конец, ты в говне';

    overlay
    .querySelector(
        '#screen-title p'
    )
    .textContent =
        'Обычная жизнь оборвалась на '+
        score+
        ' м.';

    overlay.style.display='flex';

}


/* =========================================================
   PARTICLES
   ========================================================= */

function boom(x,y,col){

    for(
        let i=0;
        i<9;
        i++
    ){

        bits.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*
                240,

            vy:
                -70-
                Math.random()*160,

            life:.4,

            col:col

        });

    }

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(

            W*.92,

            h*
            (
                img.naturalWidth/
                img.naturalHeight
            )

        );

    }

    return W*.92;

}


function drawCities(gy){

    const h=
        gy+6;

    const widths=
        cityImgs.map(
            im=>
                cityWidth(
                    im,
                    h
                )
        );

    const total=
        widths.reduce(
            (a,b)=>a+b,
            0
        )||W;

    const scroll=
        (
            state.dist*2.2
        )%total;

    let x=-scroll;

    let seen=
        state.city;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const i=
            n%CITIES.length;

        const w=
            widths[i];

        const img=
            cityImgs[i];

        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(

                img,

                Math.floor(x),

                0,

                Math.ceil(w)+1,

                Math.ceil(h)

            );

        }

        if(
            x<=W*.35 &&
            x+w>W*.35
        ){

            seen=i;

        }

        x+=w;

        if(x>W+4){
            break;
        }

    }

    toastCity(seen);

}


function drawBackdrop(){

    const gy=
        state.groundY;

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            gy
        );

    gradient.addColorStop(
        0,
        '#3a2460'
    );

    gradient.addColorStop(
        1,
        '#c45a3a'
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        gy
    );

    drawCities(gy);

    const roadH=
        Math.floor(
            (H-gy)*.46
        );

    ctx.fillStyle=
        '#5b5b63';

    ctx.fillRect(
        0,
        gy,
        W,
        roadH
    );

    ctx.fillStyle=
        '#4a4a52';

    ctx.fillRect(
        0,
        gy,
        W,
        8
    );

    const dash=34;

    const shift=
        (
            state.dist/.12
        )%
        (dash*2);

    ctx.fillStyle=
        '#e6d36a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy+roadH*.45,
            20,
            4
        );

    }

    ctx.fillStyle=
        '#7a5a3a';

    ctx.fillRect(
        0,
        gy+roadH,
        W,
        H-gy-roadH
    );

    ctx.fillStyle=
        '#6a4a2e';

    const tile=26;

    const sh=
        (
            state.dist/.12
        )%tile;

    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(
            x-sh,
            gy+roadH+10,
            12,
            4
        );

    }

}


/* =========================================================
   OBSTACLE DRAW
   ========================================================= */

function drawPoop(o){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.fillStyle='#5a2c10';

    ctx.beginPath();

    ctx.ellipse(
        0,
        -10,
        20,
        12,
        0,
        0,
        7
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        -4,
        -22,
        14,
        10,
        -.2,
        0,
        7
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        2,
        -32,
        9,
        8,
        .2,
        0,
        7
    );

    ctx.fill();

    ctx.fillStyle='#fff';

    ctx.beginPath();

    ctx.arc(
        -6,
        -22,
        3,
        0,
        7
    );

    ctx.arc(
        4,
        -20,
        2.4,
        0,
        7
    );

    ctx.fill();

    ctx.fillStyle='#222';

    ctx.beginPath();

    ctx.arc(
        -6,
        -22,
        1.4,
        0,
        7
    );

    ctx.arc(
        4,
        -20,
        1.2,
        0,
        7
    );

    ctx.fill();

    ctx.restore();

}


function drawDick(o,t){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(
            t*6+
            o.wob
        )*6;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        -.15+
        Math.sin(
            t*4+
            o.wob
        )*.12
    );

    ctx.fillStyle='#f0b48a';

    ctx.beginPath();

    ctx.roundRect(
        -22,
        -8,
        36,
        16,
        8
    );

    ctx.fill();

    ctx.fillStyle='#e08a8a';

    ctx.beginPath();

    ctx.ellipse(
        16,
        0,
        11,
        10,
        0,
        0,
        7
    );

    ctx.fill();

    ctx.fillStyle='#e0a07a';

    ctx.beginPath();

    ctx.ellipse(
        -20,
        6,
        8,
        7,
        0,
        0,
        7
    );

    ctx.ellipse(
        -12,
        8,
        8,
        7,
        0,
        0,
        7
    );

    ctx.fill();

    ctx.restore();

}


function drawShieldIcon(o){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(
            state.t*5
        )*4;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.fillStyle='#1c6cff';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        16,
        0,
        7
    );

    ctx.fill();

    ctx.strokeStyle='#bfe6ff';

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle='#fff';

    ctx.font=
        'bold 13px sans-serif';

    ctx.textAlign='center';

    ctx.textBaseline='middle';

    ctx.fillText(
        'S',
        0,
        1
    );

    ctx.restore();

}


function drawAkIcon(o){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(
            state.t*5
        )*4;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(-.25);

    ctx.fillStyle='#3a3a32';

    ctx.fillRect(
        -18,
        -4,
        36,
        8
    );

    ctx.fillStyle='#6b4a28';

    ctx.fillRect(
        -6,
        2,
        8,
        10
    );

    ctx.fillStyle='#c9a227';

    ctx.fillRect(
        12,
        -6,
        8,
        4
    );

    ctx.restore();

}


/* =========================================================
   GUN
   ========================================================= */

function drawGun(){

    const px=
        player.x+
        player.w*.55;

    const py=
        player.y+44;

    ctx.save();

    ctx.translate(
        px,
        py
    );

    ctx.rotate(-.12);

    ctx.fillStyle='#2c2c26';

    ctx.fillRect(
        0,
        -4,
        42,
        8
    );

    ctx.fillStyle='#5a3a20';

    ctx.fillRect(
        6,
        2,
        8,
        10
    );

    ctx.fillStyle='#111';

    ctx.fillRect(
        34,
        -6,
        10,
        4
    );

    ctx.restore();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

let last=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );

    last=now;

    state.groundY=
        Math.floor(
            H*.70
        );


    /* =====================================================
       PLAYER POSITION
       ===================================================== */

    if(player.onGround){

        player.y=
            state.groundY-
            player.h;

    }


    /* =====================================================
       GAME
       ===================================================== */

    if(
        state.running &&
        !state.over
    ){

        state.t+=dt;

        state.speed+=
            dt*8;

        state.dist+=
            state.speed*
            dt*
            .12;

        scoreEl.textContent=
            Math.floor(
                state.dist
            )+
            ' м';


        shieldT=
            Math.max(
                0,
                shieldT-dt
            );

        gunT=
            Math.max(
                0,
                gunT-dt
            );


        const parts=[];

        if(shieldT>0){

            parts.push(
                'ЩИТ '+
                Math.ceil(
                    shieldT
                )+
                'с'
            );

        }

        if(gunT>0){

            parts.push(
                'АК '+
                Math.ceil(
                    gunT
                )+
                'с'
            );

        }

        buffEl.textContent=
            parts.join(' · ');


        /* ================================================
           GRAVITY
           ================================================ */

        player.vy+=
            state.gravity*
            (
                player.vy>0
                ?2
                :1
            )*
            dt;

        player.y+=
            player.vy*
            dt;


        if(
            player.y>=
            state.groundY-
            player.h
        ){

            player.y=
                state.groundY-
                player.h;

            player.vy=0;

            player.onGround=true;

            player.jumpsUsed=0;

        }


        /* ================================================
           GUN
           ================================================ */

        if(gunT>0){

            fireAcc+=dt;

            if(fireAcc>.09){

                fireAcc=0;

                const baseY=
                    player.y+46;

                for(
                    let k=-2;
                    k<=2;
                    k++
                ){

                    const ang=
                        k*.16;

                    bullets.push({

                        x:
                            player.x+
                            player.w+
                            8,

                        y:baseY,

                        vx:
                            620*
                            Math.cos(
                                ang
                            ),

                        vy:
                            620*
                            Math.sin(
                                ang
                            ),

                        life:.55

                    });

                }

            }

        }


        /* ================================================
           SPAWN
           ================================================ */

        spawnTimer-=dt;

        if(spawnTimer<=0){

            spawn();

            spawnTimer=
                .8+
                Math.random()*.65-
                Math.min(
                    .35,
                    state.speed/1600
                );

        }


        powerTimer-=dt;

        if(powerTimer<=0){

            spawnPower();

            powerTimer=45;

        }


        /* ================================================
           COLLISION
           ================================================ */

        const pBox=
            getPlayerHitbox();


        for(
            let i=
                obstacles.length-1;
            i>=0;
            i--
        ){

            const o=
                obstacles[i];

            o.x-=
                state.speed*
                dt;


            if(
                o.type==='dick'
            ){

                o.y=
                    state.groundY-
                    o.flyY-
                    o.h;

            }else{

                o.y=
                    state.groundY-
                    o.h-
                    (
                        o.type==='shield' ||
                        o.type==='ak'
                        ?10
                        :0
                    );

            }


            const oBox=
                getObstacleHitbox(o);


            /* ============================================
               BULLETS
               ============================================ */

            let shot=false;

            for(
                let b=
                    bullets.length-1;
                b>=0;
                b--
            ){

                const bullet=
                    bullets[b];

                const bulletBox={

                    x:bullet.x,

                    y:bullet.y,

                    w:8,

                    h:4

                };


                if(
                    o.type!=='shield' &&
                    o.type!=='ak' &&
                    hit(
                        bulletBox,
                        oBox
                    )
                ){

                    boom(
                        o.x+
                        o.w/2,

                        o.y,

                        '#ffe08a'
                    );

                    bullets.splice(
                        b,
                        1
                    );

                    shot=true;

                    break;

                }

            }


            if(shot){

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            /* ============================================
               PLAYER VS OBSTACLE
               ============================================ */

            if(
                hit(
                    pBox,
                    oBox
                )
            ){

                if(
                    o.type==='shield'
                ){

                    shieldT=15;

                    boom(
                        o.x,
                        o.y,
                        '#4df'
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                if(
                    o.type==='ak'
                ){

                    gunT=15;

                    boom(
                        o.x,
                        o.y,
                        '#9f6'
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                if(shieldT>0){

                    boom(
                        o.x+
                        o.w/2,

                        o.y,

                        '#fff'
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                gameOver(
                    o.type
                );

            }


            if(
                o.x+
                o.w<
                -40
            ){

                obstacles.splice(
                    i,
                    1
                );

            }

        }


        /* ================================================
           BULLETS UPDATE
           ================================================ */

        for(
            let i=
                bullets.length-1;
            i>=0;
            i--
        ){

            const b=
                bullets[i];

            b.x+=
                b.vx*
                dt;

            b.y+=
                b.vy*
                dt;

            b.life-=dt;


            if(
                b.life<=0 ||
                b.x>W+20
            ){

                bullets.splice(
                    i,
                    1
                );

            }

        }

    }else{

        player.y=
            state.groundY-
            player.h;

    }


    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        let i=
            bits.length-1;
        i>=0;
        i--
    ){

        const p=
            bits[i];

        p.life-=dt;

        p.x+=
            p.vx*
            dt;

        p.y+=
            p.vy*
            dt;

        p.vy+=
            400*
            dt;


        if(p.life<=0){

            bits.splice(
                i,
                1
            );

        }

    }


    /* =====================================================
       DRAW BACKGROUND
       ===================================================== */

    drawBackdrop();


    /* =====================================================
       DRAW OBSTACLES
       ===================================================== */

    for(
        const o
        of obstacles
    ){

        if(
            o.type==='poop'
        ){

            drawPoop(o);

        }else if(
            o.type==='dick'
        ){

            drawDick(
                o,
                state.t
            );

        }else if(
            o.type==='shield'
        ){

            drawShieldIcon(o);

        }else{

            drawAkIcon(o);

        }

    }


    /* =====================================================
       DRAW BULLETS
       ===================================================== */

    for(
        const b
        of bullets
    ){

        ctx.fillStyle=
            '#ffe08a';

        ctx.fillRect(
            b.x,
            b.y,
            10,
            3
        );

    }


    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        const p
        of bits
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life*2
            );

        ctx.fillStyle=
            p.col;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

        ctx.globalAlpha=1;

    }


    /* =====================================================
       GUN
       ===================================================== */

    if(
        gunT>0 &&
        state.running
    ){

        drawGun();

    }


    /* =====================================================
       DEBUG
       ===================================================== */

    /*
        ВАЖНО:
        debug рисуется ПОСЛЕ всех объектов,
        поэтому рамки всегда видны.
    */

    drawDebug();

    updateDebug();


    /* =====================================================
       DOM HERO
       ===================================================== */

    const heroDoll =
        heroEl.querySelector(
            '.doll'
        );


    if(heroDoll){

        heroDoll.classList.toggle(
            'run',
            state.running &&
            !state.over &&
            player.onGround
        );

    }


    heroEl.style.left=
        player.x+'px';

    heroEl.style.top=
        player.y+'px';


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);

})();
</script>

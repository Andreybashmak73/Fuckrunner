<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>FUCKRUNNER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1020; font-family: ui-monospace, Menlo, Consolas, monospace; user-select: none; }
    #wrap { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #3a2460; image-rendering: pixelated; }

    /* HUD */
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; color: #fff; font-weight: 800; font-size: 15px; text-shadow: 0 2px 0 #000; pointer-events: none; z-index: 4; }
    #buff { color: #9fef6a; font-size: 12px; margin-top: 4px; }
    
    /* City tag */
    #cityTag { position: absolute; top: 42px; left: 50%; transform: translateX(-50%); color: #ffe08a; font-weight: 800; font-size: 13px; text-shadow: 0 2px 0 #000; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .3s; }

    /* Overlay */
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,4,14,.86); color: #fff; text-align: center; padding: 16px; z-index: 6; overflow: auto; }
    #overlay h1 { font-size: 26px; margin-bottom: 8px; color: #ff4d6d; text-shadow: 3px 3px 0 #3a0010; }
    #overlay p { opacity: .92; margin: 6px 0 16px; max-width: 340px; line-height: 1.35; }
    button.main { appearance: none; border: 3px solid #fff; background: #ff4d6d; color: #fff; font-weight: 800; font-size: 17px; font-family: inherit; padding: 12px 24px; cursor: pointer; }
    button.main:disabled { opacity: .4; }
    .hint { font-size: 12px; opacity: .7; margin-top: 12px; }

    /* Pick screen */
    #screen-pick { display: none; width: min(560px, 96vw); }
    #screen-pick.show { display: block; }
    #screen-title.hide { display: none; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 16px; }
    .card { background: #241428; border: 3px solid #5a3a50; color: #fff; cursor: pointer; padding: 8px 4px 6px; font-family: inherit; min-height: 150px; }
    .card .nm { font-size: 12px; font-weight: 800; margin-bottom: 4px; color: #ffe08a; }
    .card.sel { border-color: #ff4d6d; box-shadow: 0 0 0 3px rgba(255,77,109,.35); }

    /* Doll styles (skins) */
    .stage { position: relative; height: 110px; overflow: hidden; }
    .doll { position: absolute; left: 50%; bottom: 4px; width: 54px; height: 96px; margin-left: -27px; pointer-events: none; }
    .doll.skin-labuba { width: 72px; margin-left: -36px; }
    
    .doll .cap { position: absolute; left: 8px; top: 0; width: 38px; height: 16px; background: #111; border-radius: 8px 8px 2px 2px; z-index: 3; }
    .doll .cap:after { content: ''; position: absolute; right: -8px; bottom: 2px; width: 18px; height: 6px; background: #111; border-radius: 0 6px 6px 0; }
    .doll .tag { position: absolute; left: 8px; top: 3px; width: 38px; color: #eee; font: 800 7px/1 sans-serif; text-align: center; z-index: 4; }
    .doll .head { position: absolute; left: 14px; top: 10px; width: 26px; height: 26px; background: #f0b48a; border-radius: 50%; }
    .doll .eye { position: absolute; top: 18px; width: 4px; height: 4px; background: #222; border-radius: 50%; }
    .doll .eye.l { left: 20px; } .doll .eye.r { left: 30px; }
    .doll .shirt { position: absolute; left: 6px; top: 32px; width: 42px; height: 38px; background: #2ea44f; border-radius: 8px 8px 4px 4px; }
    .doll .collar { position: absolute; left: 6px; top: 32px; width: 42px; height: 8px; background: #217a3a; border-radius: 8px 8px 0 0; }
    .doll .hair, .doll .chain { display: none; }
    .doll .arm { position: absolute; top: 36px; width: 10px; height: 24px; background: #e0a07a; border-radius: 5px; transform-origin: 50% 0; }
    .doll .arm.l { left: 0; } .doll .arm.r { right: 0; }
    .doll .leg { position: absolute; bottom: 0; width: 10px; height: 26px; background: #3a2a22; border-radius: 5px; transform-origin: 50% 0; }
    .doll .leg.l { left: 14px; } .doll .leg.r { right: 14px; }
    
    /* Animations */
    .doll.run .arm, .doll.run .leg { animation: arms .32s linear infinite; }
    .doll.run .leg { animation-name: legs; }
    .doll.run .arm.l, .doll.run .leg.r { animation-direction: reverse; }

    @keyframes legs { 0% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } 100% { transform: rotate(28deg); } }
    @keyframes arms { 0% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } 100% { transform: rotate(-24deg); } }

    /* Hero overlay (sync with canvas) */
    #hero { position: absolute; left: 90px; width: 54px; height: 96px; pointer-events: none; z-index: 3; }
    #hero.shielded { filter: drop-shadow(0 0 8px #4df); }
    #hero.armed .arm.r { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <!-- Дубликат персонажа для CSS-анимаций (бежит поверх canvas) -->
    <div id="hero" class="doll idle skin-vega">
      <div class="hair"></div><div class="cap"></div><div class="tag">ВЕГА</div>
      <div class="head"></div><div class="eye l"></div><div class="eye r"></div>
      <div class="arm l"></div><div class="arm r"></div><div class="shirt"></div>
      <div class="collar"></div><div class="chain"></div><div class="leg l"></div><div class="leg r"></div>
    </div>

    <div id="hud">
      <div><div id="score">0 м</div><div id="buff"></div></div>
      <div id="best">лучший счет 0</div>
    </div>
    <div id="cityTag"></div>

    <div id="overlay">
      <div id="screen-title">
        <h1>FUCKRUNNER</h1>
        <p>Обычный человек живёт свою обычную жизнь.</p>
        <button class="main" id="pickBtn">ВЫБЕРИ БОЙЦА</button>
        <div class="hint">тап — прыжок, второй тап в воздухе — выше</div>
      </div>
      
      <div id="screen-pick">
        <h1>ВЫБЕРИ БОЙЦА</h1>
        <div class="grid" id="grid"></div>
        <button class="main" id="start" disabled>ПОГНАЛИ</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      // --- Telegram Integration ---
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        try {
          tg.setHeaderColor('#2a1630');
          tg.setBackgroundColor('#1a1020');
        } catch (e) {}
      }

      // --- Config ---
      const CONFIG = {
        game: {
          acceleration: 6,
          maxSpeed: 450,
          powerSpawnInterval: 5 // секунд между появлением щита/АК
        }
      };

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      
      const overlay = document.getElementById('overlay');
      const titleScr = document.getElementById('screen-title');
      const pickScr = document.getElementById('screen-pick');
      
      const startBtn = document.getElementById('start');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const buffEl = document.getElementById('buff');
      const cityTag = document.getElementById('cityTag');
      const heroEl = document.getElementById('hero');

      // --- Data ---
      const CITIES = [
        { name: 'ЕКАТЕРИНБУРГ', src: '../bg_far.jpg' },
        { name: 'ТОЛЬЯТТИ', src: '../bg_tlt.jpg' },
        { name: 'УЛЬЯНОВСК', src: '../bg_uln.jpg' },
        { name: 'КАЗАНЬ', src: '../bg_kzn.jpg' },
        { name: 'ЙОШКАР-ОЛА', src: '../bg_yosh.jpg' },
        { name: 'САРАТОВ', src: '../bg_sar.jpg' },
        { name: 'САМАРА', src: '../bg_sam.jpg' }
      ];
      
      const FIGHTERS = [
        { id: 'vega', name: 'Вегамэн', tag: 'ВЕГА' },
        { id: 'bumble', name: 'Бамбл Бизи', tag: 'BEE' },
        { id: 'labuba', name: 'Лабуба', tag: 'ЛАБ' },
        { id: 'girl', name: 'Вагина реалистик', tag: '' }
      ];

      const grid = document.getElementById('grid');
      FIGHTERS.forEach(f => {
        const b = document.createElement('button');
        b.className = 'card';
        b.dataset.id = f.id;
        b.innerHTML = `
          <div class="nm">${f.name}</div>
          <div class="stage">
            <div class="doll skin-${f.id}">
              <div class="hair"></div><div class="cap"></div><div class="tag">${f.tag}</div>
              <div class="head"></div><div class="eye l"></div><div class="eye r"></div>
              <div class="arm l"></div><div class="arm r"></div><div class="shirt"></div>
              <div class="collar"></div><div class="chain"></div><div class="leg l"></div><div="leg r"></div>
            </div>
          </div>`;
        grid.appendChild(b);
      });

      let W = 0, H = 0;
      function resize() {
        W = innerWidth;
        H = innerHeight;
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
      }
      addEventListener('resize', resize);
      resize();

      const BEST_KEY = 'fuckrunner_ekb_best';
      let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
      function renderBest() { bestEl.textContent = 'лучший счет ' + best; }
      renderBest();

      // --- Controls ---
      document.getElementById('pickBtn').onclick = () => {
        titleScr.classList.add('hide');
        pickScr.classList.add('show');
      };

      document.querySelectorAll('.card').forEach(card => {
        card.onclick = () => {
          document.querySelectorAll('.card').forEach(c => {
            c.classList.remove('sel');
            const d = c.querySelector('.doll');
            if (d) d.classList.remove('run');
          });
          card.classList.add('sel');
          card.querySelector('.doll').classList.add('run');
          startBtn.disabled = false;
          applySkin(card.dataset.id);
        };
      });

      function applySkin(skinId) {
        heroEl.className = `doll idle skin-${skinId}`;
      }

      // --- Game State ---
      let gameRunning = false;
      let lastTime = 0;
      let speed = 400; // px/s
      let score = 0;

      const player = {
        w: 54, // ширина под спрайт
        h: 96, // высота под спрайт
        x: 90,
        y: 0, // будет установлено при старте
        vy: 0,
        onGround: true,
        jumpPower: -320,
        gravity: 800
      };

      const obstacles = [];
      const powers = []; // щит и АК-47
      const powerTypes = ['shield', 'ak47'];

      let nextPowerSpawn = 0; // время следующего спавна

      // --- Collision (строго по границам) ---
      function rectIntersect(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      // --- Spawn ---
      function spawnObstacle() {
        const w = 60 + Math.random() * 40;
        const h = 80 + Math.random() * 60;
        obstacles.push({
          x: W,
          y: H - h,
          w,
          h,
          speed: -speed
        });
      }

      function spawnPower() {
        const type = powerTypes[Math.floor(Math.random() * powerTypes.length)];

<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FUCKRUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#160d1d;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    user-select:none;
}

#wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* =========================================================
   HERO
   ========================================================= */

#hero{
    position:absolute;
    left:90px;
    top:0;
    width:72px;
    height:108px;
    pointer-events:none;
    z-index:5;
    transform-origin:50% 100%;
}

.doll{
    position:absolute;
    left:0;
    top:0;
    width:72px;
    height:108px;
    transform-origin:50% 100%;
}

/* ---------------------------------------------------------
   SHIELD
   --------------------------------------------------------- */

.force-field{
    position:absolute;
    left:-17px;
    top:-15px;
    width:106px;
    height:125px;
    border-radius:50%;
    border:3px solid rgba(70,190,255,.9);
    background:
        radial-gradient(
            ellipse at center,
            rgba(70,170,255,.12) 0%,
            rgba(50,130,255,.08) 45%,
            rgba(0,100,255,.03) 70%,
            transparent 72%
        );
    box-shadow:
        0 0 8px #39aaff,
        0 0 18px rgba(40,150,255,.8),
        inset 0 0 15px rgba(80,200,255,.4);
    opacity:0;
    transform:scale(.86);
}

#hero.shield-active .force-field{
    opacity:1;
    animation:shieldPulse .65s ease-in-out infinite alternate;
}

.force-field:before,
.force-field:after{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    border:1px dashed rgba(150,230,255,.7);
}

.force-field:after{
    inset:17px;
    border-color:rgba(50,160,255,.45);
    transform:rotate(35deg);
}

@keyframes shieldPulse{
    from{
        transform:scale(.92);
        filter:brightness(.9);
    }
    to{
        transform:scale(1.04);
        filter:brightness(1.35);
    }
}

/* ---------------------------------------------------------
   BODY
   --------------------------------------------------------- */

.doll .shadow{
    position:absolute;
    left:10px;
    bottom:0;
    width:50px;
    height:8px;
    background:rgba(0,0,0,.35);
    border-radius:50%;
    filter:blur(1px);
    transform-origin:center;
}

.doll .body{
    position:absolute;
    left:14px;
    top:37px;
    width:44px;
    height:43px;
    border-radius:10px 10px 7px 7px;
    background:
        linear-gradient(
            90deg,
            #1d7c39 0%,
            #32b957 45%,
            #239a48 100%
        );
    border:2px solid #155c2d;
    z-index:3;
}

.doll .shirt-highlight{
    position:absolute;
    left:20px;
    top:42px;
    width:5px;
    height:27px;
    background:rgba(255,255,255,.12);
    border-radius:3px;
    z-index:4;
}

/* ---------------------------------------------------------
   HEAD
   --------------------------------------------------------- */

.doll .neck{
    position:absolute;
    left:31px;
    top:31px;
    width:12px;
    height:11px;
    background:#d89570;
    z-index:2;
}

.doll .head{
    position:absolute;
    left:22px;
    top:10px;
    width:31px;
    height:29px;
    background:
        linear-gradient(
            135deg,
            #ffd0a7,
            #e9a57e
        );
    border:2px solid #b87555;
    border-radius:46% 46% 44% 44%;
    z-index:4;
}

.doll .ear{
    position:absolute;
    top:21px;
    width:7px;
    height:10px;
    background:#e3a078;
    border:2px solid #b87555;
    border-radius:50%;
    z-index:3;
}

.doll .ear.l{left:18px}
.doll .ear.r{left:50px}

.doll .eye{
    position:absolute;
    top:22px;
    width:5px;
    height:6px;
    background:#171318;
    border-radius:50%;
    z-index:7;
}

.doll .eye.l{left:29px}
.doll .eye.r{left:42px}

.doll .eye:after{
    content:"";
    position:absolute;
    left:1px;
    top:1px;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
}

.doll .nose{
    position:absolute;
    left:36px;
    top:27px;
    width:5px;
    height:4px;
    border-right:2px solid #b87555;
    border-bottom:2px solid #b87555;
    transform:rotate(-20deg);
    z-index:7;
}

.doll .mouth{
    position:absolute;
    left:32px;
    top:32px;
    width:13px;
    height:4px;
    border-bottom:2px solid #743b35;
    border-radius:50%;
    z-index:7;
}

/* ---------------------------------------------------------
   CAP
   --------------------------------------------------------- */

.doll .cap{
    position:absolute;
    left:18px;
    top:2px;
    width:42px;
    height:15px;
    background:#111;
    border-radius:12px 12px 4px 4px;
    z-index:8;
}

.doll .cap:after{
    content:"";
    position:absolute;
    left:-4px;
    bottom:-3px;
    width:51px;
    height:7px;
    background:#111;
    border-radius:5px;
}

.doll .tag{
    position:absolute;
    left:21px;
    top:5px;
    width:36px;
    color:#fff;
    font:900 7px/1 Arial,sans-serif;
    text-align:center;
    z-index:10;
}

/* ---------------------------------------------------------
   ARMS
   --------------------------------------------------------- */

.doll .arm{
    position:absolute;
    top:40px;
    width:12px;
    height:31px;
    background:#dfa079;
    border:2px solid #b87555;
    border-radius:7px;
    transform-origin:50% 5px;
    z-index:5;
}

.doll .arm.l{
    left:5px;
    transform:rotate(17deg);
}

.doll .arm.r{
    right:5px;
    transform:rotate(-17deg);
}

.doll .forearm{
    position:absolute;
    width:10px;
    height:25px;
    background:#e6aa83;
    border:2px solid #b87555;
    border-radius:7px;
    transform-origin:50% 4px;
    z-index:6;
}

.doll .forearm.l{
    left:1px;
    top:62px;
    transform:rotate(-20deg);
}

.doll .forearm.r{
    right:1px;
    top:62px;
    transform:rotate(20deg);
}

.doll .hand{
    position:absolute;
    width:11px;
    height:11px;
    background:#e6aa83;
    border:2px solid #b87555;
    border-radius:50%;
    z-index:8;
}

.doll .hand.l{
    left:0;
    top:80px;
}

.doll .hand.r{
    right:0;
    top:80px;
}

.doll.run .arm.l{
    animation:upperArmL .32s ease-in-out infinite;
}

.doll.run .arm.r{
    animation:upperArmR .32s ease-in-out infinite;
}

.doll.run .forearm.l{
    animation:forearmL .32s ease-in-out infinite;
}

.doll.run .forearm.r{
    animation:forearmR .32s ease-in-out infinite;
}

.doll.run .hand.l{
    animation:handL .32s ease-in-out infinite;
}

.doll.run .hand.r{
    animation:handR .32s ease-in-out infinite;
}

@keyframes upperArmL{
    0%,100%{transform:rotate(28deg)}
    50%{transform:rotate(-34deg)}
}

@keyframes upperArmR{
    0%,100%{transform:rotate(-28deg)}
    50%{transform:rotate(34deg)}
}

@keyframes forearmL{
    0%,100%{transform:rotate(-34deg)}
    50%{transform:rotate(25deg)}
}

@keyframes forearmR{
    0%,100%{transform:rotate(34deg)}
    50%{transform:rotate(-25deg)}
}

@keyframes handL{
    0%,100%{transform:translate(-2px,2px)}
    50%{transform:translate(3px,-4px)}
}

@keyframes handR{
    0%,100%{transform:translate(2px,2px)}
    50%{transform:translate(-3px,-4px)}
}

/* ---------------------------------------------------------
   LEGS
   --------------------------------------------------------- */

.doll .leg{
    position:absolute;
    top:76px;
    width:13px;
    height:25px;
    background:#3b302d;
    border:2px solid #211b1a;
    border-radius:7px;
    transform-origin:50% 4px;
    z-index:2;
}

.doll .leg.l{
    left:22px;
}

.doll .leg.r{
    right:22px;
}

.doll .shin{
    position:absolute;
    width:12px;
    height:22px;
    background:#3b302d;
    border:2px solid #211b1a;
    border-radius:6px;
    transform-origin:50% 3px;
    z-index:2;
}

.doll .shin.l{
    left:20px;
    top:91px;
}

.doll .shin.r{
    right:20px;
    top:91px;
}

.doll .shoe{
    position:absolute;
    width:21px;
    height:10px;
    background:#171719;
    border:2px solid #080809;
    border-radius:5px 7px 3px 3px;
    z-index:4;
}

.doll .shoe.l{
    left:12px;
    top:98px;
}

.doll .shoe.r{
    right:12px;
    top:98px;
}

.doll .shoe:after{
    content:"";
    position:absolute;
    left:2px;
    right:2px;
    bottom:-3px;
    height:3px;
    background:#080809;
    border-radius:2px;
}

.doll.run .leg.l{
    animation:legUpperL .32s ease-in-out infinite;
}

.doll.run .leg.r{
    animation:legUpperR .32s ease-in-out infinite;
}

.doll.run .shin.l{
    animation:shinL .32s ease-in-out infinite;
}

.doll.run .shin.r{
    animation:shinR .32s ease-in-out infinite;
}

.doll.run .shoe.l{
    animation:shoeL .32s ease-in-out infinite;
}

.doll.run .shoe.r{
    animation:shoeR .32s ease-in-out infinite;
}

@keyframes legUpperL{
    0%,100%{transform:rotate(24deg)}
    50%{transform:rotate(-25deg)}
}

@keyframes legUpperR{
    0%,100%{transform:rotate(-25deg)}
    50%{transform:rotate(24deg)}
}

@keyframes shinL{
    0%,100%{transform:rotate(-20deg)}
    50%{transform:rotate(30deg)}
}

@keyframes shinR{
    0%,100%{transform:rotate(30deg)}
    50%{transform:rotate(-20deg)}
}

@keyframes shoeL{
    0%,100%{transform:translate(-3px,2px) rotate(-7deg)}
    50%{transform:translate(5px,-3px) rotate(8deg)}
}

@keyframes shoeR{
    0%,100%{transform:translate(3px,2px) rotate(7deg)}
    50%{transform:translate(-5px,-3px) rotate(-8deg)}
}

/* ---------------------------------------------------------
   JUMP POSE
   --------------------------------------------------------- */

.doll.jump{
    animation:jumpBody .18s ease-out forwards;
}

@keyframes jumpBody{
    from{transform:scaleY(1)}
    to{transform:scaleY(.94)}
}

/* ---------------------------------------------------------
   VEGA
   --------------------------------------------------------- */

.skin-vega .body{
    background:linear-gradient(90deg,#237c3e,#36b958,#238c45);
}

.skin-vega .cap,
.skin-vega .cap:after{
    background:#111;
}

/* ---------------------------------------------------------
   BUMBLE
   --------------------------------------------------------- */

.skin-bumble .head,
.skin-bumble .arm,
.skin-bumble .forearm,
.skin-bumble .hand{
    background:#704127;
    border-color:#4a2819;
}

.skin-bumble .body{
    background:#111;
    border-color:#050505;
}

.skin-bumble .shirt-highlight{
    background:#c9a227;
}

.skin-bumble .cap,
.skin-bumble .cap:after{
    background:#d0a72a;
}

.skin-bumble .tag{
    color:#111;
}

/* ---------------------------------------------------------
   LABUBA — ТОЛЬКО ЖИРНЫЙ ЧЕЛОВЕК
   --------------------------------------------------------- */

.doll.skin-labuba{
    width:88px;
    height:108px;
}

.skin-labuba .body{
    left:7px;
    width:74px;
    height:50px;
    border-radius:22px 22px 11px 11px;
    background:
        linear-gradient(
            90deg,
            #9f3e1f,
            #d16331 45%,
            #a94420
        );
}

.skin-labuba .head{
    left:28px;
    width:34px;
    height:31px;
}

.skin-labuba .neck{
    left:39px;
}

.skin-labuba .eye.l{
    left:35px;
}

.skin-labuba .eye.r{
    left:49px;
}

.skin-labuba .ear.l{
    left:24px;
}

.skin-labuba .ear.r{
    left:58px;
}

.skin-labuba .cap{
    left:25px;
}

.skin-labuba .tag{
    left:28px;
}

.skin-labuba .arm.l{
    left:0;
}

.skin-labuba .arm.r{
    right:0;
}

.skin-labuba .forearm.l{
    left:-4px;
}

.skin-labuba .forearm.r{
    right:-4px;
}

/* ---------------------------------------------------------
   GIRL
   --------------------------------------------------------- */

.skin-girl .hair{
    position:absolute;
    left:16px;
    top:4px;
    width:45px;
    height:37px;
    background:
        linear-gradient(
            90deg,
            #d7ae43,
            #f3d66b,
            #d3a83d
        );
    border-radius:22px 22px 8px 8px;
    z-index:3;
}

.skin-girl .cap,
.skin-girl .tag{
    display:none;
}

.skin-girl .head{
    top:12px;
}

.skin-girl .body{
    background:
        linear-gradient(
            90deg,
            #e94e91,
            #ff79b2,
            #df4787
        );
    border-color:#a92e65;
    border-radius:11px 11px 18px 18px;
}

.skin-girl .head,
.skin-girl .arm,
.skin-girl .forearm,
.skin-girl .hand{
    background:#f7c9a8;
    border-color:#c18c70;
}

/* ---------------------------------------------------------
   AK IN HANDS
   --------------------------------------------------------- */

.ak-held{
    position:absolute;
    left:38px;
    top:54px;
    width:48px;
    height:18px;
    z-index:12;
    transform:rotate(-8deg);
    opacity:0;
}

#hero.gun-active .ak-held{
    opacity:1;
}

.ak-held .barrel{
    position:absolute;
    left:11px;
    top:5px;
    width:37px;
    height:5px;
    background:#282b28;
    border:1px solid #101110;
}

.ak-held .receiver{
    position:absolute;
    left:3px;
    top:3px;
    width:18px;
    height:9px;
    background:#363a34;
    border-radius:2px;
}

.ak-held .stock{
    position:absolute;
    left:-8px;
    top:5px;
    width:14px;
    height:7px;
    background:#754827;
    transform:skewY(18deg);
}

.ak-held .mag{
    position:absolute;
    left:13px;
    top:10px;
    width:7px;
    height:13px;
    background:#33352f;
    transform:rotate(13deg);
}

.ak-held .grip{
    position:absolute;
    left:8px;
    top:10px;
    width:6px;
    height:10px;
    background:#754827;
    transform:rotate(18deg);
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
    position:absolute;
    left:10px;
    right:10px;
    top:10px;
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-weight:900;
    font-size:15px;
    text-shadow:0 2px 0 #000;
    z-index:20;
    pointer-events:none;
}

#buff{
    margin-top:4px;
    color:#8de8ff;
    font-size:12px;
}

#cityTag{
    position:absolute;
    top:43px;
    left:50%;
    transform:translateX(-50%);
    color:#ffe08a;
    font-weight:900;
    font-size:13px;
    text-shadow:0 2px 0 #000;
    opacity:0;
    transition:opacity .25s;
    z-index:20;
    pointer-events:none;
}

/* =========================================================
   OVERLAY / MENU
   ========================================================= */

#overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(8,4,14,.88);
    color:#fff;
    text-align:center;
    padding:16px;
    z-index:50;
}

#overlay h1{
    font-size:27px;
    margin-bottom:8px;
    color:#ff4d6d;
    text-shadow:3px 3px 0 #3a0010;
}

#overlay p{
    max-width:370px;
    line-height:1.35;
    opacity:.92;
    margin:6px 0 16px;
}

button.main{
    appearance:none;
    border:3px solid #fff;
    background:#ff4d6d;
    color:#fff;
    font-weight:900;
    font-size:17px;
    font-family:inherit;
    padding:12px 24px;
    cursor:pointer;
}

button.main:disabled{
    opacity:.35;
}

.screen{
    width:min(580px,96vw);
}

.hidden{
    display:none!important;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:14px 0 17px;
}

.card{
    background:#241428;
    border:3px solid #5a3a50;
    color:#fff;
    padding:8px 5px;
    min-height:155px;
    font-family:inherit;
    cursor:pointer;
}

.card.sel{
    border-color:#ff4d6d;
    box-shadow:0 0 0 3px rgba(255,77,109,.35);
}

.card .nm{
    color:#ffe08a;
    font-size:12px;
    font-weight:900;
    margin-bottom:4px;
}

.stage{
    position:relative;
    height:115px;
    overflow:hidden;
}

.stage .doll{
    left:50%;
    transform:translateX(-50%) scale(.9);
    transform-origin:50% 100%;
}

.diff-grid{
    display:grid;
    gap:9px;
    margin:15px 0 18px;
}

.diff{
    border:3px solid #50354a;
    background:#241428;
    color:#fff;
    padding:13px;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
}

.diff strong{
    display:block;
    color:#ffe08a;
    margin-bottom:4px;
    font-size:14px;
}

.diff span{
    display:block;
    opacity:.72;
    font-size:11px;
}

.diff.sel{
    border-color:#ff4d6d;
    background:#30182b;
    box-shadow:0 0 0 3px rgba(255,77,109,.25);
}

.hint{
    font-size:12px;
    opacity:.68;
    margin-top:12px;
}

/* =========================================================
   ANIMATION STATE
   ========================================================= */

#hero.running .doll{
    animation:bodyRun .32s ease-in-out infinite;
}

@keyframes bodyRun{
    0%,100%{
        transform:translateY(0) rotate(-1deg);
    }
    50%{
        transform:translateY(-3px) rotate(1deg);
    }
}

#hero.jumping .doll{
    animation:none;
    transform:translateY(1px) rotate(-4deg) scaleY(.96);
}

#hero.falling .doll{
    animation:none;
    transform:rotate(5deg) scaleY(.97);
}

#hero.fast .doll{
    animation-duration:.24s;
}

#hero.hit .doll{
    animation:hitShake .12s linear 3;
}

@keyframes hitShake{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(-4px)}
}
</style>

</head>

    <button class="main" id="toDifficulty" disabled>

    </button>

</div>

<!-- СЛОЖНОСТЬ -->
<div id="difficultyScreen" class="screen hidden">

    <h1>ВЫБОР СЛОЖНОСТИ</h1>

    <div class="diff-grid">

        <button class="diff" data-diff="easy">
            <strong>Сосунок ебаный</strong>
            <span>Медленный разгон. Препятствия появляются редко.</span>
        </button>

        <button class="diff" data-diff="normal">
            <strong>Обычный работяга с завода</strong>
            <span>Среднее ускорение и нормальная плотность препятствий.</span>
        </button>

function drawCities(gy){

    const h=gy+6;

    const widths=cityImgs.map(img=>cityWidth(img,h));

    const total=widths.reduce((a,b)=>a+b,0)||W;

    const scroll=(state.dist*2.2)%total;

    let x=-scroll;
    let seen=state.city;

    for(let n=0;n<CITIES.length*2;n++){

        const i=n%CITIES.length;
        const w=widths[i];
        const img=cityImgs[i];

        if(img.complete&&img.naturalWidth){

            ctx.drawImage(
                img,
                Math.floor(x),
                0,
                Math.ceil(w)+1,
                Math.ceil(h)
            );

        }

        if(
            x<=W*.35&&
            x+w>W*.35
        ){

            seen=i;

        }

        x+=w;

        if(x>W+5)break;

    }

    toastCity(seen);

}

function drawBackground(){

        0,0,0,gy
    );

    gradient.addColorStop(0,'#3a2460');
    gradient.addColorStop(1,'#c45a3a');

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,gy);

    drawCities(gy);

    const roadH=Math.floor((H-gy)*.46);

    ctx.fillStyle='#5b5b63';
    ctx.fillRect(0,gy,W,roadH);

    ctx.fillStyle='#4a4a52';
    ctx.fillRect(0,gy,W,8);

    const dash=34;

    const shift=(state.dist/.12)%(dash*2);

    ctx.fillStyle='#e6d36a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy+roadH*.45,
            20,
            4
        );

    }

    ctx.fillStyle='#7a5a3a';

    ctx.fillRect(
        0,
        gy+roadH,
        W,
        H-gy-roadH
    );

}

    ctx.fillStyle='#222';

    ctx.arc(-6,-22,1.4,0,Math.PI*2);

    ctx.beginPath();

    );

    ctx.fill();

    ctx.fillStyle='#d99773';

    ctx.beginPath();

        -20,6,8,7,0,0,Math.PI*2

    );

function drawShield(o){

/* =========================================================
   GAME LOOP
   ========================================================= */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        .033,
        (now-last)/1000
    );

    last=now;

    state.groundY=Math.floor(H*.70);

    /* -----------------------------------------------------
       PLAYER
       ----------------------------------------------------- */

    if(player.onGround){

        player.y=
            state.groundY-
            player.h;

    }

    if(
        state.running&&
        !state.over
    ){

        state.t+=dt;

        const cfg=DIFFICULTIES[difficulty];

        /*
         * Главное ускорение:
         * скорость постоянно растёт.
         * У каждой сложности свой acceleration.
         */

        state.speed+=
            cfg.acceleration*dt;

        /*
         * Дополнительный мягкий рост
         * после больших дистанций.
         */

        state.speed+=
            Math.min(
                5,
                state.dist/5000
            )*dt;

        state.dist+=
            state.speed*
            dt*
            .12;

        scoreEl.textContent=
            Math.floor(state.dist)+' м';

        shieldT=Math.max(
            0,
            shieldT-dt
        );

        gunT=Math.max(
            0,
            gunT-dt
        );

        updateBuff();

        /* -------------------------------------------------
           JUMP PHYSICS
           ------------------------------------------------- */

        player.vy+=
            state.gravity*
            (
                player.vy>0?2:1
            )*
            dt;

        player.y+=
            player.vy*dt;

        if(
            player.y>=
            state.groundY-player.h
        ){

            player.y=
                state.groundY-player.h;

            player.vy=0;

            if(!player.onGround){

                heroEl.classList.remove(
                    'jumping',
                    'falling'
                );

            }

            player.onGround=true;
            player.jumpsUsed=0;

        }else{

            player.onGround=false;

            heroEl.classList.toggle(
                'jumping',
                player.vy<0
            );

            heroEl.classList.toggle(
                'falling',
                player.vy>=0
            );

        }

        /* -------------------------------------------------
           BODY DYNAMICS
           ------------------------------------------------- */

        heroEl.classList.toggle(
            'fast',
            state.speed>430
        );

        /*
         * Чем быстрее бег —
         * тем активнее корпус наклоняется.
         */

        if(player.onGround){

            const lean=Math.min(
                7,
                Math.max(
                    0,
                    (state.speed-240)/45
                )
            );

            dollEl.style.marginLeft=
                (-lean*.15)+'px';

        }

        /* -------------------------------------------------
           GUN
           ------------------------------------------------- */

        if(gunT>0){

            fireAcc+=dt;

            if(fireAcc>.10){

                fireAcc=0;
                fire();

            }

        }else{

            fireAcc=0;

        }

        /* -------------------------------------------------
           NORMAL SPAWN
           ------------------------------------------------- */

        spawnTimer-=dt;

        if(spawnTimer<=0){

            spawnObstacle();

            const speedFactor=Math.min(
                .28,
                (state.speed-240)/900
            );

            spawnTimer=
                cfg.minSpawn+
                Math.random()*
                (
                    cfg.maxSpawn-
                    cfg.minSpawn
                )-
                speedFactor;

            spawnTimer=Math.max(
                cfg.minSpawn*.75,
                spawnTimer
            );

        }

        /* -------------------------------------------------
           POWER SPAWN BY DISTANCE
           ------------------------------------------------- */

        spawnPowerByDistance();

        /* -------------------------------------------------
           OBSTACLES
           ------------------------------------------------- */

        const pBox=playerBox();

        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            const o=obstacles[i];

            o.x-=state.speed*dt;

            if(o.type==='dick'){

                /*
                 * Выше над землёй.
                 */

                o.y=
                    state.groundY-
                    o.flyY-
                    o.h;

            }else if(
                o.type==='shield'||
                o.type==='ak'
            ){

                o.y=
                    state.groundY-
                    o.h-
                    22;

            }else{

                o.y=
                    state.groundY-
                    o.h;

            }

            /* ---------------------------------------------
               BULLETS
               --------------------------------------------- */

            let destroyed=false;

            for(
                let b=bullets.length-1;
                b>=0;
                b--
            ){

                const bullet=bullets[b];

                const bb={
                    x:bullet.x,
                    y:bullet.y,
                    w:9,
                    h:4
                };

                if(
                    o.type!=='ak'&&
                    o.type!=='shield'&&
                    hit(bb,obstacleBox(o))
                ){

                    burst(
                        o.x+o.w/2,
                        o.y,
                        '#ffe08a',
                        10
                    );

                    bullets.splice(b,1);

                    obstacles.splice(i,1);

                    destroyed=true;

                    break;

                }

            }

            if(destroyed)continue;

            /* ---------------------------------------------
               PLAYER COLLISION
               --------------------------------------------- */

            const obox=obstacleBox(o);

            if(hit(pBox,obox)){

                if(o.type==='shield'){

                    shieldT=10;

                    burst(
                        o.x+o.w/2,
                        o.y+o.h/2,
                        '#35baff',
                        18
                    );

                    obstacles.splice(i,1);

                    updateBuff();

                    continue;

                }

                if(o.type==='ak'){

                    gunT=10;

                    fireAcc=0;

                    burst(
                        o.x+o.w/2,
                        o.y+o.h/2,
                        '#9fff68',
                        18
                    );

                    obstacles.splice(i,1);

                    updateBuff();

                    continue;

                }

                if(shieldT>0){

                    burst(
                        o.x+o.w/2,
                        o.y+o.h/2,
                        '#8de8ff',
                        20
                    );

                    obstacles.splice(i,1);

                    continue;

                }

                heroEl.classList.add('hit');

                setTimeout(()=>{
                    heroEl.classList.remove('hit');
                },300);

                gameOver(o.type);

                break;

            }

            if(
                o.x+o.w<
                -70
            ){

                obstacles.splice(i,1);

            }

        }

        /* -------------------------------------------------
           BULLETS
           ------------------------------------------------- */

        for(
            let i=bullets.length-1;
            i>=0;
            i--
        ){

            const b=bullets[i];

            b.x+=b.vx*dt;
            b.y+=b.vy*dt;

            b.life-=dt;

            if(
                b.life<=0||
                b.x>W+30||
                b.y<0||
                b.y>H
            ){

                bullets.splice(i,1);

            }

        }

    }

    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.life-=dt;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=450*dt;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

    /* =====================================================
       DRAW
       ===================================================== */

    drawBackground();

    for(const o of obstacles){

        if(o.type==='poop'){

            drawPoop(o);

        }else if(o.type==='dick'){

            drawDick(o);

        }else if(o.type==='shield'){

            drawShield(o);

        }else if(o.type==='ak'){

            drawAK(o);

        }

    }

    for(const b of bullets){

        ctx.fillStyle='#ffe08a';

        ctx.fillRect(
            b.x,
            b.y,
            10,
            3
        );

    }

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life*2);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

        ctx.globalAlpha=1;

    }

    /* =====================================================
       DOM HERO
       ===================================================== */

    heroEl.style.left=
        player.x+'px';

    heroEl.style.top=
        player.y+'px';

    dollEl.classList.toggle(
        'run',
        state.running&&
        !state.over&&
        player.onGround
    );

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener('click',e=>{

    e.stopPropagation();

    if(!skin||!difficulty)return;

    reset();

});

/* =========================================================
   INITIAL SKIN
   ========================================================= */

applySkin();

})();
</script>

</div>

</body>
</html>

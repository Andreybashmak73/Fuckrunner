<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FUCKRUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1a1020;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    user-select:none;
}

#wrap{
    position:relative;
    width:100%;
    height:100%;
}

canvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    background:#3a2460;
    image-rendering:pixelated;
}

/* =========================================================
   PLAYER
   ========================================================= */

#hero{
    position:absolute;
    left:90px;
    top:0;

    width:54px;
    height:96px;

    pointer-events:none;
    z-index:3;
}

#hero.skin-labuba{
    width:72px;
}

.doll{
    position:absolute;
    left:0;
    top:0;

    width:54px;
    height:96px;

    pointer-events:none;
}

.doll.skin-labuba{
    width:72px;
}

.doll .cap{
    position:absolute;
    left:8px;
    top:0;
    width:38px;
    height:16px;
    background:#111;
    border-radius:8px 8px 2px 2px;
    z-index:3;
}

.doll .cap:after{
    content:'';
    position:absolute;
    right:-8px;
    bottom:2px;
    width:18px;
    height:6px;
    background:#111;
    border-radius:0 6px 6px 0;
}

.doll .tag{
    position:absolute;
    left:8px;
    top:3px;
    width:38px;
    color:#eee;
    font:800 7px/1 sans-serif;
    text-align:center;
    z-index:4;
}

.doll .head{
    position:absolute;
    left:14px;
    top:10px;
    width:26px;
    height:26px;
    background:#f0b48a;
    border-radius:50%;
}

.doll .eye{
    position:absolute;
    top:18px;
    width:4px;
    height:4px;
    background:#222;
    border-radius:50%;
}

.doll .eye.l{
    left:20px;
}

.doll .eye.r{
    left:30px;
}

.doll .shirt{
    position:absolute;
    left:6px;
    top:32px;
    width:42px;
    height:38px;
    background:#2ea44f;
    border-radius:8px 8px 4px 4px;
}

.doll .collar{
    position:absolute;
    left:6px;
    top:32px;
    width:42px;
    height:8px;
    background:#217a3a;
    border-radius:8px 8px 0 0;
}

.doll .hair,
.doll .chain{
    display:none;
}

.doll .arm{
    position:absolute;
    top:36px;
    width:10px;
    height:24px;
    background:#e0a07a;
    border-radius:5px;
    transform-origin:50% 0;
}

.doll .arm.l{
    left:0;
}

.doll .arm.r{
    right:0;
}

.doll .leg{
    position:absolute;
    bottom:0;
    width:10px;
    height:26px;
    background:#3a2a22;
    border-radius:5px;
    transform-origin:50% 0;
}

.doll .leg.l{
    left:14px;
}

.doll .leg.r{
    right:14px;
}

.doll.run .arm{
    animation:arms .32s linear infinite;
}

.doll.run .leg{
    animation:legs .32s linear infinite;
}

.doll.run .arm.l,
.doll.run .leg.r{
    animation-direction:reverse;
}

/* =========================================================
   BUMBLE
   ========================================================= */

.doll.skin-bumble .head,
.doll.skin-bumble .arm{
    background:#6b3a22;
}

.doll.skin-bumble .shirt{
    background:#111;
}

.doll.skin-bumble .collar{
    background:#c9a227;
}

.doll.skin-bumble .chain{
    display:block;
    position:absolute;
    left:14px;
    top:40px;
    width:26px;
    height:14px;
    border:3px solid #efc44a;
    border-top:0;
    border-radius:0 0 14px 14px;
    z-index:5;
}

.doll.skin-bumble .cap,
.doll.skin-bumble .cap:after{
    background:#c9a227;
}

.doll.skin-bumble .tag{
    color:#111;
}

/* =========================================================
   LABUBA
   ========================================================= */

.doll.skin-labuba .head{
    left:22px;
    width:30px;
    height:28px;
}

.doll.skin-labuba .eye.l{
    left:28px;
}

.doll.skin-labuba .eye.r{
    left:42px;
}

.doll.skin-labuba .shirt{
    left:4px;
    width:64px;
    height:42px;
    background:#c45a2a;
    border-radius:16px;
}

.doll.skin-labuba .collar{
    left:4px;
    width:64px;
    background:#8a3a18;
}

.doll.skin-labuba .cap,
.doll.skin-labuba .tag{
    left:16px;
}

/* =========================================================
   GIRL
   ========================================================= */

.doll.skin-girl .hair{
    display:block;
    position:absolute;
    left:10px;
    top:6px;
    width:34px;
    height:28px;
    background:#f2d36b;
    border-radius:16px 16px 4px 4px;
    z-index:1;
}

.doll.skin-girl .cap,
.doll.skin-girl .tag,
.doll.skin-girl .collar{
    display:none;
}

.doll.skin-girl .shirt{
    background:#ff7ab0;
    border-radius:10px 10px 18px 18px;
    height:42px;
}

.doll.skin-girl .head,
.doll.skin-girl .arm{
    background:#f7c9a8;
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    color:#fff;
    font-weight:800;
    font-size:15px;
    text-shadow:0 2px 0 #000;

    pointer-events:none;
    z-index:10;
}

#buff{
    color:#9fef6a;
    font-size:12px;
    margin-top:4px;
    min-height:14px;
}

#cityTag{
    position:absolute;
    top:42px;
    left:50%;

    transform:translateX(-50%);

    color:#ffe08a;
    font-weight:800;
    font-size:13px;
    text-shadow:0 2px 0 #000;

    pointer-events:none;
    z-index:10;

    opacity:0;
    transition:opacity .3s;
}

/* =========================================================
   OVERLAY
   ========================================================= */

#overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:rgba(8,4,14,.86);

    color:#fff;
    text-align:center;

    padding:16px;

    z-index:50;
}

#overlay h1{
    font-size:26px;
    margin-bottom:8px;
    color:#ff4d6d;
    text-shadow:3px 3px 0 #3a0010;
}

#overlay p{
    opacity:.92;
    margin:6px 0 16px;

}

button.main{
    appearance:none;

}

button.main:disabled{
    opacity:.4;
}

.hint{
    font-size:12px;
    opacity:.7;
    margin-top:12px;
}

#screen-pick{
    display:none;
    width:min(560px,96vw);
}

#screen-pick.show{
    display:block;
}

#screen-title.hide{
    display:none;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0 16px;
}

.card{
    background:#241428;

    color:#fff;

}

.stage{
    position:relative;

}

/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes legs{
    0%{
        transform:rotate(28deg);
    }

    50%{
        transform:rotate(-28deg);
    }

    100%{
        transform:rotate(28deg);
    }
}

@keyframes arms{
    0%{
        transform:rotate(-24deg);
    }

    50%{
        transform:rotate(24deg);
    }

    100%{
        transform:rotate(-24deg);
    }
}
</style>

<body>

<div id="wrap">

    <canvas id="c"></canvas>

    <!-- PLAYER -->
    <div id="hero" class="skin-vega">

        <div class="doll skin-vega">

            <div class="hair"></div>
            <div class="cap"></div>
            <div class="tag">ВЕГА</div>

            <div class="head"></div>

            <div class="eye l"></div>
            <div class="eye r"></div>

            <div class="arm l"></div>
            <div class="arm r"></div>

            <div class="shirt"></div>
            <div class="collar"></div>
            <div class="chain"></div>

            <div class="leg l"></div>
            <div class="leg r"></div>

        </div>

    </div>

    <!-- HUD -->
    <div id="hud">

        <div>
            <div id="score">0 м</div>
            <div id="buff"></div>
        </div>

        <div id="best">
            лучший счет 0
        </div>

    </div>

    <div id="cityTag"></div>

    <!-- MENU -->
    <div id="overlay">

        <div id="screen-title">

            <h1>FUCKRUNNER</h1>

            </p>

            <button class="main" id="pickBtn">
                ВЫБЕРИ БОЙЦА
            </button>

            <div class="hint">
                тап — прыжок, второй тап в воздухе — прыжок повыше
            </div>

        </div>

        <div id="screen-pick">

            <h1>ВЫБЕРИ БОЙЦА</h1>

            <div class="grid" id="grid"></div>

            <button class="main" id="start" disabled>
                ПОГНАЛИ
            </button>

        </div>

    </div>

</div>

<script>
(()=>{
'use strict';

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if(tg){

    tg.ready();
    tg.expand();

    try{
        tg.setHeaderColor('#2a1630');
        tg.setBackgroundColor('#1a1020');
    }catch(e){}

}


/* =========================================================
   DOM
   ========================================================= */

const canvas =
    document.getElementById('c');

const ctx =
    canvas.getContext('2d');

const overlay =
    document.getElementById('overlay');

const titleScr =
    document.getElementById('screen-title');

const pickScr =
    document.getElementById('screen-pick');

const startBtn =
    document.getElementById('start');

const scoreEl =
    document.getElementById('score');

const bestEl =
    document.getElementById('best');

const buffEl =
    document.getElementById('buff');

const cityTag =
    document.getElementById('cityTag');

const heroEl =
    document.getElementById('hero');

const grid =
    document.getElementById('grid');


/* =========================================================
   CANVAS
   ========================================================= */

let W=0;
let H=0;
let dpr=1;

function resize(){

    dpr=Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=
        Math.floor(W*dpr);

    canvas.height=
        Math.floor(H*dpr);

    canvas.style.width=
        W+'px';

    canvas.style.height=
        H+'px';

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;
}

window.addEventListener(
    'resize',
    resize
);

resize();


/* =========================================================
   CITIES
   ========================================================= */

const CITIES=[
    {
        name:'ЕКАТЕРИНБУРГ',
        src:'../bg_far.jpg'
    },
    {
        name:'ТОЛЬЯТТИ',
        src:'../bg_tlt.jpg'
    },
    {
        name:'УЛЬЯНОВСК',
        src:'../bg_uln.jpg'
    },
    {
        name:'КАЗАНЬ',
        src:'../bg_kzn.jpg'
    },
    {
        name:'ЙОШКАР-ОЛА',
        src:'../bg_yosh.jpg'
    },
    {
        name:'САРАТОВ',
        src:'../bg_sar.jpg'
    },
    {
        name:'САМАРА',
        src:'../bg_sam.jpg'
    }
];

const cityImgs=CITIES.map(city=>{

    const img=new Image();

    img.src=city.src;

    return img;

});


/* =========================================================
   FIGHTERS
   ========================================================= */

const FIGHTERS=[
    {
        id:'vega',
        name:'Вегамэн',
        tag:'ВЕГА'
    },
    {
        id:'bumble',
        name:'Бамбл Бизи',
        tag:'BEE'
    },
    {
        id:'labuba',
        name:'Лабуба',
        tag:'ЛАБ'
    },
    {
        id:'girl',
        name:'Вагина реалистик',
        tag:''
    }
];

FIGHTERS.forEach(f=>{

    const button=
        document.createElement('button');

    button.className='card';
    button.dataset.id=f.id;

    button.innerHTML=`

        <div class="nm">
            ${f.name}
        </div>

        <div class="stage">

            <div class="doll skin-${f.id}">

                <div class="hair"></div>
                <div class="cap"></div>

                <div class="tag">
                    ${f.tag}
                </div>

                <div class="head"></div>

                <div class="eye l"></div>
                <div class="eye r"></div>

                <div class="arm l"></div>
                <div class="arm r"></div>

                <div class="shirt"></div>
                <div class="collar"></div>
                <div class="chain"></div>

                <div class="leg l"></div>
                <div class="leg r"></div>

            </div>

        </div>
    `;

    grid.appendChild(button);

});


/* =========================================================
   GAME CONFIG
   ========================================================= */

const CONFIG={

    playerX:90,

    playerWidth:54,
    playerHeight:96,

    labubaWidth:72,

    gravity:2400,

    jumpFirst:-820,
    jumpSecond:-1160,

    startSpeed:280,
    maxSpeed:900,
    acceleration:8,

    distanceMultiplier:.12,

    powerupDistance:3000,

    shieldDuration:10,

    gunDuration:15,

    gunFireRate:.09,

    bulletSpeed:620,

    obstacleMinSpawn:.65,
    obstacleMaxSpawn:1.45

};


/* =========================================================
   STATE
   ========================================================= */

const state={

    running:false,
    over:false,

    t:0,

    speed:CONFIG.startSpeed,
    dist:0,

    groundY:0,

    city:-1,

    nextPowerDistance:
        CONFIG.powerupDistance,

    nextPowerType:0

};


/* =========================================================
   PLAYER
   ========================================================= */

const player={

    x:CONFIG.playerX,

    y:0,

    vy:0,

    w:CONFIG.playerWidth,

    h:CONFIG.playerHeight,

    onGround:true,

    jumpsUsed:0

};


/* =========================================================
   OBJECTS
   ========================================================= */

const obstacles=[];
const particles=[];
const bullets=[];


/* =========================================================
   POWERUPS
   ========================================================= */

let shieldT=0;
let gunT=0;

let fireAcc=0;


/*
    Усиления идут строго по дистанции.

    3000 м -> ЩИТ
    6000 м -> АК
    9000 м -> ЩИТ
    12000 м -> АК
    и т.д.

    Благодаря этому оба предмета
    гарантированно появляются.
*/

function spawnPowerup(){

    const type=
        state.nextPowerType===0
        ?'shield'
        :'ak';

    state.nextPowerType=
        state.nextPowerType===0
        ?1
        :0;

    obstacles.push({

        type,

        x:W+80,

        y:0,

        w:
            type==='shield'
            ?44
            :52,

        h:
            type==='shield'
            ?44
            :28,

        phase:
            Math.random()*
            Math.PI*2

    });

}


/* =========================================================
   SKIN
   ========================================================= */

let skin='vega';

function applySkin(){

    heroEl.className=
        'skin-'+skin;

    const doll=
        heroEl.querySelector('.doll');

    if(doll){

        doll.className=
            'doll skin-'+skin;

    }

    const tag=
        heroEl.querySelector('.tag');

    if(tag){

        tag.textContent=
            skin==='vega'
            ?'ВЕГА'
            :skin==='bumble'
            ?'BEE'
            :skin==='labuba'
            ?'ЛАБ'
            :'';

    }

    player.w=
        skin==='labuba'
        ?CONFIG.labubaWidth
        :CONFIG.playerWidth;

    player.h=
        CONFIG.playerHeight;

}


/* =========================================================
   MENU
   ========================================================= */

document
.getElementById('pickBtn')
.addEventListener(
    'click',
    ()=>{

        titleScr.classList.add('hide');
        pickScr.classList.add('show');

    }
);


grid
.querySelectorAll('.card')
.forEach(card=>{

    card.addEventListener(
        'click',
        ()=>{

            grid
            .querySelectorAll('.card')
            .forEach(c=>{

                c.classList.remove('sel');

                const doll=
                    c.querySelector('.doll');

                if(doll){
                    doll.classList.remove('run');
                }

            });

            card.classList.add('sel');

            const doll=
                card.querySelector('.doll');

            if(doll){
                doll.classList.add('run');
            }

            skin=
                card.dataset.id;

            startBtn.disabled=false;

            applySkin();

        }
    );

});


/* =========================================================
   BEST SCORE
   ========================================================= */

const BEST_KEY=
    'fuckrunner_ekb_best';

let best=
    parseInt(
        localStorage.getItem(BEST_KEY) || '0',
        10
    );

function renderBest(){

    bestEl.textContent=
        'лучший счет '+best;

}

renderBest();


/* =========================================================
   CITY
   ========================================================= */

function toastCity(i){

    if(i<0 || i===state.city){
        return;
    }

    state.city=i;

    cityTag.textContent=
        CITIES[i].name;

    cityTag.style.opacity='1';

    clearTimeout(
        toastCity.timer
    );

    toastCity.timer=
        setTimeout(
            ()=>{
                cityTag.style.opacity='0';
            },
            1600
        );

}


/* =========================================================
   RESET
   ========================================================= */

function reset(){

    state.running=true;
    state.over=false;

    state.t=0;

    state.speed=
        CONFIG.startSpeed;

    state.dist=0;

    state.city=-1;

    state.nextPowerDistance=
        CONFIG.powerupDistance;

    state.nextPowerType=0;

    obstacles.length=0;
    particles.length=0;
    bullets.length=0;

    spawnTimer=.7;

    shieldT=0;
    gunT=0;

    fireAcc=0;

    player.vy=0;
    player.onGround=true;
    player.jumpsUsed=0;

    applySkin();

    scoreEl.textContent='0 м';
    buffEl.textContent='';

    overlay.style.display='none';

    toastCity(0);

}


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(
        !state.running ||
        state.over ||
        player.jumpsUsed>=2
    ){
        return;
    }

    player.vy=
        player.jumpsUsed===0
        ?CONFIG.jumpFirst
        :CONFIG.jumpSecond;

    player.onGround=false;

    player.jumpsUsed++;

}


/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener(
    'keydown',
    e=>{

        if(
            e.code==='Space' ||
            e.code==='ArrowUp'
        ){

            e.preventDefault();

            if(state.running){
                jump();
            }

        }

    }
);


window.addEventListener(
    'pointerdown',
    e=>{

        if(e.target.closest('#overlay')){
            return;
        }

        if(state.running){
            jump();
        }

    }
);


/* =========================================================
   MUSIC
   ========================================================= */

const TRACKS=[
    'ushet.mp3',
    '../bogi.mp3',
    '../gorod.mp3',
    '../Chto.mp3',
    '../Police.mp3',
    '../Big.mp3'
];

let lastTrack=-1;
let musicOn=false;
let skipGuard=0;

const music=new Audio();

music.volume=.55;

function playRandom(){

    if(!TRACKS.length){
        return;
    }

    let i=
        Math.floor(
            Math.random()*
            TRACKS.length
        );

    if(
        TRACKS.length>1 &&
        i===lastTrack
    ){

        i=
            (i+1)%
            TRACKS.length;

    }

    lastTrack=i;

    music.src=TRACKS[i];

    music
    .play()
    .then(()=>{
        skipGuard=0;
    })
    .catch(()=>{});

}

music.addEventListener(
    'ended',
    playRandom
);

music.addEventListener(
    'error',
    ()=>{

        if(skipGuard++>8){
            return;
        }

        playRandom();

    }
);


/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener(
    'click',
    e=>{

        e.stopPropagation();

        reset();

        if(!musicOn){

            musicOn=true;

            playRandom();

        }

    }
);


/* =========================================================
   OBSTACLE SPAWN
   ========================================================= */

let spawnTimer=.7;

function spawnObstacle(){

    if(Math.random()<.55){

        obstacles.push({

            type:'poop',

            x:W+60,

            y:0,

            w:46,

            h:38

        });

    }else{

        obstacles.push({

            type:'dick',

            x:W+60,

            y:0,

            flyY:
                70+
                Math.random()*90,

            w:52,

            h:22,

            wob:
                Math.random()*
                Math.PI*2

        });

    }

}


/* =========================================================
   HITBOX
   ========================================================= */

function getPlayerHitbox(){

    return {

        x:player.x,

        y:player.y,

        w:player.w,

        h:player.h

    };

}

function getObstacleHitbox(o){

    return {

        x:o.x,

        y:o.y,

        w:o.w,

        h:o.h

    };

}

function hit(a,b){

    return (

        a.x <
        b.x+b.w &&

        a.x+a.w >
        b.x &&

        a.y <
        b.y+b.h &&

        a.y+a.h >
        b.y

    );

}


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(kind){

    state.over=true;
    state.running=false;

    const score=
        Math.floor(state.dist);

    if(score>best){

        best=score;

        localStorage.setItem(
            BEST_KEY,
            String(best)
        );

        renderBest();

    }

    titleScr.classList.remove('hide');
    pickScr.classList.remove('show');

    overlay
    .querySelector(
        '#screen-title h1'
    )
    .textContent=
        kind==='dick'
        ?'Есть пробитие'
        :'Это конец, ты в говне';

    overlay
    .querySelector(
        '#screen-title p'
    )
    .textContent=
        'Обычная жизнь оборвалась на '+
        score+
        ' м.';

    overlay.style.display='flex';

}


/* =========================================================
   PARTICLES
   ========================================================= */

function boom(x,y,col,count=12){

    for(
        let i=0;
        i<count;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*
                260,

            vy:
                -80-
                Math.random()*190,

            life:
                .35+
                Math.random()*.25,

            maxLife:.6,

            col

        });

    }

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function cityWidth(img,h){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(

            W*.92,

            h*
            (
                img.naturalWidth/
                img.naturalHeight
            )

        );

    }

    return W*.92;

}


function drawCities(gy){

    const h=gy+6;

    const widths=
        cityImgs.map(
            im=>
                cityWidth(im,h)
        );

    const total=
        widths.reduce(
            (a,b)=>a+b,
            0
        )||W;

    const scroll=
        (state.dist*2.2)%
        total;

    let x=-scroll;
    let seen=-1;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const i=
            n%CITIES.length;

        const w=
            widths[i];

        const img=
            cityImgs[i];

        if(
            img &&
            img.complete &&
            img.naturalWidth
        ){

            ctx.drawImage(

                img,

                Math.floor(x),
                0,

                Math.ceil(w)+1,
                Math.ceil(h)

            );

        }

        if(
            x<=W*.35 &&
            x+w>W*.35
        ){

            seen=i;

        }

        x+=w;

        if(x>W+4){
            break;
        }

    }

    if(seen>=0){
        toastCity(seen);
    }

}


function drawBackdrop(){

    const gy=
        state.groundY;

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            gy
        );

    gradient.addColorStop(
        0,
        '#3a2460'
    );

    gradient.addColorStop(
        1,
        '#c45a3a'
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        gy
    );

    drawCities(gy);

    const roadH=
        Math.floor(
            (H-gy)*.46
        );

    ctx.fillStyle='#5b5b63';

    ctx.fillRect(
        0,
        gy,
        W,
        roadH
    );

    ctx.fillStyle='#4a4a52';

    ctx.fillRect(
        0,
        gy,
        W,
        8
    );

    const dash=34;

    const shift=
        (state.dist/.12)%
        (dash*2);

    ctx.fillStyle='#e6d36a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy+roadH*.45,
            20,
            4
        );

    }

    ctx.fillStyle='#7a5a3a';

    ctx.fillRect(
        0,
        gy+roadH,
        W,
        H-gy-roadH
    );

    ctx.fillStyle='#6a4a2e';

    const tile=26;

    const sh=
        (state.dist/.12)%
        tile;

    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(
            x-sh,
            gy+roadH+10,
            12,
            4
        );

    }

}


/* =========================================================
   OBSTACLE DRAWING
   ========================================================= */

function drawPoop(o){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h;

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle='#5a2c10';

    ctx.beginPath();

    ctx.ellipse(
        0,-10,
        20,12,
        0,0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        -4,-22,
        14,10,
        -.2,0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        2,-32,
        9,8,
        .2,0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle='#fff';

    ctx.beginPath();

    ctx.arc(
        -6,-22,
        3,0,
        Math.PI*2
    );

    ctx.arc(
        4,-20,
        2.4,0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle='#222';

    ctx.beginPath();

    ctx.arc(
        -6,-22,
        1.4,0,
        Math.PI*2
    );

    ctx.arc(
        4,-20,
        1.2,0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


function drawDick(o){

    const x=
        o.x+
        o.w/2;

    const y=
        o.y+
        o.h/2+
        Math.sin(
            state.t*6+
            o.wob
        )*6;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        -.15+
        Math.sin(
            state.t*4+
            o.wob
        )*.12
    );

    ctx.fillStyle='#f0b48a';

    ctx.beginPath();

    ctx.roundRect(
        -22,
        -8,
        36,
        16,
        8
    );

    ctx.fill();

    ctx.fillStyle='#e08a8a';

    ctx.beginPath();

    ctx.ellipse(
        16,
        0,
        11,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle='#e0a07a';

    ctx.beginPath();

    ctx.ellipse(
        -20,
        6,
        8,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        -12,
        8,
        8,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   SHIELD DRAW
   ========================================================= */

function drawShieldIcon(o){

    const cx=
        o.x+
        o.w/2;

    const cy=
        o.y+
        o.h/2+
        Math.sin(
            state.t*5+
            o.phase
        )*5;

    const pulse=
        1+
        Math.sin(
            state.t*7+
            o.phase
        )*.08;

    ctx.save();

    ctx.translate(cx,cy);
    ctx.scale(pulse,pulse);

    /*
        Внешнее свечение.
    */

    ctx.shadowColor='#27a7ff';
    ctx.shadowBlur=14;

    ctx.fillStyle='#176cff';

    ctx.beginPath();

    ctx.moveTo(0,-21);
    ctx.lineTo(17,-14);
    ctx.lineTo(15,5);
    ctx.quadraticCurveTo(
        0,22,
        -15,5
    );
    ctx.lineTo(-17,-14);
    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle='#bfeaff';
    ctx.lineWidth=3;

    ctx.stroke();

    /*
        Центральная молния.
    */

    ctx.fillStyle='#fff';

    ctx.beginPath();

    ctx.moveTo(3,-12);
    ctx.lineTo(-7,2);
    ctx.lineTo(0,2);
    ctx.lineTo(-3,13);
    ctx.lineTo(8,-3);
    ctx.lineTo(1,-3);
    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   AK DRAW
   ========================================================= */

function drawAkIcon(o){

    const cx=
        o.x+
        o.w/2;

    const cy=
        o.y+
        o.h/2+
        Math.sin(
            state.t*5+
            o.phase
        )*5;

    ctx.save();

    ctx.translate(cx,cy);

    ctx.rotate(-.22);

    ctx.shadowColor='#9fef6a';
    ctx.shadowBlur=12;

    /*
        Приклад.
    */

    ctx.fillStyle='#26261f';

    ctx.fillRect(
        -20,
        -5,
        38,
        9
    );

    /*
        Ствол.
    */

    ctx.fillStyle='#151512';

    ctx.fillRect(
        17,
        -7,
        15,
        4
    );

    /*
        Магазин.
    */

    ctx.fillStyle='#6b4a28';

    ctx.beginPath();

    ctx.moveTo(-5,3);
    ctx.lineTo(4,5);
    ctx.lineTo(0,17);
    ctx.lineTo(-8,14);
    ctx.closePath();

    ctx.fill();

    /*
        Приклад.
    */

    ctx.fillRect(

    );

    */

    ctx.fillStyle='#b8b89a';

    ctx.fillRect(
        4,
        -7,
        7,
        3
    );

}


/* =========================================================
   ACTIVE SHIELD AURA
   ========================================================= */

function drawShieldAura(){

    if(shieldT<=0){
        return;
    }

    const cx=
        player.x+
        player.w/2;

    const cy=
        player.y+
        player.h/2;

    const pulse=
        1+
        Math.sin(state.t*8)*.035;

    ctx.save();

    ctx.translate(cx,cy);
    ctx.scale(pulse,pulse);

    ctx.globalAlpha=
        .18+
        Math.sin(state.t*8)*.04;

    ctx.fillStyle='#35bfff';

    ctx.shadowColor='#35bfff';
    ctx.shadowBlur=24;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        Math.max(
            player.w,
            player.h
        )*.68,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=.8;

    ctx.strokeStyle='#9beaff';
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        Math.max(
            player.w,
            player.h
        )*.68,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   GUN
   ========================================================= */

function drawGun(){

    const px=
        player.x+
        player.w*.55;

    const py=
        player.y+44;

    ctx.save();

    ctx.translate(px,py);
    ctx.rotate(-.12);

    ctx.fillStyle='#2c2c26';

    ctx.fillRect(
        0,
        -4,
        42,
        8
    );

    ctx.fillStyle='#5a3a20';

    ctx.fillRect(
        6,
        2,
        8,
        12
    );

    ctx.fillStyle='#111';

    ctx.fillRect(
        34,
        -6,
        10,
        4
    );

    ctx.restore();

}


/* =========================================================
   UPDATE POWERUP POSITION
   ========================================================= */

function updateObjectPosition(o){

    if(o.type==='dick'){

        o.y=
            state.groundY-
            o.flyY-
            o.h;

        return;

    }

    if(
        o.type==='shield' ||
        o.type==='ak'
    ){

        /*
            Предметы находятся чуть выше дороги,
            поэтому их полностью видно.
        */

        o.y=
            state.groundY-
            o.h-
            14;

        return;

    }

    o.y=
        state.groundY-
        o.h;

}


/* =========================================================
   BUFF HUD
   ========================================================= */

function updateBuffHud(){

    const parts=[];

    if(shieldT>0){

        parts.push(
            '🛡 ЩИТ '+
            Math.ceil(shieldT)+
            'с'
        );

    }

    if(gunT>0){

        parts.push(
            '🔫 АК '+
            Math.ceil(gunT)+
            'с'
        );

    }

    buffEl.textContent=
        parts.join(' · ');

}


/* =========================================================
   GAME LOOP
   ========================================================= */

let last=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .033,
            Math.max(
                0,
                (now-last)/1000
            )
        );

    last=now;

    state.groundY=
        Math.floor(H*.70);


    /* =====================================================
       PLAYER BASE POSITION
       ===================================================== */

    if(player.onGround){

        player.y=
            state.groundY-
            player.h;

    }


    /* =====================================================
       GAME UPDATE
       ===================================================== */

    if(
        state.running &&
        !state.over
    ){

        state.t+=dt;

        state.speed=
            Math.min(
                CONFIG.maxSpeed,
                state.speed+
                CONFIG.acceleration*dt
            );

        state.dist+=
            state.speed*
            dt*
            CONFIG.distanceMultiplier;

        scoreEl.textContent=
            Math.floor(state.dist)+
            ' м';


        /* ================================================
           BUFF TIMERS
           ================================================ */

        shieldT=
            Math.max(
                0,
                shieldT-dt
            );

        gunT=
            Math.max(
                0,
                gunT-dt
            );

        updateBuffHud();


        /* ================================================
           GRAVITY
           ================================================ */

        player.vy+=
            CONFIG.gravity*
            (
                player.vy>0
                ?2
                :1
            )*
            dt;

        player.y+=
            player.vy*
            dt;


        if(
            player.y>=
            state.groundY-
            player.h
        ){

            player.y=
                state.groundY-
                player.h;

            player.vy=0;

            player.onGround=true;
            player.jumpsUsed=0;

        }


        /* ================================================
           GUN
           ================================================ */

        if(gunT>0){

            fireAcc+=dt;

            if(
                fireAcc>=
                CONFIG.gunFireRate
            ){

                fireAcc=0;

                const baseY=
                    player.y+46;

                /*
                    Три пули вместо пяти:
                    стрельба остаётся заметной,
                    но не превращается в сплошную стену.
                */

                for(
                    let k=-1;
                    k<=1;
                    k++
                ){

                    const angle=
                        k*.12;

                    bullets.push({

                        x:
                            player.x+
                            player.w+
                            8,

                        y:
                            baseY,

                        vx:
                            CONFIG.bulletSpeed*
                            Math.cos(angle),

                        vy:
                            CONFIG.bulletSpeed*
                            Math.sin(angle),

                        life:.7

                    });

                }

            }

        }else{

            fireAcc=0;

        }


        /* ================================================
           NORMAL OBSTACLE SPAWN
           ================================================ */

        spawnTimer-=dt;

        if(spawnTimer<=0){

            spawnObstacle();

            const difficulty=
                Math.min(
                    .35,
                    state.speed/1600
                );

            spawnTimer=
                CONFIG.obstacleMinSpawn+
                Math.random()*
                (
                    CONFIG.obstacleMaxSpawn-
                    CONFIG.obstacleMinSpawn
                )-
                difficulty;

            spawnTimer=
                Math.max(
                    .45,
                    spawnTimer
                );

        }


        /* ================================================
           POWERUP SPAWN
           ================================================ */

        /*
            Главное исправление.

            Предмет появляется не через 45 секунд,
            а именно после прохождения очередных 3000 м.
        */

        if(
            state.dist>=
            state.nextPowerDistance
        ){

            spawnPowerup();

            state.nextPowerDistance+=
                CONFIG.powerupDistance;

        }


        /* ================================================
           PLAYER BOX
           ================================================ */

        const pBox=
            getPlayerHitbox();


        /* ================================================
           OBJECTS
           ================================================ */

        for(
            let i=
                obstacles.length-1;
            i>=0;
            i--
        ){

            const o=
                obstacles[i];

            o.x-=
                state.speed*dt;

            updateObjectPosition(o);


            /* ============================================
               BULLET COLLISIONS
               ============================================ */

            let destroyed=false;

            if(
                o.type!=='shield' &&
                o.type!=='ak'
            ){

                for(
                    let b=
                        bullets.length-1;
                    b>=0;
                    b--
                ){

                    const bullet=
                        bullets[b];

                    const bulletBox={

                        x:bullet.x,
                        y:bullet.y,
                        w:10,
                        h:4

                    };

                    const oBox=
                        getObstacleHitbox(o);

                    if(
                        hit(
                            bulletBox,
                            oBox
                        )
                    ){

                        boom(
                            o.x+
                            o.w/2,

                            o.y+
                            o.h/2,

                            '#ffe08a',
                            10
                        );

                        bullets.splice(
                            b,
                            1
                        );

                        obstacles.splice(
                            i,
                            1
                        );

                        destroyed=true;

                        break;

                    }

                }

            }

            if(destroyed){
                continue;
            }


            /* ============================================
               PLAYER COLLISION
               ============================================ */

            const oBox=
                getObstacleHitbox(o);


            if(
                hit(
                    pBox,
                    oBox
                )
            ){

                /* ========================================
                   SHIELD PICKUP
                   ======================================== */

                if(
                    o.type==='shield'
                ){

                    /*
                        Ровно 10 секунд.
                    */

                    shieldT=
                        CONFIG.shieldDuration;

                    boom(
                        o.x+
                        o.w/2,

                        o.y+
                        o.h/2,

                        '#35c8ff',
                        18
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                /* ========================================
                   AK PICKUP
                   ======================================== */

                if(
                    o.type==='ak'
                ){

                    gunT=
                        CONFIG.gunDuration;

                    fireAcc=0;

                    boom(
                        o.x+
                        o.w/2,

                        o.y+
                        o.h/2,

                        '#9fef6a',
                        18
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                /* ========================================
                   ACTIVE SHIELD
                   ======================================== */

                if(shieldT>0){

                    boom(
                        o.x+
                        o.w/2,

                        o.y+
                        o.h/2,

                        '#ffffff',
                        14
                    );

                    obstacles.splice(
                        i,
                        1
                    );

                    continue;

                }


                /* ========================================
                   DEATH
                   ======================================== */

                gameOver(o.type);

                break;

            }


            /* ============================================
               OFF SCREEN
               ============================================ */

            if(
                o.x+
                o.w<
                -80
            ){

                obstacles.splice(
                    i,
                    1
                );

            }

        }


        /* ================================================
           BULLETS UPDATE
           ================================================ */

        for(
            let i=
                bullets.length-1;
            i>=0;
            i--
        ){

            const b=
                bullets[i];

            b.x+=
                b.vx*dt;

            b.y+=
                b.vy*dt;

            b.life-=dt;


            if(
                b.life<=0 ||
                b.x>W+40 ||
                b.y<-40 ||
                b.y>H+40
            ){

                bullets.splice(
                    i,
                    1
                );

            }

        }

    }else{

        player.y=
            state.groundY-
            player.h;

    }


    /* =====================================================
       PARTICLES
       ===================================================== */

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.life-=dt;

        p.x+=
            p.vx*dt;

        p.y+=
            p.vy*dt;

        p.vy+=
            400*dt;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }


    /* =====================================================
       DRAW BACKGROUND
       ===================================================== */

    drawBackdrop();


    /* =====================================================
       DRAW OBJECTS
       ===================================================== */

    for(
        const o
        of obstacles
    ){

        if(o.type==='poop'){

            drawPoop(o);

        }else if(o.type==='dick'){

            drawDick(o);

        }else if(o.type==='shield'){

            drawShieldIcon(o);

        }else if(o.type==='ak'){

            drawAkIcon(o);

        }

    }


    /* =====================================================
       DRAW BULLETS
       ===================================================== */

    for(
        const b
        of bullets
    ){

        ctx.save();

        ctx.fillStyle='#ffe08a';
        ctx.shadowColor='#ffe08a';
        ctx.shadowBlur=7;

        ctx.fillRect(
            b.x,
            b.y,
            10,
            3
        );

        ctx.restore();

    }


    /* =====================================================
       DRAW PARTICLES
       ===================================================== */

    for(
        const p
        of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/p.maxLife
            );

        ctx.fillStyle=p.col;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha=1;


    /* =====================================================
       ACTIVE SHIELD
       ===================================================== */

    drawShieldAura();


    /* =====================================================
       PLAYER GUN
       ===================================================== */

    if(
        gunT>0 &&
        state.running
    ){

        drawGun();

    }


    /* =====================================================
       PLAYER DOM
       ===================================================== */

    const heroDoll=
        heroEl.querySelector('.doll');

    if(heroDoll){

        heroDoll.classList.toggle(
            'run',
            state.running &&
            !state.over &&
            player.onGround
        );

    }

    heroEl.style.left=
        player.x+'px';

    heroEl.style.top=
        player.y+'px';


    requestAnimationFrame(loop);

}


requestAnimationFrame(loop);

})();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FUCKRUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:manipulation;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#1a1020;

    font-family:
        ui-monospace,
        Menlo,
        Consolas,
        monospace;

    user-select:none;
}

#wrap{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#3a2460;

    image-rendering:pixelated;
}


/* =========================================================
   PLAYER
   ========================================================= */

#hero{
    position:absolute;

    left:90px;
    top:0;

    width:54px;
    height:96px;

    pointer-events:none;

    z-index:3;
}

.doll{
    position:absolute;

    left:0;
    top:0;

    width:54px;
    height:96px;

    pointer-events:none;
}

.doll.skin-labuba{
    width:72px;
}

.doll .cap{
    position:absolute;

    left:8px;
    top:0;

    width:38px;
    height:16px;

    background:#111;

    border-radius:
        8px 8px 2px 2px;

    z-index:3;
}

.doll .cap:after{
    content:"";

    position:absolute;

    right:-8px;
    bottom:2px;

    width:18px;
    height:6px;

    background:#111;

    border-radius:
        0 6px 6px 0;
}

.doll .tag{
    position:absolute;

    left:8px;
    top:3px;

    width:38px;

    color:#eee;

    font:
        800 7px/1
        sans-serif;

    text-align:center;

    z-index:4;
}

.doll .head{
    position:absolute;

    left:14px;
    top:10px;

    width:26px;
    height:26px;

    background:#f0b48a;

    border-radius:50%;
}

.doll .eye{
    position:absolute;

    top:18px;

    width:4px;
    height:4px;

    background:#222;

    border-radius:50%;
}

.doll .eye.l{
    left:20px;
}

.doll .eye.r{
    left:30px;
}

.doll .shirt{
    position:absolute;

    left:6px;
    top:32px;

    width:42px;
    height:38px;

    background:#2ea44f;

    border-radius:
        8px 8px 4px 4px;
}

.doll .collar{
    position:absolute;

    left:6px;
    top:32px;

    width:42px;
    height:8px;

    background:#217a3a;

    border-radius:
        8px 8px 0 0;
}

.doll .hair,
.doll .chain{
    display:none;
}

.doll .arm{
    position:absolute;

    top:36px;

    width:10px;
    height:24px;

    background:#e0a07a;

    border-radius:5px;

    transform-origin:50% 0;
}

.doll .arm.l{
    left:0;
}

.doll .arm.r{
    right:0;
}

.doll .leg{
    position:absolute;

    bottom:0;

    width:10px;
    height:26px;

    background:#3a2a22;

    border-radius:5px;

    transform-origin:50% 0;
}

.doll .leg.l{
    left:14px;
}

.doll .leg.r{
    right:14px;
}

.doll.run .arm{
    animation:
        arms .32s linear infinite;
}

.doll.run .leg{
    animation:
        legs .32s linear infinite;
}

.doll.run .arm.l,
.doll.run .leg.r{
    animation-direction:reverse;
}


/* BUMBLE */

.doll.skin-bumble .head,
.doll.skin-bumble .arm{
    background:#6b3a22;
}

.doll.skin-bumble .shirt{
    background:#111;
}

.doll.skin-bumble .collar{
    background:#c9a227;
}

.doll.skin-bumble .chain{
    display:block;

    position:absolute;

    left:14px;
    top:40px;

    width:26px;
    height:14px;

    border:
        3px solid #efc44a;

    border-top:0;

    border-radius:
        0 0 14px 14px;

    z-index:5;
}

.doll.skin-bumble .cap,
.doll.skin-bumble .cap:after{
    background:#c9a227;
}

.doll.skin-bumble .tag{
    color:#111;
}


/* LABUBA */

.doll.skin-labuba .head{
    left:22px;

    width:30px;
    height:28px;
}

.doll.skin-labuba .eye.l{
    left:28px;
}

.doll.skin-labuba .eye.r{
    left:42px;
}

.doll.skin-labuba .shirt{
    left:4px;

    width:64px;
    height:42px;

    background:#c45a2a;

    border-radius:16px;
}

.doll.skin-labuba .collar{
    left:4px;

    width:64px;

    background:#8a3a18;
}

.doll.skin-labuba .cap,
.doll.skin-labuba .tag{
    left:16px;
}


/* GIRL */

.doll.skin-girl .hair{
    display:block;

    position:absolute;

    left:10px;
    top:6px;

    width:34px;
    height:28px;

    background:#f2d36b;

    border-radius:
        16px 16px 4px 4px;

    z-index:1;
}

.doll.skin-girl .cap,
.doll.skin-girl .tag,
.doll.skin-girl .collar{
    display:none;
}

.doll.skin-girl .shirt{
    background:#ff7ab0;

    border-radius:
        10px 10px 18px 18px;

    height:42px;
}

.doll.skin-girl .head,
.doll.skin-girl .arm{
    background:#f7c9a8;
}


/* =========================================================
   HUD
   ========================================================= */

#hud{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    color:#fff;

    font-size:15px;
    font-weight:800;

    text-shadow:
        0 2px 0 #000;

    pointer-events:none;

    z-index:10;
}

#buff{
    margin-top:4px;

    color:#9fef6a;

    font-size:12px;
}

#difficultyHud{
    position:absolute;

    top:42px;
    left:10px;

    color:#ffe08a;

    font-size:10px;
    font-weight:800;

    text-shadow:
        0 2px 0 #000;

    pointer-events:none;

    z-index:10;
}

#cityTag{
    position:absolute;

    top:42px;
    left:50%;

    transform:
        translateX(-50%);

    color:#ffe08a;

    font-size:13px;
    font-weight:800;

    text-shadow:
        0 2px 0 #000;

    pointer-events:none;

    z-index:10;

    opacity:0;

    transition:
        opacity .3s;
}


/* =========================================================
   OVERLAY
   ========================================================= */

#overlay{
    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        rgba(8,4,14,.88);

    color:#fff;

    text-align:center;

    padding:16px;

    z-index:50;
}

#overlay h1{
    margin-bottom:8px;

    color:#ff4d6d;

    font-size:26px;

    text-shadow:
        3px 3px 0 #3a0010;
}

#overlay p{
    max-width:360px;

    margin:
        6px 0 16px;

    line-height:1.35;

    opacity:.92;
}

button.main{
    appearance:none;

    border:
        3px solid #fff;

    background:#ff4d6d;

    color:#fff;

    font-family:inherit;

    font-size:17px;
    font-weight:800;

    padding:
        12px 24px;

    cursor:pointer;
}

button.main:disabled{
    opacity:.4;

    cursor:default;
}

.hint{
    margin-top:12px;

    font-size:12px;

    opacity:.7;
}


/* =========================================================
   SCREENS
   ========================================================= */

#screen-pick{
    display:none;

    width:
        min(560px,96vw);

    max-height:94vh;

    overflow:auto;
}

#screen-pick.show{
    display:block;
}

#screen-title.hide{
    display:none;
}


/* =========================================================
   FIGHTERS
   ========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin:
        12px 0 14px;
}

.card{
    min-height:140px;

    padding:
        8px 4px 6px;

    background:#241428;

    border:
        3px solid #5a3a50;

    color:#fff;

    font-family:inherit;

    cursor:pointer;
}

.card .nm{
    margin-bottom:4px;

    color:#ffe08a;

    font-size:12px;
    font-weight:800;
}

.card.sel{
    border-color:#ff4d6d;

    box-shadow:
        0 0 0 3px
        rgba(255,77,109,.35);
}

.stage{
    position:relative;

    height:105px;

    overflow:hidden;
}


/* =========================================================
   DIFFICULTY
   ========================================================= */

.difficulty-title{
    margin:
        2px 0 8px;

    color:#ffe08a;

    font-size:15px;
    font-weight:900;

    text-shadow:
        2px 2px 0 #000;
}

.difficulty-grid{
    display:grid;

    grid-template-columns:
        1fr;

    gap:7px;

    margin-bottom:12px;
}

.difficulty-card{
    appearance:none;

    width:100%;

    padding:
        9px 11px;

    background:#241428;

    border:
        3px solid #5a3a50;

    color:#fff;

    font-family:inherit;

    text-align:left;

    cursor:pointer;
}

.difficulty-card.selected{
    border-color:#ff4d6d;

    background:#32172d;

    box-shadow:
        0 0 0 3px
        rgba(255,77,109,.25);
}

.difficulty-name{
    color:#ffe08a;

    font-size:13px;
    font-weight:900;

    margin-bottom:3px;
}

.difficulty-desc{
    color:#fff;

    font-size:10px;

    line-height:1.3;

    opacity:.72;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes legs{

    0%{
        transform:rotate(28deg);
    }

    50%{
        transform:rotate(-28deg);
    }

    100%{
        transform:rotate(28deg);
    }

}

@keyframes arms{

    0%{
        transform:rotate(-24deg);
    }

    50%{
        transform:rotate(24deg);
    }

    100%{
        transform:rotate(-24deg);
    }

}

@media(max-height:700px){

    #overlay{
        padding:8px;
    }

    #overlay h1{
        font-size:21px;
    }

    .grid{
        gap:6px;

        margin:
            7px 0 8px;
    }

    .card{
        min-height:105px;
    }

    .stage{
        height:78px;
    }

    .difficulty-grid{
        gap:5px;

        margin-bottom:8px;
    }

    .difficulty-card{
        padding:
            6px 9px;
    }

    .difficulty-desc{
        display:none;
    }

}
</style>
</head>

<!-- PLAYER -->

<div id="overlay">

        <h1>FUCKRUNNER</h1>

        <p>

            class="main"
            id="pickBtn"

        </div>

            class="grid"
            id="grid"
        ></div>

            class="difficulty-grid"

                data-difficulty="easy"

                </div>

                class="difficulty-card"
                data-difficulty="normal"
            >

                <div class="difficulty-name">
                    Обычный работяга с завода
                </div>

                    Нормальное количество говна.
                </div>

            </button>


            <button
                class="difficulty-card"
                data-difficulty="hard"
            >

                <div class="difficulty-name">
                    Киборг убийца
                </div>

                <div class="difficulty-desc">
                    Быстро.
                    Препятствий много.
                    Ошибся — умер.
                </div>

            </button>

        </div>


        <button
            class="main"
            id="start"
            disabled
        >
            ПОГНАЛИ
        </button>

    </div>

</div>


<script>
(()=>{

"use strict";


/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if(tg){

    tg.ready();
    tg.expand();

    try{

        tg.setHeaderColor('#2a1630');
        tg.setBackgroundColor('#1a1020');

    }catch(e){}

}


/* =========================================================
   DOM
   ========================================================= */

const canvas =
    document.getElementById('c');

const ctx =
    canvas.getContext('2d');

const overlay =
    document.getElementById('overlay');

const titleScreen =
    document.getElementById('screen-title');

const pickScreen =
    document.getElementById('screen-pick');

const pickButton =
    document.getElementById('pickBtn');

const startButton =
    document.getElementById('start');

const scoreEl =
    document.getElementById('score');

const bestEl =
    document.getElementById('best');

const buffEl =
    document.getElementById('buff');

const difficultyHud =
    document.getElementById('difficultyHud');

const cityTag =
    document.getElementById('cityTag');

const heroEl =
    document.getElementById('hero');

const heroDoll =
    heroEl.querySelector('.doll');

const fighterGrid =
    document.getElementById('grid');

const difficultyGrid =
    document.getElementById('difficultyGrid');


/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG={

    playerX:90,

    playerWidth:54,
    playerHeight:96,

    labubaWidth:72,

    gravity:2400,

    firstJump:-820,
    secondJump:-1160,

    distanceMultiplier:.12,

    powerupDistance:3000,

    shieldDuration:10,

    gunDuration:15,

    gunFireRate:.09,

    bulletSpeed:620,

    maxSpeed:900,

    difficulties:{

        easy:{

            name:'Сосунок ебаный',

            startSpeed:240,

            acceleration:4.5,

            spawnMin:1.35,

            spawnMax:1.95

        },

        normal:{

            name:'Обычный работяга с завода',

            startSpeed:280,

            acceleration:7,

            spawnMin:.95,

            spawnMax:1.55

        },

        hard:{

            name:'Киборг убийца',

            startSpeed:330,

            acceleration:10,

            spawnMin:.65,

            spawnMax:1.05

        }

    }

};


/* =========================================================
   CANVAS
   ========================================================= */

let W=0;
let H=0;
let dpr=1;

function resize(){

    dpr=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=
        Math.floor(W*dpr);

    canvas.height=
        Math.floor(H*dpr);

    canvas.style.width=
        W+'px';

    canvas.style.height=
        H+'px';

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;

}

window.addEventListener(
    'resize',
    resize
);

resize();


/* =========================================================
   CITIES
   ========================================================= */

const CITIES=[

    {
        name:'ЕКАТЕРИНБУРГ',
        src:'../bg_far.jpg'
    },

    {
        name:'ТОЛЬЯТТИ',
        src:'../bg_tlt.jpg'
    },

    {
        name:'УЛЬЯНОВСК',
        src:'../bg_uln.jpg'
    },

    {
        name:'КАЗАНЬ',
        src:'../bg_kzn.jpg'
    },

    {
        name:'ЙОШКАР-ОЛА',
        src:'../bg_yosh.jpg'
    },

    {
        name:'САРАТОВ',
        src:'../bg_sar.jpg'
    },

    {
        name:'САМАРА',
        src:'../bg_sam.jpg'
    }

];

const cityImages=
    CITIES.map(city=>{

        const img=
            new Image();

        img.src=city.src;

        return img;

    });


/* =========================================================
   FIGHTERS
   ========================================================= */

const FIGHTERS=[

    {
        id:'vega',
        name:'Вегамэн',
        tag:'ВЕГА'
    },

    {
        id:'bumble',
        name:'Бамбл Бизи',
        tag:'BEE'
    },

    {
        id:'labuba',
        name:'Лабуба',
        tag:'ЛАБ'
    },

    {
        id:'girl',
        name:'Вагина реалистик',
        tag:''
    }

];


FIGHTERS.forEach(
    fighter=>{

        const button=
            document.createElement('button');

        button.className='card';

        button.dataset.id=
            fighter.id;

        button.innerHTML=`

            <div class="nm">
                ${fighter.name}
            </div>

            <div class="stage">

                <div
                    class="doll skin-${fighter.id}"
                >

                    <div class="hair"></div>

                    <div class="cap"></div>

                    <div class="tag">
                        ${fighter.tag}
                    </div>

                    <div class="head"></div>

                    <div class="eye l"></div>
                    <div class="eye r"></div>

                    <div class="arm l"></div>
                    <div class="arm r"></div>

                    <div class="shirt"></div>

                    <div class="collar"></div>

                    <div class="chain"></div>

                    <div class="leg l"></div>
                    <div class="leg r"></div>

                </div>

            </div>
        `;

        fighterGrid.appendChild(
            button
        );

    }
);


/* =========================================================
   GAME STATE
   ========================================================= */

const state={

    running:false,

    over:false,

    t:0,

    speed:280,

    distance:0,

    groundY:0,

    city:-1,

    difficulty:'easy'

};


/* =========================================================
   PLAYER
   ========================================================= */

const player={

    x:CONFIG.playerX,

    y:0,

    vy:0,

    w:CONFIG.playerWidth,

    h:CONFIG.playerHeight,

    onGround:true,

    jumpsUsed:0

};


/* =========================================================
   OBJECTS
   ========================================================= */

const obstacles=[];
const bullets=[];
const particles=[];


/* =========================================================
   POWERUPS
   ========================================================= */

let shieldTimer=0;
let gunTimer=0;

let fireAccumulator=0;

let nextPowerDistance=
    CONFIG.powerupDistance;


/* =========================================================
   SELECTION
   ========================================================= */

let selectedSkin='vega';

let selectedDifficulty='easy';


/* =========================================================
   BEST
   ========================================================= */

const BEST_KEY=
    'fuckrunner_best';

let best=parseInt(
    localStorage.getItem(BEST_KEY)||'0',
    10
);

bestEl.textContent=
    'лучший счет '+best;


/* =========================================================
   APPLY SKIN
   ========================================================= */

function applySkin(){

    heroEl.className=
        '';

    heroEl.classList.add(
        'skin-'+selectedSkin
    );

    heroDoll.className=
        'doll skin-'+
        selectedSkin;

    const fighter=
        FIGHTERS.find(
            f=>f.id===selectedSkin
        );

    heroDoll
        .querySelector('.tag')
        .textContent=
        fighter?.tag||'';

    player.w=
        selectedSkin==='labuba'
        ?CONFIG.labubaWidth
        :CONFIG.playerWidth;

}


/* =========================================================
   FIGHTER SELECTION
   ========================================================= */

fighterGrid
.querySelectorAll('.card')
.forEach(card=>{

    card.addEventListener(
        'click',
        ()=>{

            fighterGrid
            .querySelectorAll('.card')
            .forEach(c=>{
                c.classList.remove('sel');

                c.querySelector('.doll')
                    ?.classList.remove('run');
            });

            card.classList.add('sel');

            card
                .querySelector('.doll')
                ?.classList.add('run');

            selectedSkin=
                card.dataset.id;

            applySkin();

            startButton.disabled=false;

        }
    );

});


/* =========================================================
   DIFFICULTY SELECTION
   ========================================================= */

difficultyGrid
.querySelectorAll('.difficulty-card')
.forEach(card=>{

    card.addEventListener(
        'click',
        ()=>{

            difficultyGrid
            .querySelectorAll('.difficulty-card')
            .forEach(c=>{
                c.classList.remove(
                    'selected'
                );
            });

            card.classList.add(
                'selected'
            );

            selectedDifficulty=
                card.dataset.difficulty;

        }
    );

});


/* =========================================================
   MENU
   ========================================================= */

pickButton.onclick=()=>{

    titleScreen.classList.add(
        'hide'
    );

    pickScreen.classList.add(
        'show'
    );

};


/* =========================================================
   CITY
   ========================================================= */

function showCity(index){

    if(index===state.city){
        return;
    }

    state.city=index;

    cityTag.textContent=
        CITIES[index].name;

    cityTag.style.opacity='1';

    clearTimeout(
        showCity.timer
    );

    showCity.timer=
        setTimeout(
            ()=>{
                cityTag.style.opacity='0';
            },
            1600
        );

}


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    const difficulty=
        CONFIG.difficulties[

function playRandomTrack(){

        index===lastTrack
    ){

/* =========================================================
   HITBOX
   ========================================================= */

function getPlayerHitbox(){

    /*
        Хитбокс немного уже визуального
        персонажа, чтобы управление
        оставалось честным.
    */

    return {

        x:
            player.x+5,

        y:
            player.y+5,

        w:
            player.w-10,

        h:
            player.h-8

    };

}


function getObstacleHitbox(o){

    /*
        Power-up имеет полный хитбокс.

        У препятствий небольшой
        запас по краям убран.
    */

    if(
        o.type==='poop'
    ){

        return {

            x:o.x+5,
            y:o.y+4,
            w:o.w-10,
            h:o.h-4

        };

    }

    if(
        o.type==='dick'
    ){

        return {

            x:o.x+4,
            y:o.y+3,
            w:o.w-8,
            h:o.h-6

        };

    }

    return {

        x:o.x,
        y:o.y,
        w:o.w,
        h:o.h

    };

}


function hit(a,b){

    return (

        a.x <
        b.x+b.w &&

        a.x+a.w >
        b.x &&

        a.y <
        b.y+b.h &&

        a.y+a.h >
        b.y

    );

}

/* =========================================================
   BACKGROUND
   ========================================================= */

function cityWidth(
    image,
    height
){

    if(
        image &&
        image.complete &&
        image.naturalWidth
    ){

        return Math.max(

            W*.92,

            height*
            (
                image.naturalWidth/
                image.naturalHeight
            )

        );

    }

    return W*.92;

}


function drawCities(groundY){

    const height=
        groundY+6;

    const widths=
        cityImages.map(
            image=>
                cityWidth(
                    image,
                    height
                )
        );

    const total=
        widths.reduce(
            (a,b)=>a+b,
            0
        )||W;

    const scroll=
        (
            state.distance*2.2
        )%total;

    let x=-scroll;

    let visibleCity=
        state.city;

    for(
        let n=0;
        n<CITIES.length*2;
        n++
    ){

        const index=
            n%CITIES.length;

        const width=
            widths[index];

        const image=
            cityImages[index];

        if(
            image &&
            image.complete &&
            image.naturalWidth
        ){

            ctx.drawImage(

                image,

                Math.floor(x),

                0,

                Math.ceil(width)+1,

                Math.ceil(height)

            );

        }

        if(
            x<=W*.35 &&
            x+width>W*.35
        ){

            visibleCity=index;

        }

        x+=width;

        if(x>W+5){
            break;
        }

    }

    if(visibleCity>=0){
        showCity(visibleCity);
    }

}


function drawBackground(){

    const groundY=
        state.groundY;

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            groundY
        );

    gradient.addColorStop(
        0,
        '#3a2460'
    );

    gradient.addColorStop(
        1,
        '#c45a3a'
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        groundY
    );

    drawCities(groundY);


    const roadHeight=
        Math.floor(
            (H-groundY)*.46
        );

    ctx.fillStyle='#5b5b63';

    ctx.fillRect(
        0,
        groundY,
        W,
        roadHeight
    );

    ctx.fillStyle='#4a4a52';

    ctx.fillRect(
        0,
        groundY,
        W,
        8
    );


    const dash=34;

    const shift=
        (
            state.distance/.12
        )%
        (dash*2);

    ctx.fillStyle='#e6d36a';

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            groundY+
                roadHeight*.45,
            20,
            4
        );

    }


    ctx.fillStyle='#7a5a3a';

    ctx.fillRect(
        0,
        groundY+roadHeight,
        W,
        H-groundY-roadHeight
    );


    ctx.fillStyle='#6a4a2e';

    const tile=26;

    const tileShift=
        (
            state.distance/.12
        )%tile;

    for(
        let x=-tile;
        x<W+tile;
        x+=tile
    ){

        ctx.fillRect(
            x-tileShift,
            groundY+
                roadHeight+
                10,
            12,
            4
        );

    }

}

/* =========================================================
   UPDATE OBSTACLES
   ========================================================= */

function updateObstacles(
    dt
){

    const playerBox=
        getPlayerHitbox();


    for(
        let i=
            obstacles.length-1;
        i>=0;
        i--
    ){

        const obstacle=
            obstacles[i];

        obstacle.x-=
            state.speed*dt;


        /*
            Положение препятствий.
        */

        if(
            obstacle.type==='dick'
        ){

            obstacle.y=
                state.groundY-
                obstacle.flyY-
                obstacle.h;

        }else{

            obstacle.y=
                state.groundY-
                obstacle.h-
                (
                    obstacle.type==='shield' ||
                    obstacle.type==='ak'
                    ?10
                    :0
                );

        }


        const obstacleBox=
            getObstacleHitbox(
                obstacle
            );


        /*
            Пули.
        */

        let destroyed=false;

        if(
            obstacle.type!=='shield' &&
            obstacle.type!=='ak'
        ){

            for(
                let b=
                    bullets.length-1;
                b>=0;
                b--
            ){

                const bullet=
                    bullets[b];

                const bulletBox={

                    x:bullet.x,
                    y:bullet.y,
                    w:10,
                    h:4

                };

                if(
                    hit(
                        bulletBox,
                        obstacleBox
                    )
                ){

                    explode(
                        obstacle.x+
                            obstacle.w/2,
                        obstacle.y,
                        '#ffe08a'
                    );

                    bullets.splice(
                        b,
                        1
                    );

                    destroyed=true;

                    break;

                }

            }

        }


        if(destroyed){

            obstacles.splice(
                i,
                1
            );

            continue;

        }


        /*
            Игрок.
        */

        if(
            hit(
                playerBox,
                obstacleBox
            )
        ){

            if(
                obstacle.type==='shield' ||
                obstacle.type==='ak'
            ){

                collectPowerup(
                    obstacle
                );

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            if(shieldTimer>0){

                explode(
                    obstacle.x+
                        obstacle.w/2,
                    obstacle.y,
                    '#ffffff'
                );

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            gameOver(
                obstacle.type
            );

            continue;

        }


        if(
            obstacle.x+
            obstacle.w<
            -60
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE BULLETS
   ========================================================= */

function updateBullets(
    dt
){

    for(
        let i=
            bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];

        bullet.x+=
            bullet.vx*dt;

        bullet.y+=
            bullet.vy*dt;

        bullet.life-=dt;

        if(
            bullet.life<=0 ||
            bullet.x>W+30 ||
            bullet.y<-30 ||
            bullet.y>H+30
        ){

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE PARTICLES
   ========================================================= */

function updateParticles(
    dt
){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.life-=dt;

        p.x+=
            p.vx*dt;

        p.y+=
            p.vy*dt;

        p.vy+=
            420*dt;

        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );

    lastTime=now;


    state.groundY=
        Math.floor(
            H*.70
        );


    if(
        state.running &&
        !state.over
    ){

        state.t+=dt;


        /*
            Скорость.
        */

        const difficulty=
            CONFIG.difficulties[
                state.difficulty
            ];

        state.speed=
            Math.min(
                CONFIG.maxSpeed,
                state.speed+
                difficulty.acceleration*
                dt
            );


        /*
            Дистанция.
        */

        state.distance+=
            state.speed*
            dt*
            CONFIG.distanceMultiplier;

        scoreEl.textContent=
            Math.floor(
                state.distance
            )+
            ' м';


        /*
            Power-up timers.
        */

        shieldTimer=
            Math.max(
                0,
                shieldTimer-dt
            );

        gunTimer=
            Math.max(
                0,
                gunTimer-dt
            );

        updateBuff();


        /*
            Следующий power-up.

            Если игрок пересёк несколько
            порогов за кадр, выдаём их
            последовательно.
        */

        if(
            state.distance>=
            nextPowerDistance
        ){

            spawnPowerup();

            nextPowerDistance+=
                CONFIG.powerupDistance;

        }


        /*
            Гравитация.
        */

        player.vy+=
            CONFIG.gravity*
            (
                player.vy>0
                ?2
                :1
            )*
            dt;

        player.y+=
            player.vy*dt;


        if(
            player.y>=
            state.groundY-
            player.h
        ){

            player.y=
                state.groundY-
                player.h;

            player.vy=0;

            player.onGround=true;

            player.jumpsUsed=0;

        }


        /*
            Автоматическая стрельба.
        */

        if(gunTimer>0){

            fireAccumulator+=dt;

            while(
                fireAccumulator>=
                CONFIG.gunFireRate
            ){

                fireAccumulator-=
                    CONFIG.gunFireRate;

                shoot();

            }

        }else{

            fireAccumulator=0;

        }


        /*
            Spawn обычных препятствий.

            Сложность влияет на интервал,
            но минимальный интервал
            ограничивает невозможные
            комбинации.
        */

        if(
            !loop.spawnTimer
        ){

            loop.spawnTimer=
                difficulty.spawnMin+
                Math.random()*
                (
                    difficulty.spawnMax-
                    difficulty.spawnMin
                );

        }

        loop.spawnTimer-=dt;

        if(
            loop.spawnTimer<=0
        ){

            spawnObstacle();

            const speedProgress=
                Math.min(
                    .15,
                    Math.max(
                        0,
                        (
                            state.speed-
                            difficulty.startSpeed
                        )/3500
                    )
                );

            loop.spawnTimer=
                difficulty.spawnMin+
                Math.random()*
                (
                    difficulty.spawnMax-
                    difficulty.spawnMin
                )-
                speedProgress;

            loop.spawnTimer=
                Math.max(
                    difficulty.spawnMin*.70,
                    loop.spawnTimer
                );

        }


        updateObstacles(dt);

        updateBullets(dt);

    }else{

        player.y=
            state.groundY-
            player.h;

    }


    updateParticles(dt);


    /*
        DRAW
    */

    drawBackground();


    for(
        const obstacle
        of obstacles
    ){

        if(
            obstacle.type==='poop'
        ){

            drawPoop(
                obstacle
            );

        }else if(
            obstacle.type==='dick'
        ){

            drawDick(
                obstacle,
                state.t
            );

        }else if(
            obstacle.type==='shield'
        ){

            drawShield(
                obstacle
            );

        }else if(
            obstacle.type==='ak'
        ){

            drawAK(
                obstacle
            );

        }

    }


    /*
        Bullets.
    */

    for(
        const bullet
        of bullets
    ){

        ctx.fillStyle='#ffe08a';

        ctx.fillRect(
            bullet.x,
            bullet.y,
            10,
            3
        );

    }


    /*
        Particles.
    */

    for(
        const particle
        of particles
    ){

        ctx.globalAlpha=
            Math.max(
                0,
                particle.life*2
            );

        ctx.fillStyle=
            particle.color;

        ctx.fillRect(
            particle.x,
            particle.y,
            5,
            5
        );

    }

    ctx.globalAlpha=1;


    /*
        АК в руках.
    */

    if(
        gunTimer>0 &&
        state.running
    ){

        drawGun();

    }


    /*
        Shield visual around player.
    */

    if(
        shieldTimer>0 &&
        state.running
    ){

        const cx=
            player.x+
            player.w/2;

        const cy=
            player.y+
            player.h/2;

        const radius=
            Math.max(
                player.w,
                player.h
            )*.62+
            Math.sin(
                state.t*7
            )*2;

        ctx.save();

        ctx.globalAlpha=.22;

        ctx.fillStyle='#4db8ff';

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha=.85;

        ctx.strokeStyle='#8bd8ff';

        ctx.lineWidth=2;

        ctx.stroke();

        ctx.restore();

    }


    /*
        DOM player.
    */

    heroEl.style.left=
        player.x+'px';

    heroEl.style.top=
        player.y+'px';

    heroDoll.classList.toggle(
        'run',
        state.running &&
        !state.over &&
        player.onGround
    );


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);


/* =========================================================
   INITIAL PLAYER POSITION
   ========================================================= */

applySkin();

state.groundY=
    Math.floor(H*.70);

player.y=
    state.groundY-
    player.h;

})();
</script>

</body>
</html>

    canvas.width =
        Math.floor(W * DPR);

        Math.floor(H * DPR);

        W + "px";

    canvas.style.height =
        H + "px";

}

/* =========================================================

function getPlayerHitbox(){

    /*
        Небольшое уменьшение по краям
        делает управление честнее,
        но координаты всё равно полностью
        совпадают с физикой.
    */

    return {

        x:
            player.x + 5,

        y:
            player.y + 4,

        w:
            Math.max(
                1,
                player.w - 10
            ),

        h:
            Math.max(
                1,
                player.h - 7
            )

    };

}


function getObstacleHitbox(o){

    /*
        У летящего объекта немного
        уменьшаем вертикальный хитбокс.

        Powerup получает полный хитбокс.
    */

    if(
        o.type === "dick"
    ){

        return {

            x:o.x + 4,
            y:o.y + 2,
            w:o.w - 8,
            h:o.h - 4

        };

    }

    return {

        x:o.x,
        y:o.y,
        w:o.w,
        h:o.h

    };

}


function intersects(a,b){

    return (

        a.x <
        b.x + b.w &&

        a.x + a.w >
        b.x &&

        a.y <
        b.y + b.h &&

        a.y + a.h >
        b.y

    );

}

/* =========================================================
   BACKGROUND
   ========================================================= */

function imageWidth(img,height){

    if(
        img &&
        img.complete &&
        img.naturalWidth
    ){

        return Math.max(

            W * .9,

            height *
            (
                img.naturalWidth /
                img.naturalHeight
            )

        );

    }

    return W * .9;

}


function drawBackground(){

    const gy =
        state.groundY;

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            gy
        );

    sky.addColorStop(
        0,
        "#342052"
    );

    sky.addColorStop(
        1,
        "#cf6543"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        W,
        gy
    );

    drawCities(gy);

    const roadHeight =
        Math.floor(
            (H - gy) * .46
        );

    ctx.fillStyle =
        "#595960";

    ctx.fillRect(
        0,
        gy,
        W,
        roadHeight
    );

    ctx.fillStyle =
        "#47474e";

    ctx.fillRect(
        0,
        gy,
        W,
        8
    );

    const dash = 38;

    const shift =
        (
            state.distance * 2
        ) %
        (dash * 2);

    ctx.fillStyle =
        "#e5d46d";

    for(
        let x=-dash;
        x<W+dash;
        x+=dash*2
    ){

        ctx.fillRect(
            x-shift,
            gy + roadHeight*.45,
            22,
            4
        );

    }

    ctx.fillStyle =
        "#76552f";

    ctx.fillRect(
        0,
        gy + roadHeight,
        W,
        H - gy - roadHeight
    );

}


function drawCities(gy){

    const height =
        gy + 5;

    const widths =
        cityImages.map(
            img =>
                imageWidth(
                    img,
                    height
                )
        );

    const total =
        widths.reduce(
            (a,b) => a+b,
            0
        );

    const scroll =
        (
            state.distance * 1.7
        ) % total;

    let x = -scroll;

    for(
        let repeat=0;
        repeat<3;
        repeat++
    ){

        for(
            let i=0;
            i<CITIES.length;
            i++
        ){

            const img =
                cityImages[i];

            const width =
                widths[i];

            if(
                img.complete &&
                img.naturalWidth
            ){

                ctx.drawImage(
                    img,
                    Math.floor(x),
                    0,
                    Math.ceil(width)+1,
                    Math.ceil(height)
                );

            }

            if(
                x <= W*.4 &&
                x+width > W*.4
            ){

                toastCity(i);

            }

            x += width;

        }

    }

}

/* =========================================================
   PHYSICS
   ========================================================= */

function updatePlayer(dt){

    player.vy +=
        player.gravity * dt;

    player.y +=
        player.vy * dt;

    const floor =
        state.groundY -
        player.h;

    if(
        player.y >= floor
    ){

        player.y = floor;

        player.vy = 0;

        player.onGround = true;

        player.jumps = 0;

    }else{

        player.onGround = false;

    }

}


/* =========================================================
   OBSTACLE POSITION
   ========================================================= */

function updateObstaclePosition(o){

    if(
        o.type === "dick"
    ){

        o.y =
            state.groundY -
            o.flyY -
            o.h;

        return;

    }

    if(
        o.type === "shield" ||
        o.type === "ak"
    ){

        o.y =
            state.groundY -
            o.h -
            18;

        return;

    }

    o.y =
        state.groundY -
        o.h;

}


/* =========================================================
   GAME UPDATE
   ========================================================= */

function updateGame(dt){

    if(
        !state.running ||
        state.gameOver
    ){

        return;

    }

    const difficulty =
        DIFFICULTIES[
            selectedDifficulty
        ];

    state.time += dt;

    /*
        Скорость всегда начинается
        с медленной и постепенно растёт.
    */

    state.speed =
        Math.min(
            difficulty.maxSpeed,

            state.speed +
            difficulty.acceleration *
            dt
        );

    state.distance +=
        state.speed *
        dt *
        .12;

    scoreEl.textContent =
        Math.floor(
            state.distance
        ) + " м";


    /* ---------- buffs ---------- */

    shieldTime =
        Math.max(
            0,
            shieldTime - dt
        );

    gunTime =
        Math.max(
            0,
            gunTime - dt
        );

    shieldGlow.classList.toggle(
        "active",
        shieldTime > 0
    );


    const buffs = [];

    if(shieldTime > 0){

        buffs.push(
            "ЩИТ " +
            Math.ceil(
                shieldTime
            ) +
            "с"
        );

    }

    if(gunTime > 0){

        buffs.push(
            "АК " +
            Math.ceil(
                gunTime
            ) +
            "с"
        );

    }

    buffEl.textContent =
        buffs.join(" · ");


    /* ---------- player ---------- */

    updatePlayer(dt);


    /* ---------- gun ---------- */

    if(gunTime > 0){

        fireTimer -= dt;

        if(fireTimer <= 0){

            fire();

            fireTimer = .12;

        }

    }


    /* ---------- normal spawn ---------- */

    spawnTimer -= dt;

    if(spawnTimer <= 0){

        spawnObstacle();

    }


    /*
        Powerups привязаны к дистанции,
        а не к времени.

        Поэтому щит/АК действительно
        появляются каждые 3000 метров.
    */

    if(
        state.distance >=
        state.nextPowerDistance
    ){

        spawnPowerup();

        state.nextPowerDistance +=
            3000;

    }


    /* ---------- obstacles ---------- */

    const playerBox =
        getPlayerHitbox();

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            state.speed *
            dt;

        updateObstaclePosition(o);


        /* ---------- bullets ---------- */

        let destroyed = false;

        for(
            let b=bullets.length-1;
            b>=0;
            b--
        ){

            const bullet =
                bullets[b];

            const bulletBox = {

                x:bullet.x,
                y:bullet.y,
                w:11,
                h:4

            };

            const obstacleBox =
                getObstacleHitbox(o);

            /*
                Пули не собирают powerup.
            */

            if(
                o.type !== "shield" &&
                o.type !== "ak" &&
                intersects(
                    bulletBox,
                    obstacleBox
                )
            ){

                explosion(
                    o.x +
                    o.w/2,

                    o.y,

                    "#ffe06b"
                );

                obstacles.splice(
                    i,
                    1
                );

                bullets.splice(
                    b,
                    1
                );

                destroyed = true;

                break;

            }

        }

        if(destroyed){
            continue;
        }


        /* ---------- player ---------- */

        const obstacleBox =
            getObstacleHitbox(o);

        if(
            intersects(
                playerBox,
                obstacleBox
            )
        ){

            /*
                POWERUPS
            */

            if(
                o.type === "shield" ||
                o.type === "ak"
            ){

                collectPowerup(
                    o.type,
                    o.x + o.w/2,
                    o.y + o.h/2
                );

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            /*
                ЩИТ:
                столкновение поглощается.
            */

            if(shieldTime > 0){

                explosion(
                    o.x +
                    o.w/2,

                    o.y +
                    o.h/2,

                    "#bcecff"
                );

                obstacles.splice(
                    i,
                    1
                );

                continue;

            }


            /*
                Обычная смерть.
            */

            endGame(
                o.type
            );

            return;

        }


        /* ---------- remove ---------- */

        if(
            o.x + o.w <
            -60
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }


    /* ---------- bullets ---------- */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.x +=
            b.vx * dt;

        b.y +=
            b.vy * dt;

        b.life -= dt;

        if(
            b.life <= 0 ||
            b.x > W+30 ||
            b.y < -30 ||
            b.y > H+30
        ){

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   PARTICLES UPDATE
   ========================================================= */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.life -= dt;

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            500 * dt;

        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DRAW OBJECTS
   ========================================================= */

function drawObjects(){

    for(
        const o of obstacles
    ){

        if(o.type === "poop"){

            drawPoop(o);

        }else if(
            o.type === "dick"
        ){

            drawDick(o);

        }else if(
            o.type === "shield"
        ){

            drawShield(o);

        }else if(
            o.type === "ak"
        ){

            drawAK(o);

        }

    }

}


/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets(){

    ctx.fillStyle =
        "#ffe36d";

    for(
        const b of bullets
    ){

        ctx.fillRect(
            b.x,
            b.y,
            11,
            3
        );

    }

}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life * 2
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   DOM PLAYER
   ========================================================= */

function syncPlayerDOM(){

    /*
        Никакого CSS translate,
        который мог бы расходиться
        с физикой.

        left/top напрямую соответствуют
        player.x/player.y.
    */

    heroEl.style.left =
        player.x + "px";

    heroEl.style.top =
        player.y + "px";

}


/* =========================================================
   ANIMATION STATE
   ========================================================= */

function updateAnimation(){

    if(
        state.running &&
        !state.gameOver &&
        player.onGround
    ){

        dollEl.classList.add(
            "running"
        );

    }else{

        dollEl.classList.remove(
            "running"
        );

    }

}


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );

    lastTime = now;


    /*
        Даже когда игра стоит,
        фон и DOM остаются корректными.
    */

    updateGame(dt);

    updateParticles(dt);


    /* ---------- draw ---------- */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawObjects();

    drawBullets();

    drawParticles();


    if(
        gunTime > 0 &&
        state.running
    ){

        drawPlayerGun();

    }


    syncPlayerDOM();

    updateAnimation();

    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

resize();

applySkin();

resetPlayer();

requestAnimationFrame(
    loop
);

})();
</script>
